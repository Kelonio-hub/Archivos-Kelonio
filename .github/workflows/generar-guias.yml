name: Generar guias.json

on:
  push:
    paths:
      - "guias/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar guias.json
        run: python scripts/generar_guias_json.py

      - name: Commit si hay cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar guias.json automáticamente"
