name: Actualizar Radar de Noticias

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar parser RSS/Atom
        run: npm install rss-parser
      - name: Ejecutar RadarBot
        run: node radar/update_radar.js
      - name: Subir cambios
        run: |
          git config user.name 'RadarBot'
          git config user.email 'actions@github.com'
          git add radar/ultimas_noticias.json
          git diff --cached --quiet || (git commit -m 'chore: radar actualizado [skip ci]' && git push)
