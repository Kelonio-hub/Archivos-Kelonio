<style>

/* ================= VARIABLES Y TEMA AUTOMÁTICO/MANUAL ================= */
:root, :root[data-theme="dark"] {
  --red: #00aaff; 
  --glow-rgb: 0, 170, 255; 
  --bg: #141414;
  --text-main: #ffffff;
  --text-muted: #aaa;
  --glass: rgba(20,20,20,.78);
  --glass-border: rgba(255,255,255,.08);
  --topbar-bg: rgba(0,0,0,.88);
  --card-bg: rgba(255,255,255,0.05);
  --input-bg: rgba(255,255,255,.08);
  --btn-bg: rgba(255,255,255,.05);
  --icon-color: #ffffff;
  --loader-border: rgba(255,255,255,0.1);
  --gold: #ffcc00;
}

:root[data-theme="light"] {
  --bg: #f8f9fa;
  --text-main: #141414;
  --text-muted: #555555;
  --glass: rgba(255,255,255,.9);
  --glass-border: rgba(0,0,0,.15);
  --topbar-bg: rgba(255,255,255,.95);
  --card-bg: #ffffff;
  --input-bg: rgba(0,0,0,.05);
  --btn-bg: rgba(0,0,0,.05);
  --icon-color: #333333;
  --loader-border: rgba(0,0,0,0.1);
  --gold: #d4af37;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f8f9fa; --text-main: #141414; --text-muted: #555555; --glass: rgba(255,255,255,.9);
    --glass-border: rgba(0,0,0,.15); --topbar-bg: rgba(255,255,255,.95); --card-bg: #ffffff;
    --input-bg: rgba(0,0,0,.05); --btn-bg: rgba(0,0,0,.05); --icon-color: #333333; --loader-border: rgba(0,0,0,0.1);
  }
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text-main); overflow-x:hidden; transition: background 0.3s, color 0.3s; min-height: 100vh; }

/* ================= TOPBAR ================= */
.topbar { position:fixed; top:0; left:0; right:0; z-index:9999; background:var(--topbar-bg); backdrop-filter:blur(16px); display:flex; justify-content:space-between; align-items:center; padding:8px 3%; gap: 10px; transition: background 0.3s; }
.topbar-left { display:flex; align-items:center; gap: 15px; flex-shrink: 0; }
.logo { font-size:1.8rem; font-weight:900; color:var(--red); letter-spacing:-1.5px; transition: color 0.3s ease; text-decoration: none; cursor: pointer;}
.social-group { display: flex; gap: 4px; border-left: 1px solid var(--glass-border); padding-left: 15px; transition: border-color 0.3s; }

.social-icon-btn { background:transparent; border:none; cursor: pointer; color: var(--icon-color); opacity: 0.55; transition: 0.3s; display: flex; align-items: center; justify-content: center; padding: 4px; position: relative;}
.social-icon-btn:hover { opacity: 1; transform: scale(1.15); color: var(--red); }
.radar-badge { position:absolute; top:-2px; right:-2px; width:10px; height:10px; background:var(--red); border-radius:50%; box-shadow:0 0 8px var(--red); display: none; }

.right-tools { display:flex; align-items:center; gap:12px; flex-shrink: 0; }
.config-group { display:flex; flex-direction:column; align-items:center; gap:4px; }
.theme-dots-container { display:flex; gap:5px; align-items: center;}
.color-dot { width:12px; height:12px; border-radius:50%; cursor:pointer; border:1px solid rgba(0,0,0,0.4); transition:transform .2s, border-color .2s; }
.color-dot:hover { transform:scale(1.3); }
.color-dot.active-dot { border:2px solid var(--text-main); transform:scale(1.15); box-shadow: 0 0 8px rgba(128,128,128,0.6); }

#languageSelector { background:var(--input-bg); border:1px solid var(--glass-border); color:var(--text-main); padding:4px 8px; border-radius:6px; outline: none; cursor: pointer; font-size:11px; transition: 0.3s; }
#languageSelector option { background: var(--bg); color: var(--text-main); }

#productSearch { background:var(--input-bg); border:1px solid transparent; color:var(--text-main); width:170px; padding:8px 14px; border-radius:50px; font-size:13px; outline:none; transition: width 0.3s ease, border-color 0.3s, background 0.3s; }
#productSearch:focus { width: 200px; border-color: var(--red); }
#productSearch::placeholder { color:var(--text-muted); }

/* ================= ANIMACIÓN CARRITO ================= */
.hero-cart-icon { width: 60px; height: 60px; fill: var(--red); filter: drop-shadow(0 0 12px rgba(var(--glow-rgb), 0.5)); flex-shrink: 0; }
.cart-pulse { display: inline-block; animation: cartPulse 2.5s infinite ease-in-out; }
@keyframes cartPulse {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(var(--glow-rgb), 0.4)); }
  50% { transform: scale(1.15); filter: drop-shadow(0 0 25px rgba(var(--glow-rgb), 0.8)); }
}

/* ================= APP & HEADER ================= */
#mainApp { display:block; padding-top: 50px; } /* Ajustado de 85px a 50px para eliminar el hueco */

.header-section { padding: 15px 5% 20px; text-align: center; background: linear-gradient(to bottom, rgba(var(--glow-rgb),0.08) 0%, var(--bg) 100%); transition: background 0.3s; }
.header-title-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 15px; }
.header-section h1 { font-size: 3.5rem; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 20px; margin: 0 auto; letter-spacing: 0.5px; }
.header-section p { color: var(--text-muted); font-size: 1.2rem; max-width: 650px; margin: 0 auto; transition: color 0.3s; }

/* ================= CONSOLE BUTTONS ================= */
.console-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; padding: 5px 5%; }
.console-btn { background: var(--btn-bg); border: 1px solid var(--glass-border); border-radius: 10px; padding: 8px 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: .3s ease; color: var(--text-main); font-weight: 700; font-size: 12px; white-space: nowrap; }
.console-btn:hover { transform: scale(1.05); border-color: var(--red); background: rgba(var(--glow-rgb),.15); }
.console-btn.active { border-color: var(--red); background: rgba(var(--glow-rgb),.25); box-shadow: 0 0 10px rgba(var(--glow-rgb), 0.5); }
.console-btn span { color: var(--text-main); letter-spacing: .5px; transition: color 0.3s; }
.console-btn img { width: 18px; height: 18px; object-fit: contain; filter: drop-shadow(0 0 2px rgba(0,0,0,0.5)); }

/* ================= SUBCATEGORY FILTERS ================= */
.subcategories-filter-wrapper { width: 90%; max-width: 1300px; margin: 0 auto 15px auto; display: flex; flex-direction: column; gap: 10px; }
.subcat-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
.subcat-filter-btn { background: var(--btn-bg); border: 1px solid var(--glass-border); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; margin-bottom: 5px; }
.subcat-filter-btn:hover { border-color: var(--red); color: var(--text-main); }
.subcat-filter-btn.active { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 0 10px rgba(var(--glow-rgb), 0.4); }

/* ================= BANNER PRIME ================= */
.prime-banner { display: flex; align-items: center; justify-content: space-between; background: linear-gradient(90deg, rgba(var(--glow-rgb), 0.12), var(--card-bg)); border: 1px solid var(--glass-border); border-left: 4px solid var(--red); border-radius: 10px; padding: 10px 20px; margin: 0 auto 15px auto; width: 90%; max-width: 1300px; gap: 15px; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; }
.prime-banner:hover { transform: translateY(-2px); border-color: var(--red); box-shadow: 0 4px 15px rgba(var(--glow-rgb), 0.25); }
.prime-banner-img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
.prime-banner-info { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.prime-banner-info strong { font-size: 14px; color: var(--text-main); letter-spacing: 0.5px; }
.prime-banner-info p { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prime-banner-btn { background: var(--red); color: white; border: none; border-radius: 6px; padding: 8px 18px; font-weight: 700; font-size: 12px; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: filter 0.2s; }
.prime-banner-btn:hover { filter: brightness(1.2); }

/* ================= GRID DE PRODUCTOS ================= */
.row { padding: 20px 5%; }
.row h2 { margin-bottom: 20px; font-size: 2rem; color: var(--text-main); text-transform: uppercase; }
.products-grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; padding-bottom: 15px; }

/* ================= TARJETAS SIMÉTRICAS DE PRODUCTOS ================= */
.card { min-width: 300px; width: 300px; background: var(--card-bg); border-radius: 16px; overflow: hidden; transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease; display: flex; flex-direction: column; position: relative; border: 1px solid var(--glass-border); cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.card:hover { transform: scale(1.03); z-index: 20; border-color: var(--red); box-shadow: 0 0 30px rgba(var(--glow-rgb), 0.3), 0 15px 30px rgba(0,0,0,0.2); }
.card img { width: 100%; height: 180px; object-fit: cover; flex-shrink: 0; background: #000; }
.card-badge { position: absolute; top: 12px; left: 12px; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); color: #fff; padding: 4px 10px; border-radius: 30px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; border: 1px solid rgba(255,255,255,0.15); pointer-events: none; }
.card-size-badge { position: absolute; top: 12px; right: 12px; background: var(--red); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
.card-info { padding: 18px 18px 10px 18px; flex-grow: 1; display: flex; flex-direction: column; }
.card-info strong { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; font-size: 16px; white-space: normal; color: var(--text-main); }
.card-info p { font-size: 13.5px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-info .price-tag { color: var(--gold); font-weight: bold; margin-top: auto; padding-top: 8px; font-size: 15px; }

.card-actions { display: grid; grid-template-columns: 1fr 1fr; padding: 0 15px 15px 15px; gap: 8px; margin-top: auto; }
.action-btn { padding: 10px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s; background: var(--btn-bg); color: var(--text-main); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; gap: 6px; border: 1px solid var(--glass-border); }
.action-btn:hover { transform: translateY(-3px); background: var(--input-bg); border-color: var(--text-muted); }
.action-btn > svg { width: 18px; height: 18px; }
.buy-btn { background: var(--red); color: white; border-color: var(--red); }
.buy-btn:hover { background: var(--red); filter: brightness(1.2); border-color: var(--red); color: white; }

/* ================= PAGINACIÓN ================= */
.pagination { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; flex-wrap: wrap; margin: 20px 0; }
.page-btn { background: var(--btn-bg); border: 1px solid var(--glass-border); color: var(--text-main); padding: 8px 14px; border-radius: 6px; cursor: pointer; transition: all .3s ease; font-weight: bold; font-size: 13px; }
.page-btn:hover { border-color: var(--red); background: rgba(var(--glow-rgb),.15); }
.page-btn.active { background: var(--red); border-color: var(--red); color: white; box-shadow: 0 0 10px rgba(var(--glow-rgb), 0.5); }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

/* ================= MODAL IMAGEN ================= */
#imageModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(12px); justify-content: center; align-items: center; z-index: 10000; padding: 20px; }
#imageModal img { max-width: 95%; max-height: 95vh; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); }
#imageModal .modal-close { position: absolute; top: 25px; right: 30px; font-size: 40px; color: #fff; cursor: pointer; transition: transform 0.2s; }
#imageModal .modal-close:hover { transform: scale(1.2); color: var(--red); }

/* ================= BOTÓN SUBIR ================= */
#backToTopBtn { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 9998; background: var(--red); color: white; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: opacity 0.3s, transform 0.3s; }
#backToTopBtn:hover { transform: scale(1.1); }

/* ================= RESPONSIVE ================= */
@media(max-width: 1150px) { .topbar { flex-wrap: wrap; padding: 10px 4%; justify-content: center; } .topbar-left { order: 1; } .right-tools { order: 2; margin-top: 5px; flex-wrap: wrap; justify-content: center; } }
@media(max-width: 900px) { #productSearch { width: 140px; } #productSearch:focus { width: 160px; } .card { min-width: 240px; width: 240px; } }
@media(max-width: 650px) { .right-tools { width: 100%; gap: 15px; } #productSearch { width: 100%; order: 3; margin-top: 10px; } #productSearch:focus { width: 100%; } .config-group { flex-direction: row; order: 2; gap: 15px; justify-content: center; width: 100%; } .header-section { padding-top: 150px; } }
@media(max-width: 768px) { .prime-banner { padding: 10px; width: 95%; } .prime-banner-info p { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } }

</style>

<script>
  /* PRE-CARGA TEMA */
  (function() {
    const savedMode = localStorage.getItem('selectedMode');
    if (savedMode === 'dark' || savedMode === 'light') { document.documentElement.setAttribute('data-theme', savedMode); }
    const savedTheme = localStorage.getItem('selectedThemeColor');
    if (savedTheme) {
      const paleta = {
        rojo: { hex: '#e50914', rgb: '229, 9, 20' }, naranja: { hex: '#ff6600', rgb: '255, 102, 0' }, amarillo: { hex: '#ffcc00', rgb: '255, 204, 0' },
        verde: { hex: '#2ecc71', rgb: '46, 204, 113' }, azul: { hex: '#00aaff', rgb: '0, 170, 255' }, violeta: { hex: '#9b59b6', rgb: '155, 89, 182' }, rosa: { hex: '#ff80ab', rgb: '255, 128, 171' }
      };
      const theme = paleta[savedTheme];
      if (theme) {
        document.documentElement.style.setProperty('--red', theme.hex);
        document.documentElement.style.setProperty('--glow-rgb', theme.rgb);
      }
    }
  })();
</script>

function initThemeDots() {
  const savedTheme = localStorage.getItem('selectedThemeColor') || 'azul';
  const savedMode = localStorage.getItem('selectedMode') || 'dark';
  const container = document.getElementById('themeDots');
  container.innerHTML = '';
  
  Object.keys(paletaTemas).forEach(colorKey => {
    const dot = document.createElement('div');
    dot.className = 'color-dot theme-color-dot';
    dot.style.backgroundColor = paletaTemas[colorKey].hex;
    if (colorKey === savedTheme) dot.classList.add('active-dot');
    dot.addEventListener('click', () => {
      document.querySelectorAll('.theme-color-dot').forEach(d => d.classList.remove('active-dot'));
      dot.classList.add('active-dot');
      localStorage.setItem('selectedThemeColor', colorKey);
      applyTheme(colorKey);
    });
    container.appendChild(dot);
  });

  // Separador visual
  const separador = document.createElement('div');
  separador.style.width = '2px';
  separador.style.backgroundColor = 'var(--glass-border)';
  separador.style.margin = '0 6px';
  separador.style.borderRadius = '2px';
  container.appendChild(separador);

  // Botón MODO OSCURO
  const dotOscuro = document.createElement('div');
  dotOscuro.className = 'color-dot mode-dot';
  dotOscuro.style.backgroundColor = '#141414';
  dotOscuro.style.border = '1px solid #555';
  dotOscuro.setAttribute('title', 'Forzar Modo Oscuro');
  
  // Botón MODO CLARO
  const dotClaro = document.createElement('div');
  dotClaro.className = 'color-dot mode-dot';
  dotClaro.style.backgroundColor = '#f8f9fa';
  dotClaro.style.border = '1px solid #ccc';
  dotClaro.setAttribute('title', 'Forzar Modo Claro');

  if (savedMode === 'dark') {
    dotOscuro.classList.add('active-dot');
    document.documentElement.setAttribute('data-theme', 'dark');
  } else if (savedMode === 'light') {
    dotClaro.classList.add('active-dot');
    document.documentElement.setAttribute('data-theme', 'light');
  }

  dotOscuro.addEventListener('click', () => {
    document.querySelectorAll('.mode-dot').forEach(d => d.classList.remove('active-dot'));
    dotOscuro.classList.add('active-dot');
    localStorage.setItem('selectedMode', 'dark');
    document.documentElement.setAttribute('data-theme', 'dark');
  });

  dotClaro.addEventListener('click', () => {
    document.querySelectorAll('.mode-dot').forEach(d => d.classList.remove('active-dot'));
    dotClaro.classList.add('active-dot');
    localStorage.setItem('selectedMode', 'light');
    document.documentElement.setAttribute('data-theme', 'light');
  });

  container.appendChild(dotOscuro);
  container.appendChild(dotClaro);
  applyTheme(savedTheme);
}

function applyTheme(colorKey) {
  const theme = paletaTemas[colorKey] || paletaTemas.azul;
  document.documentElement.style.setProperty('--red', theme.hex);
  document.documentElement.style.setProperty('--glow-rgb', theme.rgb);
}

  const langs = { en:'English', es:'Español', fr:'Français', it:'Italiano', pt:'Português', de:'Deutsch', ja:'日本語', ko:'한국어' };

  Object.keys(langs).forEach(code=>{
    const opt = document.createElement('option'); opt.value = code; opt.textContent = langs[code];
    selector.appendChild(opt);
  });
  const browserLang = (navigator.language || 'en').split('-')[0].toLowerCase();
  if(translations[browserLang]) idiomaActual = browserLang;
  selector.value = idiomaActual;
  selector.addEventListener('change', e => {
    idiomaActual = e.target.value;
    updateLanguage();
    if (allProducts.length > 0) {
      renderConsoleButtons();
      renderPrimeProduct();
      generarBarraSubcategoriasYCapacidades(); 
      renderProducts(categoriaActual, document.getElementById('productSearch').value);
    }
  });
}

/* ================= GENERADOR DE SUBFILTROS ================= */
function generarBarraSubcategoriasYCapacidades() {
  const subcatRow = document.getElementById('subcategoriesFilterRow');
  const rowGB = document.getElementById('sizesGBRow');
  const rowTB = document.getElementById('sizesTBRow');
  const t = translations[idiomaActual] || translations.es;
  
  subcatRow.innerHTML = ''; rowGB.innerHTML = ''; rowTB.innerHTML = '';
  subcatRow.style.display = 'none'; rowGB.style.display = 'none'; rowTB.style.display = 'none';

  let productosCategoria = allProducts.filter(item => {
    if (!item.console) return false;
    if (categoriaActual.toLowerCase() === '3ds_nds') {
      if (Array.isArray(item.console)) return item.console.some(c => c.toLowerCase() === '3ds' || c.toLowerCase() === 'nds');
      return item.console.toLowerCase() === '3ds' || item.console.toLowerCase() === 'nds';
    }
    if (Array.isArray(item.console)) return item.console.some(c => c.toLowerCase() === categoriaActual.toLowerCase());
    return item.console.toLowerCase() === categoriaActual.toLowerCase();
  });

  if (productosCategoria.length === 0) return;

  let subcatsUnicas = new Set();
  productosCategoria.forEach(p => {
    if (p.subcategory) {
      if (Array.isArray(p.subcategory)) p.subcategory.forEach(sub => { if(sub !== 'Ninguno') subcatsUnicas.add(sub); });
      else if (p.subcategory !== 'Ninguno') subcatsUnicas.add(p.subcategory);
    }
  });

  if (subcatsUnicas.size > 0) {
    subcatRow.style.display = 'flex';
    const btnAll = document.createElement('button');
    btnAll.className = `subcat-filter-btn ${subcategoriaSeleccionada === 'ALL' ? 'active' : ''}`;
    btnAll.textContent = t.all;
    btnAll.onclick = () => { subcategoriaSeleccionada = 'ALL'; paginaActual = 1; generarBarraSubcategoriasYCapacidades(); renderProducts(categoriaActual); };
    subcatRow.appendChild(btnAll);

    let listaSubcats = Array.from(subcatsUnicas).sort((a, b) => {
      let indexA = subcatOrder.indexOf(a); let indexB = subcatOrder.indexOf(b);
      if (indexA === -1) indexA = 999; if (indexB === -1) indexB = 999;
      return indexA - indexB;
    });

    listaSubcats.forEach(sub => {
      const btn = document.createElement('button');
      btn.className = `subcat-filter-btn ${subcategoriaSeleccionada === sub ? 'active' : ''}`;
      btn.textContent = subcatTranslations[sub] ? (subcatTranslations[sub][idiomaActual] || subcatTranslations[sub]['es']) : sub;
      btn.onclick = () => { subcategoriaSeleccionada = sub; paginaActual = 1; generarBarraSubcategoriasYCapacidades(); renderProducts(categoriaActual); };
      subcatRow.appendChild(btn);
    });
  }

  if (categoriaActual === 'SD/USB') {
    rowGB.style.display = 'flex'; rowTB.style.display = 'flex';
    let tamanosUnicos = new Set();
    productosCategoria.forEach(p => { if (p.size && p.size !== 'Ninguno') tamanosUnicos.add(p.size); });

    let listaTamanos = Array.from(tamanosUnicos).sort((a, b) => {
      let numA = parseInt(a), numB = parseInt(b);
      if (a.includes('TB') && !b.includes('TB')) return 1;
      if (!a.includes('TB') && b.includes('TB')) return -1;
      return numA - numB;
    });

    if (listaTamanos.length > 0) {
      const btnAllSize = document.createElement('button');
      btnAllSize.className = `subcat-filter-btn ${tamanoSeleccionado === 'ALL' ? 'active' : ''}`;
      btnAllSize.textContent = t.all + " (Capacidad)";
      btnAllSize.onclick = () => { tamanoSeleccionado = 'ALL'; paginaActual = 1; generarBarraSubcategoriasYCapacidades(); renderProducts(categoriaActual); };
      rowGB.appendChild(btnAllSize);

      listaTamanos.forEach(tam => {
        const btnSize = document.createElement('button');
        btnSize.className = `subcat-filter-btn ${tamanoSeleccionado === tam ? 'active' : ''}`;
        btnSize.textContent = tam;
        btnSize.onclick = () => { tamanoSeleccionado = tam; paginaActual = 1; generarBarraSubcategoriasYCapacidades(); renderProducts(categoriaActual); };
        if (tam.includes('TB')) rowTB.appendChild(btnSize); else rowGB.appendChild(btnSize);
      });
    }
  }
}

  try {
    const baseUrl = 'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/productos/';
    const archivos = ['switch.json', 'playstation.json', 'xbox.json', '3ds.json', 'nds.json', 'wii.json', 'sd_usb.json'];
    const promesas = archivos.map(archivo => fetch(baseUrl + archivo + '?v=' + new Date().getTime()).then(res => res.ok ? res.json() : []).catch(() => []));
    const resultadosArrays = await Promise.all(promesas);
    
    allProducts = resultadosArrays.flatMap((array, index) => {
      return array.map((item, subIndex) => {
        item.id = `prod-${index}-${subIndex}`;
        if (!item._originFile) item._originFile = archivos[index];
        return item;
      });
    });
    
    renderPrimeProduct(); generarBarraSubcategoriasYCapacidades(); renderProducts(categoriaActual);
  } catch (error) {
    document.getElementById('productsGrid').innerHTML = `<p style="color:var(--red); font-size:18px; padding:20px 0;">Error al cargar el catálogo de productos.</p>`;
  }
}

/* ================= BANNER PRIME ================= */
function renderPrimeProduct() {
  const banner = document.getElementById('primeBanner');
  const t = translations[idiomaActual] || translations.es;
  const label = PRODUCTO_PRIME.label[idiomaActual] || PRODUCTO_PRIME.label.es;
  const desc = PRODUCTO_PRIME.desc[idiomaActual] || PRODUCTO_PRIME.desc.es;
  
  banner.innerHTML = `
    <img src="${PRODUCTO_PRIME.img}" class="prime-banner-img" alt="${label}">
    <div class="prime-banner-info"><strong>${label}</strong><p>${desc.replace(/\n/g, ' — ')}</p></div>
    <button class="prime-banner-btn">${t.buy}</button>
  `;
  banner.onclick = () => window.open(PRODUCTO_PRIME.url, '_blank');
  banner.style.display = 'flex';
}

/* ================= CREADOR DE TARJETAS ================= */
function createProductCard(item, container) {
  const card = document.createElement('div');
  card.className = 'card'; card.dataset.id = item.id;
  
  const t = translations[idiomaActual] || translations.es;
  const label = item.label?.[idiomaActual] || item.label?.es || 'Producto';
  const desc = item.desc?.[idiomaActual] || item.desc?.es || '';
  
  let price = item.price || ''; 
  let finalDesc = desc;
  if (!price && desc.includes('\n')) {
    const lines = desc.split('\n'); finalDesc = lines[0] || ''; price = lines[1] || '';
  }

  const iconCart = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>`;
  const iconZoom = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>`;

  let badgeHtml = '';
  if (item.subcategory && item.subcategory !== 'Ninguno') {
    const subcats = Array.isArray(item.subcategory) ? item.subcategory : [item.subcategory];
    const translatedBadges = subcats.map(sub => subcatTranslations[sub] ? (subcatTranslations[sub][idiomaActual] || subcatTranslations[sub]['es']) : sub);
    badgeHtml = `<div class="card-badge">${translatedBadges.join(', ').toUpperCase()}</div>`;
  }
  const sizeBadgeHtml = (item.size && item.size !== 'Ninguno') ? `<div class="card-size-badge">${item.size}</div>` : '';

  card.innerHTML = `
    ${badgeHtml}${sizeBadgeHtml}
    <img src="${item.img}" loading="lazy" alt="${label}">
    <div class="card-info">
      <strong>${label}</strong><p>${finalDesc}</p>${price ? `<div class="price-tag">${price}</div>` : ''}
    </div>
    <div class="card-actions">
      <button class="action-btn buy-btn" title="${t.buy}">${iconCart} <span>${t.buy}</span></button>
      <button class="action-btn zoom-btn" title="${t.zoom}">${iconZoom} <span>${t.zoom}</span></button>
    </div>
  `;

  card.onclick = () => window.open(item.url, '_blank');
  card.querySelector('.buy-btn').onclick = (e) => { e.stopPropagation(); window.open(item.url, '_blank'); };
  card.querySelector('.zoom-btn').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('enlargedImage').src = item.img;
    document.getElementById('imageModal').style.display = 'flex';
  };
  container.appendChild(card);
}

/* ================= RENDERIZADO PRINCIPAL ================= */
function renderProducts(catId, searchTerm = '') {
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = '';
  const t = translations[idiomaActual] || translations.es;

  let filtered = allProducts.filter(item => item.label?.es !== "Amazon Prime" && !(item.label?.es && item.label.es.toLowerCase().includes("amazon prime")));

  if (searchTerm.trim() !== '') {
    const term = searchTerm.toLowerCase().trim();
    filtered = filtered.filter(item => {
      const label = (item.label?.[idiomaActual] || item.label?.es || '').toLowerCase();
      const desc = (item.desc?.[idiomaActual] || item.desc?.es || '').toLowerCase();
      return label.includes(term) || desc.includes(term);
    });
    document.getElementById('currentCategoryTitle').textContent = t.results.toUpperCase();
    document.getElementById('subcategoriesFilterRow').style.display = 'none';
    document.getElementById('sizesGBRow').style.display = 'none';
    document.getElementById('sizesTBRow').style.display = 'none';
  } else {
    filtered = filtered.filter(item => {
      if (!item.console) return false;
      const itemConsole = Array.isArray(item.console) ? item.console.map(c => c.toLowerCase()) : [item.console.toLowerCase()];
      const targetCat = catId.toLowerCase();
      return targetCat === '3ds_nds' ? (itemConsole.includes('3ds') || itemConsole.includes('nds')) : itemConsole.includes(targetCat);
    });
    if (subcategoriaSeleccionada !== 'ALL') {
      filtered = filtered.filter(item => {
        if (Array.isArray(item.subcategory)) return item.subcategory.some(s => s.toLowerCase() === subcategoriaSeleccionada.toLowerCase());
        return item.subcategory?.toLowerCase() === subcategoriaSeleccionada.toLowerCase();
      });
    }
    if (catId === 'SD/USB' && tamanoSeleccionado !== 'ALL') filtered = filtered.filter(item => item.size === tamanoSeleccionado);
  }

  if (filtered.length === 0) {
    grid.innerHTML = `<p style="color:var(--text-muted); font-size:18px; padding:20px 0;">No se encontraron productos con los filtros seleccionados.</p>`;
    document.getElementById('paginationContainerTop').innerHTML = ''; document.getElementById('paginationContainerBottom').innerHTML = '';
    return;
  }

  const totalPages = Math.ceil(filtered.length / itemsPorPagina);
  if (paginaActual > totalPages) paginaActual = totalPages || 1; 

  const startIndex = (paginaActual - 1) * itemsPorPagina;
  const pagedItems = filtered.slice(startIndex, startIndex + itemsPorPagina);

  pagedItems.forEach(item => createProductCard(item, grid));
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const containerTop = document.getElementById('paginationContainerTop');
  const containerBottom = document.getElementById('paginationContainerBottom');
  containerTop.innerHTML = ''; containerBottom.innerHTML = '';

  if (totalPages <= 1) return;

  const buildPaginationButtons = (container) => {
    const prevBtn = document.createElement('button');
    prevBtn.className = 'page-btn'; prevBtn.textContent = '←'; prevBtn.disabled = paginaActual === 1;
    prevBtn.onclick = () => { paginaActual--; renderProducts(categoriaActual, document.getElementById('productSearch').value); window.scrollTo({ top: document.getElementById('rowsContainer').offsetTop - 80, behavior: 'smooth' }); };
    container.appendChild(prevBtn);

    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= paginaActual - 2 && i <= paginaActual + 2)) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === paginaActual ? 'active' : ''}`;
        pageBtn.textContent = i;
        pageBtn.onclick = () => { paginaActual = i; renderProducts(categoriaActual, document.getElementById('productSearch').value); window.scrollTo({ top: document.getElementById('rowsContainer').offsetTop - 80, behavior: 'smooth' }); };
        container.appendChild(pageBtn);
      } else if (i === paginaActual - 3 || i === paginaActual + 3) {
        const dots = document.createElement('span'); dots.textContent = '...'; dots.style.color = 'var(--text-main)'; container.appendChild(dots);
      }
    }

    const nextBtn = document.createElement('button');
    nextBtn.className = 'page-btn'; nextBtn.textContent = '→'; nextBtn.disabled = paginaActual === totalPages;
    nextBtn.onclick = () => { paginaActual++; renderProducts(categoriaActual, document.getElementById('productSearch').value); window.scrollTo({ top: document.getElementById('rowsContainer').offsetTop - 80, behavior: 'smooth' }); };
    container.appendChild(nextBtn);
  };

  buildPaginationButtons(containerTop); buildPaginationButtons(containerBottom);
}

/* ================= EVENTOS Y SEARCH ================= */
let debounceTimer;
const searchInput = document.getElementById('productSearch');
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    paginaActual = 1; const val = searchInput.value;
    if(val.trim() !== '') {
      document.getElementById('primeBanner').style.display = 'none';
      document.querySelectorAll('.console-btn').forEach(b => b.classList.remove('active')); 
    } else {
      document.getElementById('primeBanner').style.display = 'flex';
      document.getElementById('currentCategoryTitle').textContent = (categories.find(c => c.id === categoriaActual).label[idiomaActual] || categories.find(c => c.id === categoriaActual).label.es).toUpperCase();
      document.querySelectorAll('.console-btn').forEach(btn => { if(btn.textContent.includes(categories.find(c => c.id === categoriaActual).label.es)) btn.classList.add('active'); });
      generarBarraSubcategoriasYCapacidades(); 
    }
    renderProducts(categoriaActual, val);
  }, 300); 
});

/* ================= MODAL IMAGEN Y SCROLL ================= */
const modal = document.getElementById('imageModal');
const close = document.getElementById('imageModalClose');
close.onclick = () => modal.style.display = 'none';
modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

const mybutton = document.getElementById("backToTopBtn");
window.onscroll = function() {
  if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) mybutton.style.display = "block";
  else mybutton.style.display = "none";
};

/* ================= INICIO ================= */
window.onload = () => {
  initThemeDots();
  createLanguageSelector();
  updateLanguage();
  renderConsoleButtons();
  cargarProductos();
};
</script>
</body>
