<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Productos | La Presa</title>
<link rel="icon" type="image/gif" href="https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Lucario.gif">
<style>
:root{
  --red:#e50914; 
  --bg:#141414;
  --glass:rgba(20,20,20,.78);
  --glass-border:rgba(255,255,255,.08);
  --accent:#00aaff;
  --gold:#ffcc00;
  --discord:#5865F2; 
  --kofi:#FF5E5B;    
}
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  font-family:'Segoe UI',sans-serif;
  background:#141414;
  color:white;
  overflow-x:hidden;
  min-height: 100vh;
}
/* ================= TOPBAR ================= */
.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:9999;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(16px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 3%; 
  gap: 10px; 
}
.logo{
  font-size:1.8rem; 
  font-weight:900;
  color:var(--red);
  letter-spacing:-1.5px;
  transition: color 0.3s ease;
  flex-shrink: 0;
  cursor: pointer;
}
.right-tools{
  display:flex;
  align-items:center;
  gap:12px; 
  flex-shrink: 0;
}
.config-group{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.theme-dots-container{
  display:flex;
  gap:5px;
}
.color-dot{
  width:12px; 
  height:12px;
  border-radius:50%;
  cursor:pointer;
  border:1px solid rgba(0,0,0,0.4);
  transition:transform .2s, border-color .2s;
}
.color-dot:hover{
  transform:scale(1.3);
}
.color-dot.active-dot{
  border:2px solid white;
  transform:scale(1.15);
  box-shadow: 0 0 8px rgba(255,255,255,0.6);
}
#languageSelector{
  background:rgba(0,0,0,.8);
  border:1px solid var(--glass-border);
  color:#fff;
  padding:4px 8px; 
  border-radius:6px;
  outline: none;
  cursor: pointer;
  font-size:11px; 
}
#productSearch{
  background:rgba(255,255,255,.08);
  border:none;
  color:white;
  width:170px; 
  padding:8px 14px; 
  border-radius:50px;
  font-size:13px; 
  outline:none;
  transition: width 0.3s ease;
}
#productSearch:focus {
  width: 200px;
  border: 1px solid var(--red);
}
#productSearch::placeholder{
  color:#ccc;
}

/* ================= CONSOLE BUTTONS ================= */
.console-buttons{
  display:flex;
  gap:6px; 
  flex-grow: 1; 
  justify-content: center;
  overflow-x: auto;
  scrollbar-width: none; 
  -ms-overflow-style: none; 
  padding: 5px 0; 
}
.console-buttons::-webkit-scrollbar {
  display: none; 
}
.console-btn{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px; 
  padding:6px 10px; 
  display:flex;
  align-items:center;
  gap:6px; 
  cursor:pointer;
  transition: .3s ease;
  color:white;
  font-weight:700;
  font-size: 11px; 
  white-space: nowrap; 
  flex-shrink: 0; 
}
.console-btn:hover{
  transform:scale(1.05);
  border-color:var(--red);
  background:rgba(var(--glow-rgb),.15);
}
.console-btn.active{
  border-color:var(--red);
  background:rgba(var(--glow-rgb),.25);
  box-shadow: 0 0 10px rgba(var(--glow-rgb), 0.5);
}
.console-btn span{
  color:white;
  letter-spacing:.5px;
}
.console-btn img{
  width:18px; 
  height:18px;
  object-fit:contain;
}
.console-btn .home-icon-btn {
  font-size: 16px; 
  color: white;
  width: 18px; 
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ================= APP ================= */
#mainApp{
  display:block;
  padding-top:70px; 
}
/* ================= ROWS & CAROUSELS ================= */
.row{
  padding:25px 5%;
}
.row h2{
  margin-bottom:20px;
  font-size:2rem;
  color: white;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}
.row.featured h2 {
  color: var(--red);
}
.carousel{
  display:flex;
  gap:16px;
  overflow-x:auto;
  scroll-behavior:smooth;
  padding-bottom:15px;
}
.carousel::-webkit-scrollbar{
  display:none;
}

/* ================= BANNER AMAZON PRIME ================= */
#primeBannerContainer {
  display: none;
  width: 90%;
  max-width: 1200px;
  margin: 20px auto 10px auto;
  background: linear-gradient(135deg, rgba(0, 170, 255, 0.08), rgba(0, 170, 255, 0.02));
  border: 1px solid rgba(0, 170, 255, 0.3);
  border-radius: 12px;
  padding: 15px 25px;
  align-items: center;
  gap: 20px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
}
#primeBannerContainer:hover {
  transform: scale(1.015);
  box-shadow: 0 10px 30px rgba(0, 170, 255, 0.15);
  border-color: rgba(0, 170, 255, 0.6);
}
#primeBannerContainer img {
  width: 140px;
  height: 80px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
}
.prime-banner-info {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.prime-banner-info strong {
  font-size: 19px;
  color: var(--accent);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.prime-banner-info p {
  font-size: 14.5px;
  color: #ddd;
  line-height: 1.5;
}
.prime-banner-btn {
  background: var(--accent);
  color: #fff;
  font-weight: bold;
  padding: 12px 24px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.3s ease, transform 0.2s ease;
  font-size: 14px;
}
.prime-banner-btn:hover {
  background: #0088cc;
  transform: translateY(-2px);
}
@media (max-width: 768px) {
  #primeBannerContainer {
    flex-direction: column;
    text-align: center;
    padding: 20px;
  }
  #primeBannerContainer img {
    width: 100%;
    height: auto;
    max-width: 250px;
  }
  .prime-banner-btn {
    width: 100%;
    margin-top: 10px;
  }
}

/* ================= CARDS SIMÉTRICAS ================= */
.card{
  min-width:300px;
  width: 300px;
  background:rgba(255,255,255,.05);
  border-radius:16px;
  overflow:hidden;
  transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
  display: flex;
  flex-direction: column;
  position: relative;
  border: 1px solid rgba(255,255,255,.1);
  cursor: pointer;
}
.card:hover{
  transform:scale(1.03);
  z-index:20;
  border-color: var(--red);
  box-shadow: 0 0 30px rgba(var(--glow-rgb, 229, 9, 20), 0.45), 0 15px 30px rgba(0,0,0,0.6);
}
.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  flex-shrink: 0;
  background: #000;
}
.card-info{
  padding:18px 18px 10px 18px;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
}
.card-info strong{
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 8px;
  font-size:16px;
  white-space: normal;
}
.card-info p{
  font-size:13.5px;
  color:#ccc;
  line-height:1.4;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-info .price-tag {
  color: var(--gold);
  font-weight: bold;
  margin-top: auto;
  padding-top: 8px;
  font-size: 15px;
}

/* ================= SECCIÓN DE ACCIONES ================= */
.card-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 0 15px 15px 15px;
  gap: 8px;
  margin-top: auto;
}
.action-btn {
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  background: rgba(255,255,255,0.08);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 12px;
  gap: 6px;
}
.action-btn:hover {
  transform: translateY(-3px);
  filter: brightness(1.3);
}
.action-btn > svg {
  width: 18px;
  height: 18px;
}
.buy-btn {
  background: var(--red);
}
.zoom-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
}

/* ================= TARJETAS MÁS PEQUEÑAS (TOP VENTAS) ================= */
.card.card-recent{
  min-width:210px;
  width: 210px;
}
.card.card-recent img{
  height: 140px;
}
.card.card-recent .card-info{
  padding: 12px 12px 6px 12px;
}
.card.card-recent .card-info strong{
  font-size: 14px;
  -webkit-line-clamp: 1;
}
.card.card-recent .card-info p{
  font-size: 12px;
  -webkit-line-clamp: 2;
}

/* ================= PAGINACIÓN ================= */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  width: 100%;
  flex-wrap: wrap;
}
#paginationContainerTop {
  margin-bottom: 20px;
}
#paginationContainerBottom {
  margin-top: 30px;
}
.page-btn {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  color: white;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  transition: all .3s ease;
  font-weight: bold;
  font-size: 13px;
}
.page-btn:hover {
  border-color: var(--red);
  background: rgba(var(--glow-rgb),.15);
}
.page-btn.active {
  background: var(--red);
  border-color: var(--red);
  box-shadow: 0 0 10px rgba(var(--glow-rgb), 0.5);
}
.page-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  pointer-events: none;
}

/* ================= MODAL IMAGEN ================= */
#imageModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(12px);
  justify-content: center;
  align-items: center;
  z-index: 10000;
  padding: 20px;
}
#imageModal img {
  max-width: 95%;
  max-height: 95vh;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.9);
}
#imageModal .modal-close {
  position: absolute;
  top: 25px;
  right: 30px;
  font-size: 40px;
  color: #fff;
  cursor: pointer;
  transition: transform 0.2s;
}
#imageModal .modal-close:hover {
  transform: scale(1.2);
  color: var(--red);
}

/* ================= BOTÓN SUBIR ARRIBA ================= */
#backToTopBtn {
  display: none;
  position: fixed;
  bottom: 30px;
  right: 30px;
  z-index: 9998;
  background: var(--red);
  color: white;
  border: none;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  cursor: pointer;
  font-size: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: opacity 0.3s, transform 0.3s;
}
#backToTopBtn:hover {
  transform: scale(1.1);
}

/* ================= RESPONSIVE ================= */
@media(max-width:1100px){
  .topbar {
    flex-wrap: wrap;
    justify-content: space-between;
    padding: 10px 5%;
  }
  .console-buttons {
    order: 3;
    width: 100%;
    margin: 8px 0 0 0;
    justify-content: flex-start;
  }
  .logo { order: 1; }
  .right-tools { order: 2; }
}

@media(max-width:900px){
  #productSearch{ width:140px; }
  #productSearch:focus { width: 160px; }
  .card{ min-width:240px; width: 240px; }
  .card.card-recent{ min-width:180px; width: 180px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo" onclick="window.location.href='index.html'">LA PRESA</div>
  
  <div class="console-buttons" id="consoleButtons"></div>

  <div class="right-tools">
    <input 
      type="text" 
      id="productSearch" 
      placeholder="Buscar productos..."
      autocomplete="off"
    >
    <div class="config-group">
      <div class="theme-dots-container" id="themeDots"></div>
      <select id="languageSelector"></select>
    </div>
  </div>
</div>

<div id="mainApp">
  <div id="featuredContainer" style="display:none">
    
    <div id="primeBannerContainer"></div>
    
    <div class="row featured" id="bestsellersRow" style="display:none;">
      <h2 id="titleBestsellers">TOP VENTAS</h2>
      <div class="carousel" id="bestsellersCarousel"></div>
    </div>
  </div>
  
  <div id="rowsContainer">
    <div class="row">
      <h2 id="currentCategoryTitle" style="font-size:2.5rem;">SWITCH</h2>
      <div id="paginationContainerTop" class="pagination"></div>
      
      <div class="carousel" id="productsGrid" style="flex-wrap: wrap; overflow: visible;"></div>
      
      <div id="paginationContainerBottom" class="pagination"></div>
    </div>
  </div>
</div>

<div id="imageModal">
  <span class="modal-close" id="imageModalClose">×</span>
  <img id="enlargedImage" src="" alt="Imagen ampliada">
</div>

<button id="backToTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>

<script>
/* ================= TRANSLACIONES ================= */
const translations = {
  en: { title: "Products | La Presa", search: "Search products...", topVentas: "TOP SALES", home: "Home", buy: "View", zoom: "Enlarge", results: "Search Results", primeTitle: "AMAZON PRIME" },
  es: { title: "Productos | La Presa", search: "Buscar productos...", topVentas: "TOP VENTAS", home: "Inicio", buy: "Ver", zoom: "Ampliar", results: "Resultados de búsqueda", primeTitle: "AMAZON PRIME" },
  fr: { title: "Produits | La Presa", search: "Rechercher...", topVentas: "TOP VENTES", home: "Accueil", buy: "Voir", zoom: "Agrandir", results: "Résultats de recherche", primeTitle: "AMAZON PRIME" },
  it: { title: "Prodotti | La Presa", search: "Cerca prodotti...", topVentas: "TOP VENDITE", home: "Inizio", buy: "Vedi", zoom: "Ingrandisci", results: "Risultati di ricerca", primeTitle: "AMAZON PRIME" },
  pt: { title: "Produtos | La Presa", search: "Buscar productos...", topVentas: "TOP VENDAS", home: "Início", buy: "Ver", zoom: "Ampliar", results: "Resultados da pesquisa", primeTitle: "AMAZON PRIME" },
  de: { title: "Produkte | La Presa", search: "Produkte suchen...", topVentas: "TOP VERKÄUFE", home: "Startseite", buy: "Ansehen", zoom: "Vergrößern", results: "Suchergebnisse", primeTitle: "AMAZON PRIME" },
  ja: { title: "製品 | La Presa", search: "製品を検索...", topVentas: "トップセールス", home: "ホーム", buy: "見る", zoom: "拡大", results: "検索結果", primeTitle: "AMAZON PRIME" },
  ko: { title: "제품 | La Presa", search: "제품 검색...", topVentas: "인기 상품", home: "홈", buy: "보기", zoom: "확대", results: "검색 결과", primeTitle: "AMAZON PRIME" }
};

/* ================= GLOBAL ================= */
let idiomaActual = 'es';
let allProducts = [];
let categoriaActual = 'Switch';
let paginaActual = 1;
const itemsPorPagina = 24; 

const categories = [
  { id: 'Switch',    icon: 'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%20Switch.png', label: { es: 'SWITCH', en: 'SWITCH' } },
  { id: 'PS5',       icon: 'https://api.iconify.design/ri:playstation-line.svg?color=%23ffffff', label: { es: 'PLAYSTATION', en: 'PLAYSTATION' } },
  { id: 'Xbox',      icon: 'https://api.iconify.design/ri:xbox-line.svg?color=%23ffffff', label: { es: 'XBOX', en: 'XBOX' } },
  { id: '3DS_NDS',   icon: 'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%203DS.png', label: { es: '3DS / NDS', en: '3DS / NDS' } },
  { id: 'Wii/WiiU',  icon: 'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%20Wii.png', label: { es: 'WII / WII U', en: 'WII / WII U' } },
  { id: 'SD/USB',    icon: 'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%20SD.png', label: { es: 'SD / USB', en: 'SD / USB' } }
];

const featuredIds = [1, 2, 3, 11, 13, 16, 62, 64, 8, 18, 4];

/* ================= TEMAS ================= */
const paletaTemas = {
  rojo:     { hex: '#e50914', rgb: '229, 9, 20' },
  naranja:  { hex: '#ff6600', rgb: '255, 102, 0' },
  amarillo: { hex: '#ffcc00', rgb: '255, 204, 0' },
  verde:    { hex: '#2ecc71', rgb: '46, 204, 113' },
  azul:     { hex: '#00aaff', rgb: '0, 170, 255' },
  violeta:  { hex: '#9b59b6', rgb: '155, 89, 182' },
  rosa:     { hex: '#ff80ab', rgb: '255, 128, 171' }
};

function initThemeDots() {
  const savedTheme = localStorage.getItem('selectedThemeColor') || 'rojo';
  const container = document.getElementById('themeDots');
  container.innerHTML = '';
  
  Object.keys(paletaTemas).forEach(colorKey => {
    const dot = document.createElement('div');
    dot.className = 'color-dot';
    dot.style.backgroundColor = paletaTemas[colorKey].hex;
    if (colorKey === savedTheme) dot.classList.add('active-dot');
    
    dot.addEventListener('click', () => {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active-dot'));
      dot.classList.add('active-dot');
      localStorage.setItem('selectedThemeColor', colorKey);
      applyTheme(colorKey);
    });
    
    container.appendChild(dot);
  });
  applyTheme(savedTheme);
}

function applyTheme(colorKey) {
  const theme = paletaTemas[colorKey] || paletaTemas.rojo;
  document.documentElement.style.setProperty('--red', theme.hex);
  document.documentElement.style.setProperty('--glow-rgb', theme.rgb);
}

/* ================= IDIOMAS ================= */
function createLanguageSelector(){
  const selector = document.getElementById('languageSelector');
  const langs = {
    en:'English', es:'Español', fr:'Français', it:'Italiano',
    pt:'Português', de:'Deutsch', ja:'日本語', ko:'한국어'
  };
  Object.keys(langs).forEach(code=>{
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = langs[code];
    selector.appendChild(opt);
  });
  
  const browserLang = (navigator.language || 'en').split('-')[0].toLowerCase();
  if(translations[browserLang]) idiomaActual = browserLang;
  
  selector.value = idiomaActual;
  selector.addEventListener('change', e => {
    idiomaActual = e.target.value;
    updateLanguage();
    if (allProducts.length > 0) {
      renderConsoleButtons();
      renderProducts(categoriaActual, document.getElementById('productSearch').value);
    }
  });
}

function updateLanguage(){
  const t = translations[idiomaActual] || translations.es;
  document.title = t.title;
  document.getElementById('productSearch').placeholder = t.search;
  document.getElementById('titleBestsellers').textContent = t.topVentas;
  // Actualizar banner si los productos ya están cargados
  if (allProducts.length > 0) renderPrimeBanner(); 
}

/* ================= TOPBAR BOTONES DE CONSOLA ================= */
function renderConsoleButtons(){
  const container = document.getElementById('consoleButtons');
  container.innerHTML = '';
  const t = translations[idiomaActual] || translations.es;

  const homeBtn = document.createElement('button');
  homeBtn.className = 'console-btn';
  const iconHome = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>`;
  homeBtn.innerHTML = `<div class="home-icon-btn">${iconHome}</div><span>${t.home}</span>`;
  homeBtn.onclick = () => window.location.href = 'index.html';
  container.appendChild(homeBtn);

  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = `console-btn ${cat.id === categoriaActual ? 'active' : ''}`;
    btn.innerHTML = `<img src="${cat.icon}"><span>${cat.label[idiomaActual] || cat.label.es}</span>`;
    
    btn.onclick = () => {
      document.querySelectorAll('.console-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      categoriaActual = cat.id;
      paginaActual = 1; 
      document.getElementById('productSearch').value = ''; 
      document.getElementById('featuredContainer').style.display = 'block'; 
      document.getElementById('currentCategoryTitle').textContent = (cat.label[idiomaActual] || cat.label.es).toUpperCase();
      renderProducts(cat.id, '');
    };
    container.appendChild(btn);
  });
}

/* ================= CARGA DE DATOS MULTI-ARCHIVOS NUEVOS ================= */
async function cargarProductos() {
  try {
    const baseUrl = 'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/';
    const archivos = [
      'switch.json', 'playstation.json', 'xbox.json', '3ds.json', 
      'nds.json', 'wii_wii_u.json', 'sd_usb.json'
    ];

    const promesas = archivos.map(archivo => 
      fetch(baseUrl + archivo + '?v=' + new Date().getTime())
        .then(res => res.ok ? res.json() : [])
        .catch(() => []) 
    );

    const resultadosArrays = await Promise.all(promesas);
    allProducts = resultadosArrays.flat();
    
    renderPrimeBanner(); // <-- Renderizar el banner al cargar los productos
    renderProducts(categoriaActual);

  } catch (error) {
    console.error('Error cargando productos:', error);
    document.getElementById('productsGrid').innerHTML = 
      `<p style="color:var(--red); font-size:18px; padding:20px 0;">Error al cargar el catálogo de productos.</p>`;
  }
}

/* ================= RENDER BANNER PRIME ================= */
function renderPrimeBanner() {
  const primeProduct = allProducts.find(item => item.label?.es === "Amazon Prime");
  const bannerContainer = document.getElementById('primeBannerContainer');
  
  if (!primeProduct) {
     bannerContainer.style.display = 'none';
     return;
  }
  
  const t = translations[idiomaActual] || translations.es;
  const label = primeProduct.label?.[idiomaActual] || primeProduct.label?.es || 'Amazon Prime';
  const desc = primeProduct.desc?.[idiomaActual] || primeProduct.desc?.es || '';
  
  bannerContainer.innerHTML = `
    <img src="${primeProduct.img}" alt="Amazon Prime">
    <div class="prime-banner-info">
      <strong>${label}</strong>
      <p>${desc.replace(/\n/g, '<br>')}</p>
    </div>
    <button class="prime-banner-btn">${t.buy}</button>
  `;
  
  bannerContainer.style.display = 'flex';
  
  // Hacer que el click en el botón o todo el banner abra el link
  bannerContainer.onclick = () => window.open(primeProduct.url, '_blank');
  bannerContainer.querySelector('.prime-banner-btn').onclick = (e) => {
    e.stopPropagation();
    window.open(primeProduct.url, '_blank');
  };
}

/* ================= CREADOR DE TARJETAS INTELIGENTE ================= */
function createProductCard(item, container, isMini = false) {
  const card = document.createElement('div');
  card.className = isMini ? 'card card-recent' : 'card';
  
  const t = translations[idiomaActual] || translations.es;
  const label = item.label?.[idiomaActual] || item.label?.es || 'Producto';
  const desc = item.desc?.[idiomaActual] || item.desc?.es || '';
  
  let price = item.price || ''; 
  let finalDesc = desc;

  if (!price && desc.includes('\n')) {
    const lines = desc.split('\n');
    finalDesc = lines[0] || '';
    price = lines[1] || '';
  }

  const iconCart = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>`;
  const iconZoom = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>`;

  card.innerHTML = `
    <img src="${item.img}" loading="lazy" alt="${label}">
    <div class="card-info">
      <strong>${label}</strong>
      <p>${finalDesc}</p>
      ${price ? `<div class="price-tag">${price}</div>` : ''}
    </div>
    <div class="card-actions">
      <button class="action-btn buy-btn" title="${t.buy}">${iconCart} <span>${t.buy}</span></button>
      <button class="action-btn zoom-btn" title="${t.zoom}">${iconZoom} <span>${t.zoom}</span></button>
    </div>
  `;

  card.onclick = () => window.open(item.url, '_blank');
  
  card.querySelector('.buy-btn').onclick = (e) => {
    e.stopPropagation();
    window.open(item.url, '_blank');
  };

  card.querySelector('.zoom-btn').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('enlargedImage').src = item.img;
    document.getElementById('imageModal').style.display = 'flex';
  };

  container.appendChild(card);
}

/* ================= RENDERIZADO PRINCIPAL CON FILTRADO UNIFICADO ================= */
function renderProducts(catId, searchTerm = '') {
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = '';
  const t = translations[idiomaActual] || translations.es;

  // 1. Filtrar los productos de "Amazon Prime"
  let filtered = allProducts.filter(item => item.label?.es !== "Amazon Prime");

  // 2. Filtrar por Búsqueda o Categoría
  if (searchTerm.trim() !== '') {
    const term = searchTerm.toLowerCase().trim();
    filtered = filtered.filter(item => {
      const label = (item.label?.[idiomaActual] || item.label?.es || '').toLowerCase();
      const desc = (item.desc?.[idiomaActual] || item.desc?.es || '').toLowerCase();
      return label.includes(term) || desc.includes(term);
    });
    document.getElementById('currentCategoryTitle').textContent = t.results.toUpperCase();
  } else {
    // UNIFICACIÓN DE FILTRO: Si se elige 3DS_NDS, junta los productos guardados como "3DS" y como "NDS"
    if (catId === '3DS_NDS') {
      filtered = filtered.filter(item => item.console === '3DS' || item.console === 'NDS');
    } else {
      filtered = filtered.filter(item => item.console === catId);
    }
  }

  // 3. Manejar estado vacío
  if (filtered.length === 0) {
    grid.innerHTML = `<p style="color:#aaa; font-size:18px; padding:20px 0;">No se encontraron productos.</p>`;
    document.getElementById('paginationContainerTop').innerHTML = '';
    document.getElementById('paginationContainerBottom').innerHTML = '';
    return;
  }

  // 4. Aplicar Paginación
  const totalPages = Math.ceil(filtered.length / itemsPorPagina);
  if (paginaActual > totalPages) paginaActual = 1; 

  const startIndex = (paginaActual - 1) * itemsPorPagina;
  const endIndex = startIndex + itemsPorPagina;
  const pagedItems = filtered.slice(startIndex, endIndex);

  // 5. Renderizar tarjetas
  pagedItems.forEach(item => createProductCard(item, grid, false));

  // 6. Renderizar paginación
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const containerTop = document.getElementById('paginationContainerTop');
  const containerBottom = document.getElementById('paginationContainerBottom');
  
  containerTop.innerHTML = '';
  containerBottom.innerHTML = '';

  if (totalPages <= 1) return;

  const buildPaginationButtons = (container) => {
    const prevBtn = document.createElement('button');
    prevBtn.className = 'page-btn';
    prevBtn.textContent = '←';
    prevBtn.disabled = paginaActual === 1;
    prevBtn.onclick = () => {
      paginaActual--;
      renderProducts(categoriaActual, document.getElementById('productSearch').value);
      window.scrollTo({ top: document.getElementById('rowsContainer').offsetTop - 80, behavior: 'smooth' });
    };
    container.appendChild(prevBtn);

    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= paginaActual - 2 && i <= paginaActual + 2)) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === paginaActual ? 'active' : ''}`;
        pageBtn.textContent = i;
        pageBtn.onclick = () => {
          paginaActual = i;
          renderProducts(categoriaActual, document.getElementById('productSearch').value);
          window.scrollTo({ top: document.getElementById('rowsContainer').offsetTop - 80, behavior: 'smooth' });
        };
        container.appendChild(pageBtn);
      } else if (i === paginaActual - 3 || i === paginaActual + 3) {
        const dots = document.createElement('span');
        dots.textContent = '...';
        dots.style.color = '#fff';
        container.appendChild(dots);
      }
    }

    const nextBtn = document.createElement('button');
    nextBtn.className = 'page-btn';
    nextBtn.textContent = '→';
    nextBtn.disabled = paginaActual === totalPages;
    nextBtn.onclick = () => {
      paginaActual++;
      renderProducts(categoriaActual, document.getElementById('productSearch').value);
      window.scrollTo({ top: document.getElementById('rowsContainer').offsetTop - 80, behavior: 'smooth' });
    };
    container.appendChild(nextBtn);
  };

  buildPaginationButtons(containerTop);
  buildPaginationButtons(containerBottom);
}

/* ================= EVENTOS Y SEARCH ================= */
let debounceTimer;
const searchInput = document.getElementById('productSearch');
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    paginaActual = 1; 
    const val = searchInput.value;
    if(val.trim() !== '') {
      document.getElementById('featuredContainer').style.display = 'none';
      document.querySelectorAll('.console-btn').forEach(b => b.classList.remove('active')); 
    } else {
      document.getElementById('featuredContainer').style.display = 'block';
      document.getElementById('currentCategoryTitle').textContent = (categories.find(c => c.id === categoriaActual).label[idiomaActual] || categories.find(c => c.id === categoriaActual).label.es).toUpperCase();
      
      const btns = document.querySelectorAll('.console-btn');
      btns.forEach(btn => {
        if(btn.textContent.includes(categories.find(c => c.id === categoriaActual).label.es)) {
          btn.classList.add('active');
        }
      });
    }
    renderProducts(categoriaActual, val);
  }, 300); 
});

/* ================= MODAL IMAGEN ================= */
const modal = document.getElementById('imageModal');
const close = document.getElementById('imageModalClose');
close.onclick = () => modal.style.display = 'none';
modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

/* ================= SCROLL SUBIR ================= */
const mybutton = document.getElementById("backToTopBtn");
window.onscroll = function() {
  if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
    mybutton.style.display = "block";
  } else {
    mybutton.style.display = "none";
  }
};

/* ================= INICIO ================= */
window.onload = () => {
  initThemeDots();
  createLanguageSelector();
  updateLanguage();
  renderConsoleButtons();
  cargarProductos();
};
</script>
