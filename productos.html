<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Productos | La Presa</title>
<link rel="icon" type="image/gif" href="https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Lucario.gif">
<style>
:root{
  --red:#e50914; 
  --bg:#141414;
  --glass:rgba(20,20,20,.78);
  --glass-border:rgba(255,255,255,.08);
  --accent:#00aaff;
  --gold:#ffcc00;
  --discord:#5865F2; 
  --kofi:#FF5E5B;    
}
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  font-family:'Segoe UI',sans-serif;
  background:#141414;
  color:white;
  overflow-x:hidden;
  min-height: 100vh;
}
/* ================= TOPBAR ================= */
.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:9999;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(16px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 3%; 
  gap: 10px; 
}
.logo{
  font-size:1.8rem; 
  font-weight:900;
  color:var(--red);
  letter-spacing:-1.5px;
  transition: color 0.3s ease;
  flex-shrink: 0;
  cursor: pointer;
}
.right-tools{
  display:flex;
  align-items:center;
  gap:12px; 
  flex-shrink: 0;
}
.config-group{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.theme-dots-container{
  display:flex;
  gap:5px;
}
.color-dot{
  width:12px; 
  height:12px;
  border-radius:50%;
  cursor:pointer;
  border:1px solid rgba(0,0,0,0.4);
  transition:transform .2s, border-color .2s;
}
.color-dot:hover{
  transform:scale(1.3);
}
.color-dot.active-dot{
  border:2px solid white;
  transform:scale(1.15);
  box-shadow: 0 0 8px rgba(255,255,255,0.6);
}
#languageSelector{
  background:rgba(0,0,0,.8);
  border:1px solid var(--glass-border);
  color:#fff;
  padding:4px 8px; 
  border-radius:6px;
  outline: none;
  cursor: pointer;
  font-size:11px; 
}
#productSearch{
  background:rgba(255,255,255,.08);
  border:none;
  color:white;
  width:170px; 
  padding:8px 14px; 
  border-radius:50px;
  font-size:13px; 
  outline:none;
  transition: width 0.3s ease;
}
#productSearch:focus {
  width: 200px;
  border: 1px solid var(--red);
}
#productSearch::placeholder{
  color:#ccc;
}

/* ================= CONSOLE BUTTONS ================= */
.console-buttons{
  display:flex;
  gap:6px; 
  flex-grow: 1; 
  justify-content: center;
  overflow-x: auto;
  scrollbar-width: none; 
  -ms-overflow-style: none; 
  padding: 5px 0; 
}
.console-buttons::-webkit-scrollbar {
  display: none; 
}
.console-btn{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px; 
  padding:6px 10px; 
  display:flex;
  align-items:center;
  gap:6px; 
  cursor:pointer;
  transition: .3s ease;
  color:white;
  font-weight:700;
  font-size: 11px; 
  white-space: nowrap; 
  flex-shrink: 0; 
}
.console-btn:hover{
  transform:scale(1.05);
  border-color:var(--red);
  background:rgba(var(--glow-rgb),.15);
}
.console-btn.active{
  border-color:var(--red);
  background:rgba(var(--glow-rgb),.25);
  box-shadow: 0 0 10px rgba(var(--glow-rgb), 0.5);
}
.console-btn span{
  color:white;
  letter-spacing:.5px;
}
.console-btn img{
  width:18px; 
  height:18px;
  object-fit:contain;
}
.console-btn .home-icon-btn {
  font-size: 16px; 
  color: white;
  width: 18px; 
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ================= CONTENEDOR DE SUBFILTROS DINÁMICOS ================= */
.subcategories-filter-wrapper {
  width: 90%;
  max-width: 1300px;
  margin: 15px auto 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.subcat-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap; 
  padding: 4px 0;
}
.subcat-filter-btn {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #ccc;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  margin-bottom: 5px; 
}
.subcat-filter-btn:hover {
  border-color: var(--red);
  color: #fff;
}
.subcat-filter-btn.active {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
  box-shadow: 0 0 10px rgba(var(--glow-rgb), 0.4);
}

/* ================= APP ================= */
#mainApp{
  display:block;
  padding-top:75px; 
}

/* ================= BANNER ALARGADO (AMAZON PRIME) ================= */
.prime-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(90deg, rgba(0, 170, 255, 0.12), rgba(20, 20, 20, 0.9));
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-left: 4px solid var(--red);
  border-radius: 10px;
  padding: 10px 20px;
  margin: 15px auto 5px auto;
  width: 90%;
  max-width: 1300px;
  gap: 15px;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}
.prime-banner:hover {
  transform: translateY(-2px);
  border-color: var(--red);
  box-shadow: 0 4px 15px rgba(var(--glow-rgb), 0.25);
}
.prime-banner-img {
  width: 45px;
  height: 45px;
  object-fit: cover;
  border-radius: 6px;
  flex-shrink: 0;
}
.prime-banner-info {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
}
.prime-banner-info strong {
  font-size: 14px;
  color: #fff;
  letter-spacing: 0.5px;
}
.prime-banner-info p {
  font-size: 12.5px;
  color: #bbb;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.prime-banner-btn {
  background: var(--red);
  color: white;
  border: none;
  border-radius: 6px;
  padding: 8px 18px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: filter 0.2s;
}
.prime-banner-btn:hover {
  filter: brightness(1.2);
}

/* ================= ROWS & CAROUSELS ================= */
.row {
  padding: 20px 5%;
}
.row h2{
  margin-bottom:20px;
  font-size:2rem;
  color: white;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}
.row.featured h2 {
  color: var(--red);
}
.carousel{
  display:flex;
  gap:16px;
  overflow-x:auto;
  scroll-behavior:smooth;
  padding-bottom:15px;
}
.carousel::-webkit-scrollbar{
  display:none;
}

/* ================= BARRA POR LOTE STICKY (ADMIN) ================= */
#batchAdminTools {
  position: sticky;
  top: 65px; /* Se queda justo debajo de la topbar desktop */
  z-index: 9990; /* Por encima de las tarjetas, por debajo del menú principal */
  background: rgba(20, 20, 20, 0.96); /* Fondo opaco para evitar mezcla visual */
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255,255,255,0.2);
  transition: top 0.2s ease;
}
@media(max-width:1100px){
  #batchAdminTools {
    top: 112px; /* Se ajusta si la barra superior se expande en pantallas medianas/móviles */
  }
}

/* ================= CARDS SIMÉTRICAS ================= */
.card{
  min-width:300px;
  width: 300px;
  background:rgba(255,255,255,.05);
  border-radius:16px;
  overflow:hidden;
  transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
  display: flex;
  flex-direction: column;
  position: relative;
  border: 1px solid rgba(255,255,255,.1);
  cursor: pointer;
}
.card:hover{
  transform:scale(1.03);
  z-index:20;
  border-color: var(--red);
  box-shadow: 0 0 30px rgba(var(--glow-rgb, 229, 9, 20), 0.45), 0 15px 30px rgba(0,0,0,0.6);
}
.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  flex-shrink: 0;
  background: #000;
}

.card-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(4px);
  color: #fff;
  padding: 4px 10px;
  border-radius: 30px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  border: 1px solid rgba(255,255,255,0.15);
  pointer-events: none;
}
.card-size-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  background: var(--red);
  color: #fff;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 800;
  pointer-events: none;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

.card-info{
  padding:18px 18px 10px 18px;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
}
.card-info strong{
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 8px;
  font-size:16px;
  white-space: normal;
}
.card-info p{
  font-size:13.5px;
  color:#ccc;
  line-height:1.4;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-info .price-tag {
  color: var(--gold);
  font-weight: bold;
  margin-top: auto;
  padding-top: 8px;
  font-size: 15px;
}

/* ================= SECCIÓN DE ACCIONES ================= */
.card-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 0 15px 15px 15px;
  gap: 8px;
  margin-top: auto;
}
.action-btn {
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  background: rgba(255,255,255,0.08);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 12px;
  gap: 6px;
}
.action-btn:hover {
  transform: translateY(-3px);
  filter: brightness(1.3);
}
.action-btn > svg {
  width: 18px;
  height: 18px;
}
.buy-btn {
  background: var(--red);
}
.zoom-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
}

/* Elementos del Admin Panel en Tarjetas */
.admin-card-tools {
  background: rgba(0, 0, 0, 0.4);
  padding: 10px 15px;
  border-top: 1px solid rgba(255,255,255,0.05);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.admin-select-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.admin-select-group label {
  font-size: 10px;
  color: #aaa;
  text-transform: uppercase;
  font-weight: bold;
}
.admin-select-multiple {
  background: #222;
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 4px;
  padding: 4px;
  font-size: 11px;
  outline: none;
}
.admin-select-multiple option {
  padding: 2px 4px;
}
.delete-btn {
  background: #cc0000 !important;
  color: white;
  width: 100%;
}

/* ================= CANDADO INVISIBLE (ESQUINA INFERIOR IZQUIERDA) ================= */
.admin-lock-btn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 10005; 
  background: rgba(20, 20, 20, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  border-radius: 50%;
  width: 44px;
  height: 44px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0; 
  transition: opacity 0.3s ease, border-color 0.3s ease, background-color 0.3s ease;
}
.admin-lock-btn:hover {
  opacity: 1;
  background: #141414;
  border-color: var(--red);
}
.admin-lock-btn svg {
  width: 18px;
  height: 18px;
}

/* Botón de guardar en la barra superior */
.save-json-btn {
  background: var(--gold) !important;
  color: black !important;
  font-weight: 700;
  border: none;
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 11px;
  display: none; 
  align-items: center;
  gap: 4px;
  transition: transform 0.2s;
}
.save-json-btn:hover {
  transform: scale(1.05);
}

/* ================= TARJETAS MÁS PEQUEÑAS (TOP VENTAS) ================= */
.card.card-recent{
  min-width:210px;
  width: 210px;
}
.card.card-recent img{
  height: 140px;
}
.card.card-recent .card-info{
  padding: 12px 12px 6px 12px;
}
.card.card-recent .card-info strong{
  font-size: 14px;
  -webkit-line-clamp: 1;
}
.card.card-recent .card-info p{
  font-size: 12px;
  -webkit-line-clamp: 2;
}

/* ================= PAGINACIÓN ================= */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  width: 100%;
  flex-wrap: wrap;
}
#paginationContainerTop {
  margin-bottom: 20px;
}
#paginationContainerBottom {
  margin-top: 30px;
}
.page-btn {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  color: white;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  transition: all .3s ease;
  font-weight: bold;
  font-size: 13px;
}
.page-btn:hover {
  border-color: var(--red);
  background: rgba(var(--glow-rgb),.15);
}
.page-btn.active {
  background: var(--red);
  border-color: var(--red);
  box-shadow: 0 0 10px rgba(var(--glow-rgb), 0.5);
}
.page-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  pointer-events: none;
}

/* ================= MODAL IMAGEN ================= */
#imageModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(12px);
  justify-content: center;
  align-items: center;
  z-index: 10000;
  padding: 20px;
}
#imageModal img {
  max-width: 95%;
  max-height: 95vh;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.9);
}
#imageModal .modal-close {
  position: absolute;
  top: 25px;
  right: 30px;
  font-size: 40px;
  color: #fff;
  cursor: pointer;
  transition: transform 0.2s;
}
#imageModal .modal-close:hover {
  transform: scale(1.2);
  color: var(--red);
}

/* ================= BOTÓN SUBIR ARRIBA ================= */
#backToTopBtn {
  display: none;
  position: fixed;
  bottom: 30px;
  right: 30px;
  z-index: 9998;
  background: var(--red);
  color: white;
  border: none;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  cursor: pointer;
  font-size: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: opacity 0.3s, transform 0.3s;
}
#backToTopBtn:hover {
  transform: scale(1.1);
}

/* ================= RESPONSIVE ================= */
@media(max-width:1100px){
  .topbar {
    flex-wrap: wrap;
    justify-content: space-between;
    padding: 10px 5%;
  }
  .console-buttons {
    order: 3;
    width: 100%;
    margin: 8px 0 0 0;
    justify-content: flex-start;
  }
  .logo { order: 1; }
  .right-tools { order: 2; }
}

@media(max-width:900px){
  #productSearch{ width:140px; }
  #productSearch:focus { width: 160px; }
  .card{ min-width:240px; width: 240px; }
  .card.card-recent{ min-width:180px; width: 180px; }
}

@media(max-width:768px){
  .prime-banner {
    padding: 10px;
    width: 95%;
  }
  .prime-banner-info p {
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo" onclick="window.location.href='index.html'">LA PRESA</div>
  
  <div class="console-buttons" id="consoleButtons"></div>

  <div class="right-tools">
    <input 
      type="text" 
      id="productSearch" 
      placeholder="Buscar productos..."
      autocomplete="off"
    >
    <div class="config-group">
      <div class="theme-dots-container" id="themeDots"></div>
      <div style="display: flex; gap: 6px; align-items: center;">
        <button id="saveJsonBtn" class="save-json-btn" title="Descargar JSON de la categoría actual">
          💾 Guardar JSON
        </button>
      </div>
      <select id="languageSelector"></select>
    </div>
  </div>
</div>

<button id="adminLockBtn" class="admin-lock-btn" title="Modo Administrator">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="lockIcon">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
  </svg>
</button>

<div id="mainApp">
  <div id="primeBanner" class="prime-banner" style="display:none;"></div>

  <div class="subcategories-filter-wrapper">
    <div id="subcategoriesFilterRow" class="subcat-row" style="display:none;"></div>
    <div id="sizesGBRow" class="subcat-row" style="display:none;"></div>
    <div id="sizesTBRow" class="subcat-row" style="display:none;"></div>
  </div>

  <div id="featuredContainer" style="display:none">
    <div class="row featured" id="bestsellersRow" style="display:none;">
      <h2 id="titleBestsellers">TOP VENTAS</h2>
      <div class="carousel" id="bestsellersCarousel"></div>
    </div>
  </div>
  
  <div id="rowsContainer">
    <div class="row">
      <h2 id="currentCategoryTitle" style="font-size:2.5rem;">SWITCH</h2>
      <div id="paginationContainerTop" class="pagination"></div>
      
      <div id="batchAdminTools" style="display:none; margin-bottom: 20px; padding: 15px; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; gap: 15px; align-items: center; flex-wrap: wrap;">
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:bold; color:var(--gold); cursor:pointer; user-select:none;">
          <input type="checkbox" id="selectAllBatchChk" style="width:16px; height:16px; cursor:pointer;"> Seleccionar página actual
        </label>
        <div style="display:flex; align-items:center; gap:6px; font-size:13px;">
          <span>Mover a Consola:</span>
          <select id="batchConsoleSelect" style="background:#222; color:white; border:1px solid rgba(255,255,255,.2); padding:6px; border-radius:6px; outline:none; font-size:12px;"></select>
        </div>
        <div style="display:flex; align-items:center; gap:6px; font-size:13px;">
          <span>Mover a Subcategoría:</span>
          <select id="batchSubcatSelect" style="background:#222; color:white; border:1px solid rgba(255,255,255,.2); padding:6px; border-radius:6px; outline:none; font-size:12px;"></select>
        </div>
        <button id="applyBatchBtn" style="background:var(--red); color:white; border:none; padding:8px 16px; border-radius:6px; font-weight:700; font-size:12px; cursor:pointer; transition:transform 0.2s;">
          ⚡ Aplicar Cambios por Lote
        </button>
      </div>

      <div class="carousel" id="productsGrid" style="flex-wrap: wrap; overflow: visible;"></div>
      
      <div id="paginationContainerBottom" class="pagination"></div>
    </div>
  </div>
</div>

<div id="imageModal">
  <span class="modal-close" id="imageModalClose">×</span>
  <img id="enlargedImage" src="" alt="Imagen ampliada">
</div>

<button id="backToTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>

<script>
/* ================= TRANSLACIONES GLOBALES ================= */
const translations = {
  en: { title: "Products | La Presa", search: "Search products...", topVentas: "TOP SALES", home: "Home", buy: "View", zoom: "Enlarge", results: "Search Results", all: "All" },
  es: { title: "Productos | La Presa", search: "Buscar productos...", topVentas: "TOP VENTAS", home: "Inicio", buy: "Ver", zoom: "Ampliar", results: "Resultados de búsqueda", all: "Todos" },
  fr: { title: "Produits | La Presa", search: "Rechercher...", topVentas: "TOP VENTES", home: "Accueil", buy: "Voir", zoom: "Agrandir", results: "Résultats de recherche", all: "Tous" },

function initThemeDots() {
  const savedTheme = localStorage.getItem('selectedThemeColor') || 'rojo';
  const container = document.getElementById('themeDots');
  container.innerHTML = '';
  
  Object.keys(paletaTemas).forEach(colorKey => {
    const dot = document.createElement('div');
    dot.className = 'color-dot';
    dot.style.backgroundColor = paletaTemas[colorKey].hex;
    if (colorKey === savedTheme) dot.classList.add('active-dot');
    
    dot.addEventListener('click', () => {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active-dot'));
      dot.classList.add('active-dot');
      localStorage.setItem('selectedThemeColor', colorKey);
      applyTheme(colorKey);
    });
    
    container.appendChild(dot);
  });
  applyTheme(savedTheme);
}

function applyTheme(colorKey) {
  const theme = paletaTemas[colorKey] || paletaTemas.rojo;
  document.documentElement.style.setProperty('--red', theme.hex);
  document.documentElement.style.setProperty('--glow-rgb', theme.rgb);
}

/* ================= GENERADOR DE SUBFILTROS DINÁMICOS ================= */
function generarBarraSubcategoriasYCapacidades() {
  const subcatRow = document.getElementById('subcategoriesFilterRow');
  const rowGB = document.getElementById('sizesGBRow');
  const rowTB = document.getElementById('sizesTBRow');
  const t = translations[idiomaActual] || translations.es;
  
  subcatRow.innerHTML = '';
  rowGB.innerHTML = '';
  rowTB.innerHTML = '';
  
  subcatRow.style.display = 'none';
  rowGB.style.display = 'none';
  rowTB.style.display = 'none';

  let productosCategoria = allProducts.filter(item => {
    if (!item.console) return false;
    if (categoriaActual.toLowerCase() === '3ds_nds') {
      if (Array.isArray(item.console)) {
        return item.console.some(c => c.toLowerCase() === '3ds' || c.toLowerCase() === 'nds');
      }
      return item.console.toLowerCase() === '3ds' || item.console.toLowerCase() === 'nds';
    }
    if (Array.isArray(item.console)) {
      return item.console.some(c => c.toLowerCase() === categoriaActual.toLowerCase());
    }
    return item.console.toLowerCase() === categoriaActual.toLowerCase();
  });

  if (productosCategoria.length === 0) return;

  // -- Subcategorías --
  let subcatsUnicas = new Set();
  productosCategoria.forEach(p => {
    if (p.subcategory) {
      if (Array.isArray(p.subcategory)) {
        p.subcategory.forEach(sub => { if(sub !== 'Ninguno') subcatsUnicas.add(sub); });
      } else if (p.subcategory !== 'Ninguno') {
        subcatsUnicas.add(p.subcategory);
      }
    }
  });

  if (subcatsUnicas.size > 0) {
    subcatRow.style.display = 'flex';
    const btnAll = document.createElement('button');
    btnAll.className = `subcat-filter-btn ${subcategoriaSeleccionada === 'ALL' ? 'active' : ''}`;
    btnAll.textContent = t.all;
    btnAll.onclick = () => {
      subcategoriaSeleccionada = 'ALL';
      paginaActual = 1;
      generarBarraSubcategoriasYCapacidades();
      renderProducts(categoriaActual);
    };
    subcatRow.appendChild(btnAll);

    let listaSubcats = Array.from(subcatsUnicas).sort((a, b) => {
      let indexA = subcatOrder.indexOf(a);
      let indexB = subcatOrder.indexOf(b);
      if (indexA === -1) indexA = 999;
      if (indexB === -1) indexB = 999;
      return indexA - indexB;
    });

    listaSubcats.forEach(sub => {
      const btn = document.createElement('button');
      btn.className = `subcat-filter-btn ${subcategoriaSeleccionada === sub ? 'active' : ''}`;
      const translatedText = subcatTranslations[sub] ? (subcatTranslations[sub][idiomaActual] || subcatTranslations[sub]['es']) : sub;
      btn.textContent = translatedText;
      btn.onclick = () => {
        subcategoriaSeleccionada = sub;
        paginaActual = 1;
        generarBarraSubcategoriasYCapacidades();
        renderProducts(categoriaActual);
      };
      subcatRow.appendChild(btn);
    });
  }

  // -- Capacidades (SD/USB) --
  if (categoriaActual === 'SD/USB') {
    rowGB.style.display = 'flex';
    rowTB.style.display = 'flex';

    let tamanosUnicos = new Set();
    productosCategoria.forEach(p => {
      if (p.size && p.size !== 'Ninguno') tamanosUnicos.add(p.size);
    });

    let listaTamanos = Array.from(tamanosUnicos).sort((a, b) => {
      let numA = parseInt(a), numB = parseInt(b);
      if (a.includes('TB') && !b.includes('TB')) return 1;
      if (!a.includes('TB') && b.includes('TB')) return -1;
      return numA - numB;
    });

    if (listaTamanos.length > 0) {
      // Botón "Todos"
      const btnAllSize = document.createElement('button');
      btnAllSize.className = `subcat-filter-btn ${tamanoSeleccionado === 'ALL' ? 'active' : ''}`;
      btnAllSize.textContent = t.all + " (Capacidad)";
      btnAllSize.onclick = () => {
        tamanoSeleccionado = 'ALL';
        paginaActual = 1;
        generarBarraSubcategoriasYCapacidades();
        renderProducts(categoriaActual);
      };
      rowGB.appendChild(btnAllSize);

      // Distribuir en filas
      listaTamanos.forEach(tam => {
        const btnSize = document.createElement('button');
        btnSize.className = `subcat-filter-btn ${tamanoSeleccionado === tam ? 'active' : ''}`;
        btnSize.textContent = tam;
        btnSize.onclick = () => {
          tamanoSeleccionado = tam;
          paginaActual = 1;
          generarBarraSubcategoriasYCapacidades();
          renderProducts(categoriaActual);
        };

        // Lógica de separación: si tiene TB, a la fila 2 (TB), sino, fila 1 (GB)
        if (tam.includes('TB')) {
          rowTB.appendChild(btnSize);
        } else {
          rowGB.appendChild(btnSize);
        }
      });
    }
  }
}

/* ================= CARGA DE DATOS ================= */
async function cargarProductos() {
  try {
    const baseUrl = 'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/';
    const archivos = [
      'switch.json', 'playstation.json', 'xbox.json', '3ds.json', 
      'nds.json', 'wii.json', 'sd_usb.json'
    ];

    const promesas = archivos.map(archivo => 
      fetch(baseUrl + archivo + '?v=' + new Date().getTime())
        .then(res => res.ok ? res.json() : [])
        .catch(() => []) 
    );

    const resultadosArrays = await Promise.all(promesas);
    
    allProducts = resultadosArrays.flatMap((array, index) => {
      return array.map((item, subIndex) => {
        if (!item.id) item.id = `prod-${index}-${subIndex}-${Date.now()}`;
        if (!item._originFile) item._originFile = archivos[index];
        return item;
      });
    });
    
    renderPrimeProduct();
    generarBarraSubcategoriasYCapacidades(); 
    renderProducts(categoriaActual);

  } catch (error) {
    console.error('Error cargando productos:', error);
    document.getElementById('productsGrid').innerHTML = 
      `<p style="color:var(--red); font-size:18px; padding:20px 0;">Error al cargar el catálogo de productos.</p>`;
  }
}

        <label>Categorías (Ctrl+Click)</label>
        <select class="admin-select-multiple console-select" multiple size="3">
          ${consoleOptions}
        </select>
      </div>
      <div class="admin-select-group">
        <label>Subcategorías (Ctrl+Click)</label>
        <select class="admin-select-multiple subcat-select" multiple size="3">
          ${subcatOptions}
        </select>
      </div>
      <button class="action-btn delete-btn">❌ Eliminar Producto</button>
    `;

    adminTools.querySelector('.console-select').addEventListener('change', (e) => {
      const selectedConsoles = Array.from(e.target.selectedOptions).map(opt => opt.value);
      item.console = selectedConsoles.length === 1 ? selectedConsoles[0] : selectedConsoles;
      generarBarraSubcategoriasYCapacidades();
      renderProducts(categoriaActual, document.getElementById('productSearch').value);
    });

    adminTools.querySelector('.subcat-select').addEventListener('change', (e) => {
      const selectedSubcats = Array.from(e.target.selectedOptions).map(opt => opt.value);
      item.subcategory = selectedSubcats.length === 0 ? 'Ninguno' : (selectedSubcats.length === 1 ? selectedSubcats[0] : selectedSubcats);
      generarBarraSubcategoriasYCapacidades();
      renderProducts(categoriaActual, document.getElementById('productSearch').value);
    });

    adminTools.querySelector('.delete-btn').addEventListener('click', () => {
      if(confirm(`¿Estás seguro de que deseas eliminar "${label}"?`)) {
        allProducts = allProducts.filter(p => p.id !== item.id);
        generarBarraSubcategoriasYCapacidades();
        renderProducts(categoriaActual, document.getElementById('productSearch').value);
      }
    });

    card.appendChild(adminTools);
  }

  card.onclick = () => {
    if(!isAdmin) window.open(item.url, '_blank');
  };
  
  card.querySelector('.buy-btn').onclick = (e) => {
    e.stopPropagation();
    window.open(item.url, '_blank');
  };

  card.querySelector('.zoom-btn').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('enlargedImage').src = item.img;
    document.getElementById('imageModal').style.display = 'flex';
  };

  container.appendChild(card);
}

/* ================= RENDERIZADO PRINCIPAL DE CATÁLOGO ================= */
function renderProducts(catId, searchTerm = '') {
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = '';
  const t = translations[idiomaActual] || translations.es;

  const selectAllChk = document.getElementById('selectAllBatchChk');
  if(selectAllChk) selectAllChk.checked = false;

  let filtered = allProducts.filter(item => 
    item.label?.es !== "Amazon Prime" && 
    !(item.label?.es && item.label.es.toLowerCase().includes("amazon prime"))
  );

  if (searchTerm.trim() !== '') {
    const term = searchTerm.toLowerCase().trim();
    filtered = filtered.filter(item => {
      const label = (item.label?.[idiomaActual] || item.label?.es || '').toLowerCase();
      const desc = (item.desc?.[idiomaActual] || item.desc?.es || '').toLowerCase();
      return label.includes(term) || desc.includes(term);
    });
    document.getElementById('currentCategoryTitle').textContent = t.results.toUpperCase();
    
    document.getElementById('subcategoriesFilterRow').style.display = 'none';
    document.getElementById('sizesGBRow').style.display = 'none';
    document.getElementById('sizesTBRow').style.display = 'none';
  } 
  else {
    filtered = filtered.filter(item => {
      if (!item.console) return false;
      
      const itemConsole = Array.isArray(item.console) 
        ? item.console.map(c => c.toLowerCase()) 
        : [item.console.toLowerCase()];
      
      const targetCat = catId.toLowerCase();

      if (targetCat === '3ds_nds') {
        return itemConsole.includes('3ds') || itemConsole.includes('nds');
      } else {
        return itemConsole.includes(targetCat);
      }
    });

    if (subcategoriaSeleccionada !== 'ALL') {
      filtered = filtered.filter(item => {
        if (Array.isArray(item.subcategory)) {
          return item.subcategory.some(s => s.toLowerCase() === subcategoriaSeleccionada.toLowerCase());
        }
        return item.subcategory?.toLowerCase() === subcategoriaSeleccionada.toLowerCase();
      });
    }

    if (catId === 'SD/USB' && tamanoSeleccionado !== 'ALL') {
      filtered = filtered.filter(item => item.size === tamanoSeleccionado);
    }
  }

  if (filtered.length === 0) {
    grid.innerHTML = `<p style="color:#aaa; font-size:18px; padding:20px 0;">No se encontraron productos con los filtros seleccionados.</p>`;
    document.getElementById('paginationContainerTop').innerHTML = '';
    document.getElementById('paginationContainerBottom').innerHTML = '';
    return;
  }

  const totalPages = Math.ceil(filtered.length / itemsPorPagina);
  
  if (paginaActual > totalPages) paginaActual = totalPages || 1; 

  const startIndex = (paginaActual - 1) * itemsPorPagina;
  const endIndex = startIndex + itemsPorPagina;
  const pagedItems = filtered.slice(startIndex, endIndex);

  pagedItems.forEach(item => createProductCard(item, grid, false));
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const containerTop = document.getElementById('paginationContainerTop');
  const containerBottom = document.getElementById('paginationContainerBottom');
  
  containerTop.innerHTML = '';
  containerBottom.innerHTML = '';

  if (totalPages <= 1) return;

  const buildPaginationButtons = (container) => {
    const prevBtn = document.createElement('button');
    prevBtn.className = 'page-btn';
    prevBtn.textContent = '←';
    prevBtn.disabled = paginaActual === 1;
    prevBtn.onclick = () => {
      paginaActual--;
      renderProducts(categoriaActual, document.getElementById('productSearch').value);
      window.scrollTo({ top: document.getElementById('rowsContainer').offsetTop - 80, behavior: 'smooth' });
    };
    container.appendChild(prevBtn);

    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= paginaActual - 2 && i <= paginaActual + 2)) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === paginaActual ? 'active' : ''}`;
        pageBtn.textContent = i;
        pageBtn.onclick = () => {
          paginaActual = i;
          renderProducts(categoriaActual, document.getElementById('productSearch').value);
          window.scrollTo({ top: document.getElementById('rowsContainer').offsetTop - 80, behavior: 'smooth' });
        };
        container.appendChild(pageBtn);
      } else if (i === paginaActual - 3 || i === paginaActual + 3) {
        const dots = document.createElement('span');
        dots.textContent = '...';
        dots.style.color = '#fff';
        container.appendChild(dots);
      }
    }

    const nextBtn = document.createElement('button');
    nextBtn.className = 'page-btn';
    nextBtn.textContent = '→';
    nextBtn.disabled = paginaActual === totalPages;
    nextBtn.onclick = () => {
      paginaActual++;
      renderProducts(categoriaActual, document.getElementById('productSearch').value);
      window.scrollTo({ top: document.getElementById('rowsContainer').offsetTop - 80, behavior: 'smooth' });
    };
    container.appendChild(nextBtn);
  };

  buildPaginationButtons(containerTop);
  buildPaginationButtons(containerBottom);
}

/* ================= INICIALIZADOR Y LOGICA POR LOTE (ADMIN) ================= */
function initBatchTools() {
  if (batchToolsInitialized) return;
  
  const consoleSel = document.getElementById('batchConsoleSelect');
  const subcatSel = document.getElementById('batchSubcatSelect');
  
  if(!consoleSel || !subcatSel) return;

  consoleSel.innerHTML = '<option value="KEEP">— No cambiar —</option>';
  categories.forEach(c => {
    consoleSel.innerHTML += `<option value="${c.id}">${c.id}</option>`;
  });
  consoleSel.innerHTML += `<option value="NDS">NDS</option>`;
  
  subcatSel.innerHTML = '<option value="KEEP">— No cambiar —</option><option value="Ninguno">Ninguno</option>';
  subcatOrder.forEach(sub => {
    subcatSel.innerHTML += `<option value="${sub}">${sub}</option>`;
  });

  document.getElementById('selectAllBatchChk').addEventListener('change', (e) => {
    const checkboxes = document.querySelectorAll('.product-batch-checkbox');
    checkboxes.forEach(chk => chk.checked = e.target.checked);
  });

  document.getElementById('applyBatchBtn').addEventListener('click', applyBatchChanges);
  
  batchToolsInitialized = true;
}

function applyBatchChanges() {
  const checkboxes = document.querySelectorAll('.product-batch-checkbox:checked');
  if (checkboxes.length === 0) {
    alert("No has seleccionado ningún producto en la página actual para modificar.");
    return;
  }

  const targetConsole = document.getElementById('batchConsoleSelect').value;
  const targetSubcat = document.getElementById('batchSubcatSelect').value;

  if (targetConsole === 'KEEP' && targetSubcat === 'KEEP') {
    alert("Por favor, selecciona al menos un cambio válido en los desplegables (Consola o Subcategoría).");
    return;
  }

  if (!confirm(`¿Estás seguro de mover y actualizar estos ${checkboxes.length} productos seleccionados?`)) {
    return;
  }

  checkboxes.forEach(chk => {
    const prodId = chk.dataset.id;
    const item = allProducts.find(p => p.id === prodId);
    if (item) {
      if (targetConsole !== 'KEEP') {
        item.console = targetConsole;
      }
      if (targetSubcat !== 'KEEP') {
        item.subcategory = targetSubcat;
      }
    }
  });

  alert("¡Productos actualizados con éxito por lote!");

  document.getElementById('selectAllBatchChk').checked = false;
  generarBarraSubcategoriasYCapacidades();
  renderProducts(categoriaActual, document.getElementById('productSearch').value);
}

/* ================= EVENTOS Y SEARCH ================= */
let debounceTimer;
const searchInput = document.getElementById('productSearch');
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    paginaActual = 1; 
    const val = searchInput.value;
    if(val.trim() !== '') {
      document.getElementById('primeBanner').style.display = 'none';
      document.querySelectorAll('.console-btn').forEach(b => b.classList.remove('active'));

      document.getElementById('primeBanner').style.display = 'flex';

      const btns = document.querySelectorAll('.console-btn');
      btns.forEach(btn => {
        if(btn.textContent.includes(categories.find(c => c.id === categoriaActual).label.es)) {
          btn.classList.add('active');
        }
      });
      generarBarraSubcategoriasYCapacidades(); 
    }
    renderProducts(categoriaActual, val);
  }, 300); 
});

/* ================= GESTIÓN GHOST-LOCK Y MODO ADMIN ================= */
const adminLockBtn = document.getElementById('adminLockBtn');
const saveJsonBtn = document.getElementById('saveJsonBtn');
const lockIcon = document.getElementById('lockIcon');

async function hashearTexto(texto) {
  const encoder = new TextEncoder();
  const data = encoder.encode(texto);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

adminLockBtn.addEventListener('click', async () => {
  if (!isAdmin) {
    const pass = prompt("Proxys:");
    if (pass) {
      const hashIngresado = await hashearTexto(pass);
      const hashCorrecto = "65d21f24c2164508323ab774fdf0e95e23313bd71a505fb1b4a87839032b1531"; 
      if (hashIngresado === hashCorrecto) {
        isAdmin = true;
        lockIcon.innerHTML = `<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path>`; 
        adminLockBtn.style.borderColor = "var(--gold)";
        adminLockBtn.style.opacity = "1"; 
        saveJsonBtn.style.display = "flex"; 
        document.getElementById('batchAdminTools').style.display = "flex"; 
        initBatchTools(); 
        alert("OK!");
      } else {
        alert("https://amzn.to/4dUrbsh");
      }
    }
  } else {
    isAdmin = false;
    lockIcon.innerHTML = `<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>`; 
    adminLockBtn.style.borderColor = "rgba(255,255,255,0.2)";
    adminLockBtn.style.opacity = "0"; 
    saveJsonBtn.style.display = "none";
    document.getElementById('batchAdminTools').style.display = "none"; 
    alert("Modo Administrator Desactivado.");
  }
  renderProducts(categoriaActual, document.getElementById('productSearch').value);
});

saveJsonBtn.addEventListener('click', () => {
  let targetJsonFile = categoryJsonMap[categoriaActual] || 'productos.json';
  let exportProducts = allProducts.filter(item => {
    if (!item.console) return false;
    if (categoriaActual.toLowerCase() === '3ds_nds') {
      if (Array.isArray(item.console)) return item.console.some(c => c.toLowerCase() === '3ds' || c.toLowerCase() === 'nds');
      return item.console.toLowerCase() === '3ds' || item.console.toLowerCase() === 'nds';
    }
    if (Array.isArray(item.console)) return item.console.some(c => c.toLowerCase() === categoriaActual.toLowerCase());
    return item.console.toLowerCase() === categoriaActual.toLowerCase();
  });

  let cleanedProducts = exportProducts.map(p => {
    let copy = { ...p };
    delete copy.id;
    delete copy._originFile;
    return copy;
  });

  if (categoriaActual === '3DS_NDS') {
    const confirmSplit = confirm("Estás en 3DS/NDS. ¿Quieres descargar el archivo específico de 3DS? (Cancelar para descargar el de NDS)");
    targetJsonFile = confirmSplit ? '3ds.json' : 'nds.json';
    cleanedProducts = exportProducts.filter(p => p._originFile === targetJsonFile).map(p => {
      let copy = { ...p }; delete copy.id; delete copy._originFile; return copy;
    });
  }

  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cleanedProducts, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", targetJsonFile);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
});
