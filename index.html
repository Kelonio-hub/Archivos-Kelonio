<title id="pageTitle">Archivos Nintendo | La Presa</title>
<link rel="icon" type="image/gif" href="https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Lucario.gif">

<style>
:root{
  --red:#e50914; 
  --bg:#141414;
  --glass:rgba(20,20,20,.78);
  --glass-border:rgba(255,255,255,.08);
  --accent:#00aaff;
  --gold:#ffcc00;
  --discord:#5865F2; 
  --kofi:#FF5E5B;    
  --green:#2ecc71;
  --glow-rgb: 229, 9, 20;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:'Segoe UI',sans-serif; background:#141414; color:white; overflow-x:hidden; min-height: 100vh; }

/* ================= MURO DE ACCESO (OVERLAY) ================= */
#accessWall {
    position: fixed; inset: 0; z-index: 99999999;
    background: radial-gradient(circle at top,#252525,#111);
    display: flex; justify-content: center; align-items: center;
    transition: opacity 0.5s ease, visibility 0.5s ease;
}
.access-card {
    width: min(95%, 650px); background: rgba(27,27,27,.95);
    border-radius: 24px; padding: 35px; text-align: center;
    box-shadow: 0 0 40px rgba(var(--glow-rgb), 0.3);
    border: 1px solid rgba(255,255,255,.08);
    transition: box-shadow 0.3s ease;
}
.lucario {
    width: 140px; filter: drop-shadow(0 0 10px var(--accent)) drop-shadow(0 0 25px var(--accent));
    animation: float 3s ease-in-out infinite;
}
@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
.access-logo {
    font-size: 3.5rem; font-weight: 900; color: var(--red);
    letter-spacing: 4px; text-transform: uppercase; margin-top: 10px;
    text-shadow: 0 0 10px rgba(var(--glow-rgb),.8), 0 0 20px rgba(var(--glow-rgb),.5);
}
.subtitle { margin-top: 10px; color: #ccc; line-height: 1.6; font-size: 15px; }
.task { margin-top: 18px; }
.task button {
    width: 100%; border: none; padding: 16px; border-radius: 12px;
    color: white; font-weight: bold; cursor: pointer; transition: .3s; font-size: 15px;
}
.btn-youtube { background: var(--red); }
.btn-giveaway { background: #ff9900; }
.btn-done { background: var(--green) !important; cursor: default !important; }

/* Sistema de Pulso */
@keyframes pulseSub { 
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(var(--glow-rgb), 0.7); } 
    50% { transform: scale(1.02); box-shadow: 0 0 15px 0 rgba(var(--glow-rgb), 0.4); } 
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(var(--glow-rgb), 0); } 
}
.is-verifying { animation: pulseSub 1.5s infinite; filter: brightness(0.8); cursor: wait !important; }

/* CONTENEDOR DE TARJETAS DEL SORTEO */
.aw-products { 
    display: none; 
    margin-top: 20px; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 12px; 
}
.aw-product {
    background: rgba(255,255,255,0.03); 
    border: 2px solid rgba(255,255,255,.08);
    border-radius: 16px; padding: 15px 10px; cursor: pointer;
    transition: all .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    min-height: 180px; text-align: center; position: relative; overflow: hidden;
}
.aw-product img { width: 75px; height: 75px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); transition: transform 0.3s; }
.aw-product span { font-size: 12px; font-weight: bold; color: #fff; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
.aw-product .aw-choose-badge { background: var(--accent); color: white; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 20px; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }

.aw-product:hover { transform: translateY(-6px); background: rgba(255,255,255,0.07); border-color: #ff9900; box-shadow: 0 8px 20px rgba(255,153,0,0.2); }
.aw-product:hover img { transform: scale(1.1); }
.aw-product:hover .aw-choose-badge { background: #ff9900; opacity: 1; }

.progress { margin-top: 25px; }
.bar { height: 10px; background: #333; border-radius: 20px; overflow: hidden; margin-top: 10px; }
.fill { height: 100%; width: 0%; background: var(--green); transition: .4s; }
#enterBtn {
    width: 100%; border: none; padding: 16px; border-radius: 12px;
    background: var(--green); color: white; font-size: 18px; font-weight: bold;
    cursor: pointer; margin-top: 20px; display: none;
    box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
}
#enterBtn:hover { transform: scale(1.02); filter: brightness(1.1); }
.aw-status { margin-top: 15px; color: #aaa; font-size: 14px; font-weight: 600; }

/* ================= TOPBAR Y HUB PRINCIPAL ================= */
#mainHub { display: none; opacity: 0; transition: opacity 0.5s ease; }
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:9999;
  background:rgba(0,0,0,.88); backdrop-filter:blur(16px);
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 3%; gap: 10px; 
}
.logo{ font-size:1.8rem; font-weight:900; color:var(--red); letter-spacing:-1.5px; transition: color 0.3s ease; flex-shrink: 0; text-decoration: none;}
.right-tools{ display:flex; align-items:center; gap:12px; flex-shrink: 0; }
.config-group{ display:flex; flex-direction:column; align-items:center; gap:4px; }
.theme-dots-container{ display:flex; gap:5px; }
.color-dot{ width:12px; height:12px; border-radius:50%; cursor:pointer; border:1px solid rgba(0,0,0,0.4); transition:transform .2s, border-color .2s; }
.color-dot:hover{ transform:scale(1.3); }
.color-dot.active-dot{ border:2px solid white; transform:scale(1.15); box-shadow: 0 0 8px rgba(255,255,255,0.6); }

#languageSelector{ background:rgba(0,0,0,.8); border:1px solid var(--glass-border); color:#fff; padding:4px 8px; border-radius:6px; outline: none; cursor: pointer; font-size:11px; }
#fileSearch{ background:rgba(255,255,255,.08); border:none; color:white; width:170px; padding:8px 14px; border-radius:50px; font-size:13px; outline:none; }
#fileSearch::placeholder{ color:#ccc; }

.console-buttons{ display:flex; gap:6px; flex-grow: 1; justify-content: center; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding: 5px 0; }
.console-buttons::-webkit-scrollbar { display: none; }
.console-btn{ background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:6px 10px; display:flex; align-items:center; gap:6px; cursor:pointer; transition: .3s ease; color:white; font-weight:700; font-size: 11px; white-space: nowrap; flex-shrink: 0; }
.console-btn:hover{ transform:scale(1.05); border-color:var(--red); background:rgba(var(--glow-rgb),.15); }
.console-btn.fav-active-btn{ border-color:var(--gold); background:rgba(255,204,0,.15); }
.console-btn span{ color:white; letter-spacing:.5px; }
.console-btn img{ width:18px; height:18px; object-fit:contain; }
.console-btn .fav-icon-btn { font-size: 14px; color: var(--gold); width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 8px rgba(255,204,0,0.5); }

/* POPUP DE DESCARGA INTERNA */
#downloadGate{ position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; justify-content:center; align-items:center; z-index:99999; }
.download-box{ background:#1b1b1b; padding:40px; border-radius:20px; text-align:center; width:90%; max-width:420px; border:1px solid rgba(255,255,255,.1); }
.download-box h2{ margin-bottom:15px; font-size:2rem; }
.download-box p{ color:#bbb; margin-bottom:25px; line-height: 1.5; }
.download-box button{ width:100%; margin-top:10px; padding:14px; border:none; border-radius:10px; font-size:1.1rem; font-weight:700; cursor:pointer; transition: background 0.3s, transform 0.2s; }
#subNowBtn{ background:var(--red); color:white; animation: pulseSub 1.5s infinite; }
#subNowBtn:hover { filter: brightness(1.2); transform: scale(1.05); }

/* BOTÓN SUBIR ARRIBA */
#backToTopBtn { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 9999; background: var(--red); color: white; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: opacity 0.3s, transform 0.3s; }
#backToTopBtn:hover { transform: scale(1.1); }

/* APP LAYOUT */
#mainApp{ display:block; padding-top:70px; }
.hero{ height:55vh; position:relative; display:flex; align-items:center; padding:0 6%; background-size:cover; background-position:center; transition:all .7s ease; }
.hero::before{ content:''; position:absolute; inset:0; background: linear-gradient(to right, rgba(20,20,20,.96) 15%, rgba(20,20,20,.4) 60%, rgba(20,20,20,.96)); }
.hero-content{ position:relative; z-index:2; max-width:700px; }
.hero h1{ font-size:3.5rem; margin-bottom:15px; }
.hero p{ font-size:1.15rem; color:#ddd; margin-bottom:25px; }
.hero button{ border:none; background:var(--accent); color:white; padding:15px 35px; border-radius:10px; font-size:1.05rem; font-weight:800; cursor:pointer; transition: background 0.3s, filter 0.3s; }
.hero button:hover{ filter: brightness(1.2); }

.row{ padding:25px 5%; }
.row h2{ margin-bottom:20px; font-size:2rem; }
.carousel{ display:flex; gap:16px; overflow-x:auto; scroll-behavior:smooth; padding-bottom:10px; }
.carousel::-webkit-scrollbar{ display:none; }
.carousel-wrapper{ position:relative; }
.carousel-arrow{ position:absolute; top:50%; transform:translateY(-50%); width:52px; height:52px; border:none; border-radius:50%; background:rgba(0,0,0,.7); color:white; font-size:28px; cursor:pointer; z-index:50; backdrop-filter:blur(10px); transition:.25s; }
.carousel-arrow:hover{ background:var(--red); transform:translateY(-50%) scale(1.1); }
.carousel-arrow.left{ left:-18px; }
.carousel-arrow.right{ right:-18px; }

/* CARDS */
.card{ min-width:300px; width: 300px; background:rgba(255,255,255,.05); border-radius:16px; overflow:hidden; transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease; display: flex; flex-direction: column; position: relative; border: 1px solid transparent; }
.card:hover{ transform:scale(1.03); z-index:20; border-color: var(--red); box-shadow: 0 0 30px rgba(var(--glow-rgb, 229, 9, 20), 0.45), 0 15px 30px rgba(0,0,0,0.6); }
.card img{ width:100%; height:180px; object-fit:cover; flex-shrink: 0; }
.card-info{ padding:18px 18px 10px 18px; flex-grow: 1; display: flex; flex-direction: column; }
.card-info strong{ display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; font-size:17px; white-space: normal; }
.card-info p{ font-size:14px; color:#ccc; line-height:1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.card-actions { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; padding: 0 15px 15px 15px; gap: 8px; margin-top: auto; }
.action-btn { padding: 10px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s; color: white; display: flex; align-items: center; justify-content: center; }
.action-btn:hover { transform: translateY(-3px); filter: brightness(1.3); }
.action-btn > svg, .action-btn > img { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }

.watch-btn { background: #e50914; grid-column: span 2; } 
.download-btn { background: var(--accent); grid-column: span 2; }

.card.card-recent{ min-width:210px; width: 210px; }
.card.card-recent img{ height: 120px; }
.card.card-recent .card-info{ padding: 12px 12px 6px 12px; }
.card.card-recent .card-info strong{ font-size: 14px; margin-bottom: 4px; }
.card.card-recent .card-info p{ font-size: 12px; -webkit-line-clamp: 2; }
.card.card-recent .card-actions { padding: 0 12px 12px 12px; gap: 6px; }
.card.card-recent .action-btn { padding: 8px; }
.card.card-recent .action-btn > svg, .card.card-recent .action-btn > img { width: 16px; height: 16px; }
.card.card-recent .fav-toggle-btn{ width: 30px; height: 30px; font-size: 14px; top: 8px; right: 8px; }

.fav-toggle-btn{ position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.75); border: 1px solid rgba(255,255,255,.2); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 30; display: flex; align-items: center; justify-content: center; transition: .2s; backdrop-filter: blur(5px); }
.fav-toggle-btn:hover{ transform: scale(1.15); background: rgba(0,0,0,.9); }
.fav-toggle-btn.is-fav{ color: var(--gold); border-color: var(--gold); text-shadow: 0 0 8px var(--gold); }

/* SKELETON SCREENS */
.skeleton-card { min-width:300px; width: 300px; height: 300px; background: rgba(255,255,255,.03); border-radius: 16px; display: flex; flex-direction: column; padding: 0; overflow: hidden; position: relative; }
.skeleton-img { width: 100%; height: 180px; background: rgba(255,255,255,.05); }
.skeleton-text1 { width: 60%; height: 16px; background: rgba(255,255,255,.06); margin: 18px 18px 10px; border-radius: 4px; }
.skeleton-text2 { width: 85%; height: 12px; background: rgba(255,255,255,.04); margin: 0 18px; border-radius: 4px; }
.skeleton-shimmer::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform: translateX(-100%); background-image: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.04) 20%, rgba(255,255,255,0.08) 60%, rgba(255,255,255,0) 100%); animation: shimmer 1.6s infinite; }
@keyframes shimmer { 100% { transform: translateX(100%); } }

/* RESPONSIVE */
@media(max-width:1100px){
  .topbar { flex-wrap: wrap; justify-content: space-between; padding: 10px 5%; }
  .console-buttons { order: 3; width: 100%; margin: 8px 0 0 0; justify-content: flex-start; }
  .logo { order: 1; }
  .right-tools { order: 2; }
}
@media(max-width:900px){
  .hero h1{ font-size:2.5rem; }
  .hero p{ font-size:1rem; }
  #fileSearch{ width:140px; }
  .card, .skeleton-card{ min-width:240px; width: 240px; }
  .card.card-recent{ min-width:180px; width: 180px; }
  .carousel-arrow{ display:none; }
  .aw-products { grid-template-columns: 1fr; gap: 10px; }
  .aw-product { min-height: auto; flex-direction: row; text-align: left; padding: 12px; }
  .aw-product img { width: 50px; height: 50px; }
  .aw-product span { margin-top: 0; margin-left: 10px; flex-grow: 1; }
  .aw-product .aw-choose-badge { margin-top: 0; margin-left: 5px; }
}
</style>
</head>

/* ================= VARIABLES GLOBALES ================= */
let idiomaActual = 'en'; 
let mediaFiles = {};
let heroItems = [];
let heroIndex = 0;
let favoritos = JSON.parse(localStorage.getItem('favoriteFiles')) || [];
let recientes = JSON.parse(localStorage.getItem('recentFiles')) || [];

/* DOM Elements Hub */
const fileSearch = document.getElementById('fileSearch');
const rowsContainer = document.getElementById('rowsContainer');
const recentContainer = document.getElementById('recentContainer');
const datalist = document.getElementById('file-suggestions');
const themeDotsContainer = document.getElementById('themeDots');
const mybutton = document.getElementById("backToTopBtn");

/* ================= SISTEMA DE TEMAS ================= */
const paletaTemas = {
  rojo: { hex: '#e50914', rgb: '229, 9, 20' },
  naranja: { hex: '#ff6600', rgb: '255, 102, 0' },
  amarillo: { hex: '#ffcc00', rgb: '255, 204, 0' },
  verde: { hex: '#2ecc71', rgb: '46, 204, 113' },
  azul: { hex: '#00aaff', rgb: '0, 170, 255' },
  violeta: { hex: '#9b59b6', rgb: '155, 89, 182' },
  rosa: { hex: '#ff80ab', rgb: '255, 128, 171' }
};

function initThemeDots() {
  const savedTheme = localStorage.getItem('selectedThemeColor') || 'rojo';
  Object.keys(paletaTemas).forEach(colorKey => {
    const dot = document.createElement('div'); dot.className = 'color-dot';
    dot.style.backgroundColor = paletaTemas[colorKey].hex; dot.dataset.color = colorKey;
    if (colorKey === savedTheme) { dot.classList.add('active-dot'); }
    dot.addEventListener('click', () => {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active-dot'));
      dot.classList.add('active-dot');
      localStorage.setItem('selectedThemeColor', colorKey);
      applyTheme(colorKey);
    });
    themeDotsContainer.appendChild(dot);
  });
  applyTheme(savedTheme);
}

function applyTheme(colorKey) {
  const theme = paletaTemas[colorKey] || paletaTemas.rojo;
  document.documentElement.style.setProperty('--red', theme.hex);
  document.documentElement.style.setProperty('--glow-rgb', theme.rgb);
  document.getElementById('aw-ytBtn').style.backgroundColor = theme.hex;
}

function getItemUniqueId(item, catName) { return `${catName}-${item.label?.es || item.label?.en || 'archivo'}`.toLowerCase().replace(/[^a-z0-9]/g, ''); }

/* ================= LÓGICA DEL MURO DE ACCESO Y CADUCIDAD (24H) ================= */
let youtubeDone = false;
let giveawayDone = false;
let accessGranted = false;

// Verificación estricta de 24 horas del acceso general
function comprobarAccesoTemporal() {
    const accessTimestamp = localStorage.getItem("lapresa_access_time");
    if (accessTimestamp) {
        const tiempoTranscurrido = Date.now() - parseInt(accessTimestamp);
        const veinticuatroHoras = 24 * 60 * 60 * 1000; // 24 horas en milisegundos

        if (tiempoTranscurrido < veinticuatroHoras) {
            accessGranted = true;
        } else {
            // El acceso ha caducado (pasaron las 24 horas)
            localStorage.removeItem("lapresa_access_time");
            accessGranted = false;
        }
    } else {
        accessGranted = false;
    }
}

function updateAccessProgress(){
    const t = translations[idiomaActual] || translations['en'];
    let total = 0;
    if(youtubeDone) total++;
    if(giveawayDone) total++;

    document.getElementById("aw-counter").innerHTML = t.awCounter.replace("{x}", total);
    document.getElementById("aw-fill").style.width = (total*50)+"%";

    if(total === 2){
        document.getElementById("aw-status").innerHTML = t.awUnlocked;
        document.getElementById("enterBtn").style.display = "block";
    }
}

// Tarea 1: Suscripción a YouTube con TEMPORIZADOR INVISIBLE
const ytBtn = document.getElementById('aw-ytBtn');
ytBtn.onclick = () => {
    const t = translations[idiomaActual] || translations['en'];
    window.open("https://www.youtube.com/@Kelonio3DS?sub_confirmation=1", "_blank");
    
    ytBtn.innerHTML = t.awYtBtnVerif;
    ytBtn.disabled = true;
    ytBtn.classList.add('is-verifying');

    // 40 segundos en segundo plano, sin mostrar números al usuario
    setTimeout(() => {
        youtubeDone = true;
        ytBtn.innerHTML = t.awYtBtnDone;
        ytBtn.classList.remove('is-verifying');
        ytBtn.classList.add("btn-done");
        updateAccessProgress();
    }, 40000);
};

// Tarea 2: Sorteo Dinámico de 3 Tarjetas
const giftBtn = document.getElementById('aw-giftBtn');
const productsDiv = document.getElementById('aw-products');

async function cargarSorteoDinamicoAcceso() {
    const t = translations[idiomaActual] || translations['en'];
    const baseURL = 'https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/';
    const catFiles = ['switch.json', 'ps5.json', 'sd_usb.json', '3ds.json'];
    let allProducts = [];

    for (let file of catFiles) {
        try {
            let res = await fetch(baseURL + file);
            if (res.ok) {
                let data = await res.json();
                let items = Array.isArray(data) ? data : Object.values(data);
                allProducts = allProducts.concat(items);
            }
        } catch (e) { console.error("Error cargando sorteos", e); }
    }

    if (allProducts.length >= 3) {
        allProducts.sort(() => 0.5 - Math.random());
        const selected = allProducts.slice(0, 3);
        productsDiv.innerHTML = '';
        
        selected.forEach(p => {
            let title = p.label?.[idiomaActual] || p.label?.es || p.label?.en || p.label || 'Surprise';
            let url = p.url?.es || p.url?.en || p.url || '#';
            if(!url.includes('tag=')) { url += (url.includes('?') ? '&' : '?') + 'tag=kelonio-21'; }
            let imgSrc = p.img || 'https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Logo%20Zip.png';

            productsDiv.innerHTML += `
                <div class="aw-product" onclick="selectAccessProduct('${url}')">
                    <img src="${imgSrc}" alt="${title}">
                    <span>${title}</span>
                    <div class="aw-choose-badge">${t.awChoose}</div>
                </div>
            `;
        });
    }
}

function selectAccessProduct(url){
    const t = translations[idiomaActual] || translations['en'];
    window.open(url, "_blank");
    giveawayDone = true;
    giftBtn.innerHTML = t.awGiftBtnDone;
    giftBtn.classList.add("btn-done");
    giftBtn.disabled = true;
    productsDiv.style.display = "none";
    updateAccessProgress();
}

giftBtn.onclick = () => { 
    if(!giveawayDone) {
        productsDiv.style.display = (productsDiv.style.display === "grid") ? "none" : "grid"; 
    }
};

document.getElementById('enterBtn').onclick = () => {
    // Al pulsar Entrar se guarda el momento exacto en milisegundos para controlar las 24 Horas
    localStorage.setItem("lapresa_access_time", Date.now().toString());
    iniciarAppPrincipal();
};

    document.getElementById('accessWall').style.display = 'none';

    mainHub.style.display = 'block';

/* ================= LOGICA HUB PRINCIPAL ================= */
function createLanguageSelector(){
  const selector = document.getElementById('languageSelector');
  const langs = { es:'Español', en:'English', fr:'Français', de:'Deutsch', it:'Italiano', ja:'日本語', ko:'한국어' };
  
  selector.innerHTML = '';
  Object.keys(langs).forEach(code=>{
    const opt = document.createElement('option'); opt.value = code; opt.textContent = langs[code];
    selector.appendChild(opt);
  });
  
  selector.value = idiomaActual;
  selector.addEventListener('change', e=>{
    idiomaActual = e.target.value; 
    translateInterface();
    if (Object.keys(mediaFiles).length > 0) { renderConsoleButtons(); renderAllRows(); updateHero(); updateSuggestions(); }
  });
}

function detectBrowserLanguage() {
  const browserLang = (navigator.language || 'en').split('-')[0].toLowerCase();
  if (translations[browserLang]) { 
      idiomaActual = browserLang; 
  } else {
      idiomaActual = 'en'; 
  }
}

function translateInterface(){
  const t = translations[idiomaActual] || translations['en'];
  document.title = t.title; 
  fileSearch.placeholder = t.search;
  document.getElementById('heroBtn').textContent = t.download;

  document.getElementById('aw-subtitle').innerHTML = t.awSubtitle;
  if(!youtubeDone) document.getElementById('aw-ytBtn').innerHTML = t.awYtBtn;
  if(!giveawayDone) document.getElementById('aw-giftBtn').innerHTML = t.awGiftBtn;
  document.getElementById('aw-loading-text').innerHTML = t.awLoading;
  document.getElementById('enterBtn').innerHTML = t.awEnter;
  
  let currentTotal = (youtubeDone ? 1 : 0) + (giveawayDone ? 1 : 0);
  document.getElementById("aw-counter").innerHTML = t.awCounter.replace("{x}", currentTotal);
  if(!accessGranted) {
      document.getElementById("aw-status").innerHTML = currentTotal === 2 ? t.awUnlocked : t.awLocked;
  }
}

function updateSuggestions(){
  datalist.innerHTML = ''; const set = new Set();
  Object.values(mediaFiles).forEach(cat=>{ cat.forEach(item=>{ if(item.label?.[idiomaActual] || item.label?.en){ set.add(item.label[idiomaActual] || item.label.en); } }); });
  set.forEach(label=>{ const opt = document.createElement('option'); opt.value = label; datalist.appendChild(opt); });
}

function renderConsoleButtons(){
  const iconMap = { switch:'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%20Switch.png', '3ds':'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%203DS.png' };
  const container = document.getElementById('consoleButtons'); container.innerHTML = '';
  Object.keys(mediaFiles).forEach(key=>{
    const btn = document.createElement('button'); btn.className = 'console-btn';
    btn.innerHTML = `<img src="${iconMap[key] || 'https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Logo%20Zip.png'}"><span>${key.toUpperCase()}</span>`;
    btn.onclick = ()=>showConsoleContent(key); container.appendChild(btn);
  });
  const favBtn = document.createElement('button'); favBtn.className = 'console-btn'; favBtn.id = 'mainFavoritesBtn';
  favBtn.innerHTML = `<div class="fav-icon-btn">★</div><span>${(translations[idiomaActual]||translations['en']).favorites}</span>`;
  favBtn.onclick = ()=>showFavoritesContent(); container.appendChild(favBtn);
}

function setupHeroRotation(){
  heroItems = [];
  Object.keys(mediaFiles).forEach(catId => { mediaFiles[catId].forEach(item => { heroItems.push({ ...item, _category: catId }); }); });
  if(!heroItems.length) return; updateHero();
  setInterval(()=>{ heroIndex++; if(heroIndex >= heroItems.length) heroIndex = 0; updateHero(); }, 10000);
}

function updateHero(){
  const item = heroItems[heroIndex]; if(!item) return;
  const title = item.label?.[idiomaActual] || item.label?.en || item.label?.es || 'Nintendo Archive';
  const desc = item.desc?.[idiomaActual] || item.desc?.en || item.desc?.es || '';
  const thumb = item.videoYoutubeIds ? `https://img.youtube.com/vi/${item.videoYoutubeIds}/maxresdefault.jpg` : 'https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Logo%20Zip.png';
  document.getElementById('heroTitle').textContent = title;
  document.getElementById('heroDesc').textContent = desc;
  document.getElementById('heroBanner').style.backgroundImage = `url('${thumb}')`;
  document.getElementById('heroBtn').onclick = () => {
    if(checkAccessValidity()){ registerRecentClick(item, item._category); window.open(item.url,'_blank'); return; }
    showDownloadPopup(item, item._category);
  };
}

function renderSkeletons(containerId, count = 5) {
  const container = document.getElementById(containerId); container.innerHTML = '';
  for(let i = 0; i < count; i++) {
    const card = document.createElement('div'); card.className = 'skeleton-card skeleton-shimmer';
    card.innerHTML = `<div class="skeleton-img"></div><div class="skeleton-text1"></div><div class="skeleton-text2"></div>`;
    container.appendChild(card);
  }
}

async function loadContent(){
  try{
    rowsContainer.innerHTML = `
      <div class="row"><h2>SWITCH</h2><div class="carousel" id="sk-switch"></div></div>
      <div class="row"><h2>3DS</h2><div class="carousel" id="sk-3ds"></div></div>
    `;
    renderSkeletons('sk-switch', 5); renderSkeletons('sk-3ds', 5);
    const response = await fetch('https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/data/consolas.json');
    mediaFiles = await response.json();
    setTimeout(() => { renderConsoleButtons(); renderRecentRow(); renderAllRows(); setupHeroRotation(); updateSuggestions(); }, 1000);
  }catch(err){ console.error(err); alert('Error loading content.'); }
}

function registerRecentClick(item, catName) {
  const uniqueId = getItemUniqueId(item, catName);
  recientes = recientes.filter(id => id !== uniqueId); recientes.unshift(uniqueId);
  if(recientes.length > 5) recientes.pop(); localStorage.setItem('recentFiles', JSON.stringify(recientes));
  if(!fileSearch.value.trim() && !document.getElementById('favConsole')) { renderRecentRow(); }
}

function renderRecentRow() {
  recentContainer.innerHTML = ''; if (recientes.length === 0) { recentContainer.style.display = 'none'; return; }
  recentContainer.style.display = 'block'; const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<h2 style="font-size:1.5rem; margin-bottom:12px; opacity:0.85;">${(translations[idiomaActual]||translations['en']).recent.toUpperCase()}</h2><div class="carousel" id="recentCarousel"></div>`;
  recentContainer.appendChild(row); const carousel = document.getElementById('recentCarousel');
  recientes.forEach(uniqueId => {
    let itemEncontrado = false;
    Object.keys(mediaFiles).forEach(catId => {
      if (itemEncontrado) return;
      mediaFiles[catId].forEach(item => { if (getItemUniqueId(item, catId) === uniqueId) { createCard(item, catId, carousel, true); itemEncontrado = true; } });
    });
  });
}

function renderAllRows(){
  rowsContainer.innerHTML = ''; renderRecentRow(); 
  Object.keys(mediaFiles).forEach(catId=>{
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<h2>${catId.toUpperCase()}</h2><div class="carousel-wrapper"><button class="carousel-arrow left">‹</button><div class="carousel" id="car-${catId}"></div><button class="carousel-arrow right">›</button></div>`;
    rowsContainer.appendChild(row); const carousel = document.getElementById(`car-${catId}`);
    mediaFiles[catId].forEach(item=>{ createCard(item, catId, carousel, false); });
    row.querySelector('.left').onclick = ()=>{ carousel.scrollBy({ left:-700, behavior:'smooth' }); };
    row.querySelector('.right').onclick = ()=>{ carousel.scrollBy({ left:700, behavior:'smooth' }); };
  });
}

function showConsoleContent(consoleId){
  recentContainer.innerHTML = ''; recentContainer.style.display = 'none'; rowsContainer.innerHTML = '';
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<h2 style="font-size:2.5rem;margin-bottom:25px;">${consoleId.toUpperCase()}</h2><div class="carousel" id="singleConsole" style="flex-wrap:wrap; overflow:visible;"></div>`;
  rowsContainer.appendChild(row); const carousel = document.getElementById('singleConsole');
  mediaFiles[consoleId].forEach(item=>{ createCard(item, consoleId, carousel, false); });
}

function showFavoritesContent(){
  recentContainer.innerHTML = ''; recentContainer.style.display = 'none'; rowsContainer.innerHTML = '';
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<h2 style="font-size:2.5rem;margin-bottom:25px; display:flex; align-items:center; gap:15px;"><span style="color:var(--gold);">★</span>${(translations[idiomaActual]||translations['en']).favorites.toUpperCase()}</h2><div class="carousel" id="favConsole" style="flex-wrap:wrap; overflow:visible;"></div>`;
  rowsContainer.appendChild(row); const carousel = document.getElementById('favConsole');
  let foundAny = false;
  Object.keys(mediaFiles).forEach(catId => { mediaFiles[catId].forEach(item => { if(favoritos.includes(getItemUniqueId(item, catId))){ createCard(item, catId, carousel, false); foundAny = true; } }); });
  if(!foundAny){ carousel.innerHTML = `<p style="color:#aaa; font-size:18px; padding:20px 0;">${(translations[idiomaActual]||translations['en']).noFavorites}</p>`; }
}

function createCard(item, catName, container, isMini = false){
  const t = translations[idiomaActual] || translations['en'];
  const card = document.createElement('div'); card.className = isMini ? 'card card-recent' : 'card';
  const uniqueId = getItemUniqueId(item, catName);
  const thumb = item.videoYoutubeIds ? `https://img.youtube.com/vi/${item.videoYoutubeIds}/maxresdefault.jpg` : 'https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Logo%20Zip.png';
  const title = item.label?.[idiomaActual] || item.label?.en || item.label?.es || ''; 
  const desc = item.desc?.[idiomaActual] || item.desc?.en || item.desc?.es || '';
  const isFav = favoritos.includes(uniqueId) ? 'is-fav' : ''; const iconFav = favoritos.includes(uniqueId) ? '★' : '☆';
  
  const iconPlay = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
  const iconZip = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`;
  
  card.innerHTML = `
    <button class="fav-toggle-btn ${isFav}">${iconFav}</button>
    <img src="${thumb}" loading="lazy">
    <div class="card-info"><strong>${title}</strong><p>${desc}</p></div>
    <div class="card-actions">
      <button class="action-btn watch-btn" title="${t.watch}">${iconPlay} <span style="margin-left:5px;">${t.watch}</span></button>
      <button class="action-btn download-btn" title="${t.download}">${iconZip}</button>
    </div>
  `;

  card.querySelector('.fav-toggle-btn').onclick = (e)=>{
    e.stopPropagation();
    if(favoritos.includes(uniqueId)){ favoritos = favoritos.filter(id => id !== uniqueId); e.target.classList.remove('is-fav'); e.target.textContent = '☆'; } 
    else { favoritos.push(uniqueId); e.target.classList.add('is-fav'); e.target.textContent = '★'; }
    localStorage.setItem('favoriteFiles', JSON.stringify(favoritos));
    if(document.getElementById('favConsole')){ showFavoritesContent(); }
  };
  card.querySelector('.watch-btn').onclick = (e)=>{ e.stopPropagation(); if (item.videoYoutubeIds) { window.open(`https://www.youtube.com/watch?v=${item.videoYoutubeIds}`, '_blank'); }};
  card.querySelector('.download-btn').onclick = (e)=>{
    e.stopPropagation();
    if(checkAccessValidity()){ registerRecentClick(item, catName); window.open(item.url, '_blank'); return; }
    showDownloadPopup(item, catName);
  };
  container.appendChild(card);
}

fileSearch.addEventListener('input',()=>{
  const query = fileSearch.value.toLowerCase().trim();
  if(!query){ renderAllRows(); return; }
  recentContainer.innerHTML = ''; recentContainer.style.display = 'none'; rowsContainer.innerHTML = '';
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<h2>Resultados</h2><div class="carousel" id="results" style="flex-wrap:wrap; overflow:visible;"></div>`;
  rowsContainer.appendChild(row); const results = document.getElementById('results');
  Object.keys(mediaFiles).forEach(catId => { mediaFiles[catId].forEach(item=>{ 
      let labelActual = (item.label?.[idiomaActual] || item.label?.en || item.label?.es || '').toLowerCase();
      if(labelActual.includes(query)){ createCard(item, catId, results, false); } 
  }); });
});

function checkAccessValidity() {
  const cycleState = localStorage.getItem('downloadCycleState') || '0';
  if (cycleState === '2') {
    const accessGrantedTime = localStorage.getItem('accessGrantedTime');
    if (accessGrantedTime && (Date.now() - parseInt(accessGrantedTime) < (3 * 60 * 60 * 1000))) { return true; }
    localStorage.setItem('downloadCycleState', '0'); localStorage.removeItem('accessGrantedTime');
  }
  return false; 
}

function showDownloadPopup(item, catName){
  const t = translations[idiomaActual] || translations['en'];
  const cycleState = localStorage.getItem('downloadCycleState') || '0';
  let targetUrl = 'https://www.youtube.com/@Kelonio3DS?sub_confirmation=1'; let btnText = t.subBtn;
  if (cycleState === '1') { targetUrl = 'https://www.youtube.com/@Kelonio3DS/join'; btnText = t.joinBtn; }

  const popup = document.createElement('div');
  popup.innerHTML = `<div id="downloadGate"><div class="download-box"><h2>${t.unlockTitle}</h2><p>${t.unlockDesc}</p><button id="subNowBtn">${btnText}</button></div></div>`;
  document.body.appendChild(popup);

  const subBtn = document.getElementById('subNowBtn');
  subBtn.onclick = () => {
    subBtn.disabled = true; window.open(targetUrl, '_blank');
    const box = popup.querySelector('.download-box');
    box.innerHTML = `<h2>${t.waitingTitle}</h2><p>${t.waitingDesc}</p>`;
    setTimeout(() => {
      registerRecentClick(item, catName);
      box.innerHTML = `<h2 style="color:#2ecc71;">${t.readyTitle}</h2><p>${t.readyDesc}</p><button id="finalDownloadBtn" style="background:#2ecc71; color:white; margin-top:15px; animation: pulseSub 1.5s infinite;">${t.readyBtn}</button>`;
      document.getElementById('finalDownloadBtn').onclick = () => { 
        window.open(item.url, '_blank'); 
        if (cycleState === '0') { localStorage.setItem('downloadCycleState', '1'); } 
        else if (cycleState === '1') { localStorage.setItem('downloadCycleState', '2'); localStorage.setItem('accessGrantedTime', Date.now().toString()); }
        popup.remove(); 
      };
    }, 60000);
  };
}

async function verificarNotificacionesRadar() {
  const badge = document.getElementById('radarBadge'); if (!badge) return;
  try {
    const response = await fetch('ultimas_noticias.json'); if(!response.ok) return;
    const noticias = await response.json();
    if(noticias.length > 0) {
      const ultimaFechaNoticia = new Date(noticias[0].date).getTime();
      const ultimaVisitaRadar = localStorage.getItem('ultimaVisitaRadar');
      if(!ultimaVisitaRadar || ultimaFechaNoticia > parseInt(ultimaVisitaRadar)) { badge.style.display = 'block'; }
    }
  } catch (error) { console.log("Sin radar actual."); }
}
function abrirRadar() { localStorage.setItem('ultimaVisitaRadar', Date.now().toString()); window.open('actualizaciones.html', '_self'); }

window.onscroll = function() {
  if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) { mybutton.style.display = "block"; } else { mybutton.style.display = "none"; }
};
