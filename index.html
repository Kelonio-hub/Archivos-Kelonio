<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Archivos Nintendo | La Presa</title>
<link rel="icon" type="image/gif" href="https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Lucario.gif">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1331209775183503" crossorigin="anonymous"></script>

<style>
:root{\r
  --red:#e50914; \r
  --bg:#141414;\r
  --glass:rgba(20,20,20,.78);\r
  --glass-border:rgba(255,255,255,.08);\r
  --accent:#00aaff;\r
  --gold:#ffcc00;\r
  --discord:#5865F2; \r
  --kofi:#FF5E5B;    \r
  --green:#2ecc71;\r
  --glow-rgb: 229, 9, 20;\r
}\r
*{\r
  margin:0;\r
  padding:0;\r
  box-sizing:border-box;\r
}\r
body{\r
  font-family:'Segoe UI',sans-serif;\r
  background:#141414;\r
  color:white;\r
  overflow-x:hidden;\r
  min-height: 100vh;\r
}\n\n/* ================= MURO DE ACCESO (OVERLAY) ================= */\n#accessWall {\n    position: fixed; inset: 0; z-index: 99999999;\n    background: radial-gradient(circle at top,#252525,#111);\n    display: flex; justify-content: center; align-items: center;\n    transition: opacity 0.5s ease, visibility 0.5s ease;\n}\n.access-card {\n    width: min(95%, 650px); background: rgba(27,27,27,.95);\n    border-radius: 24px; padding: 35px; text-align: center;\n    box-shadow: 0 0 40px rgba(var(--glow-rgb), 0.3);\n    border: 1px solid rgba(255,255,255,.08);\n    transition: box-shadow 0.3s ease;\n}\n.lucario { \n    width: 140px; filter: drop-shadow(0 0 10px var(--accent)) drop-shadow(0 0 25px var(--accent));\n    animation: float 3s ease-in-out infinite;\n}\n@keyframes float {\n    0%,100% { transform: translateY(0); }\n    50% { transform: translateY(-10px); }\n}\n.access-logo {\n    font-size: 3.5rem; font-weight: 900; color: var(--red); \n    letter-spacing: 4px; text-transform: uppercase; margin-top: 10px;\n    text-shadow: 0 0 10px rgba(var(--glow-rgb),.8), 0 0 20px rgba(var(--glow-rgb),.5);\n}\n.subtitle { margin-top: 10px; color: #ccc; line-height: 1.6; font-size: 15px; }\n.task { margin-top: 18px; }\n.task button {\n    width: 100%; border: none; padding: 16px; border-radius: 12px;\n    color: white; font-weight: bold; cursor: pointer; transition: .3s; font-size: 15px;\n}\n.btn-youtube { background: var(--red); }\n.btn-giveaway { background: #ff9900; }\n.btn-done { background: var(--green) !important; cursor: default !important; }\n\n@keyframes pulseSub { \n    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(var(--glow-rgb), 0.7); } \n    50% { transform: scale(1.02); box-shadow: 0 0 15px 0 rgba(var(--glow-rgb), 0.4); } \n    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(var(--glow-rgb), 0); } \n}\n.is-verifying { animation: pulseSub 1.5s infinite; filter: brightness(0.8); cursor: wait !important; }\n\n.aw-products { \n    display: none; \n    margin-top: 20px; \n    grid-template-columns: repeat(3, 1fr); \n    gap: 12px; \n}\n.aw-product {\n    background: rgba(255,255,255,0.03); \n    border: 2px solid rgba(255,255,255,.08);\n    border-radius: 16px; padding: 15px 10px; cursor: pointer;\n    transition: all .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); \n    display: flex; flex-direction: column; align-items: center; justify-content: space-between;\n    min-height: 180px; text-align: center; position: relative; overflow: hidden;\n}\n.aw-product img { width: 75px; height: 75px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); transition: transform 0.3s; }\n.aw-product span { font-size: 12px; font-weight: bold; color: #fff; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }\n.aw-product .aw-choose-badge { background: var(--accent); color: white; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 20px; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }\n\n.aw-product:hover { transform: translateY(-6px); background: rgba(255,255,255,0.07); border-color: #ff9900; box-shadow: 0 8px 20px rgba(255,153,0,0.2); }\n.aw-product:hover img { transform: scale(1.1); }\n.aw-product:hover .aw-choose-badge { background: #ff9900; opacity: 1; }\n\n.progress { margin-top: 25px; }\n.bar { height: 10px; background: #333; border-radius: 20px; overflow: hidden; margin-top: 10px; }\n.fill { height: 100%; width: 0%; background: var(--green); transition: .4s; }\n#enterBtn {\n    width: 100%; border: none; padding: 16px; border-radius: 12px;\n    background: var(--green); color: white; font-size: 18px; font-weight: bold;\n    cursor: pointer; margin-top: 20px; display: none;\n    box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);\n}\n#enterBtn:hover { transform: scale(1.02); filter: brightness(1.1); }\n.aw-status { margin-top: 15px; color: #aaa; font-size: 14px; font-weight: 600; }\r
\r
/* ================= TOPBAR Y HUB PRINCIPAL ================= */\r
#mainHub { display: none; opacity: 0; transition: opacity 0.5s ease; }\r
.topbar{\r
  position:fixed;\r
  top:0; left:0; right:0;\r
  z-index:9999;\r
  background:rgba(0,0,0,.88);\r
  backdrop-filter:blur(16px);\r
  display:flex;\r
  justify-content:space-between;\r
  align-items:center;\r
  padding:8px 3%;\r
  gap: 10px;\r
}\r
.logo{\r
  font-size:1.8rem;\r
  font-weight:900;\r
  color:var(--red);\r
  letter-spacing:-1.5px;\r
  transition: color 0.3s ease;\r
  flex-shrink: 0;\r
  text-decoration: none;\r
}\r
.right-tools{\r
  display:flex;\r
  align-items:center;\r
  gap:12px;\r
  flex-shrink: 0;\r
}\r
.config-group{\r
  display:flex;\r
  flex-direction:column;\r
  align-items:center;\r
  gap:4px;\r
}\r
.theme-dots-container{\r
  display:flex;\r
  gap:5px;\r
}\r
.color-dot{\r
  width:12px;\r
  height:12px;\r
  border-radius:50%;\r
  cursor:pointer;\r
  border:1px solid rgba(0,0,0,0.4);\r
  transition:transform .2s, border-color .2s;\r
}\r
.color-dot:hover{\r
  transform:scale(1.3);\r
}\r
.color-dot.active-dot{\r
  border:2px solid white;\r
  transform:scale(1.15);\r
  box-shadow: 0 0 8px rgba(255,255,255,0.6);\r
}\r
\r
#languageSelector{\r
  background:rgba(0,0,0,.8);\r
  border:1px solid var(--glass-border);\r
  color:#fff;\r
  padding:4px 8px;\r
  border-radius:6px;\r
  outline: none;\r
  cursor: pointer;\r
  font-size:11px;\r
}\r
#fileSearch{\r
  background:rgba(255,255,255,.08);\r
  border:none;\r
  color:white;\r
  width:170px;\r
  padding:8px 14px;\r
  border-radius:50px;\r
  font-size:13px;\r
  outline:none;\r
}\r
#fileSearch::placeholder{\r
  color:#ccc;\r
}\r
\r
.console-buttons{\r
  display:flex;\r
  gap:6px;\r
  flex-grow: 1;\r
  justify-content: center;\r
  overflow-x: auto;\r
  scrollbar-width: none;\r
  -ms-overflow-style: none;\r
  padding: 5px 0;\r
}\r
.console-buttons::-webkit-scrollbar {\r
  display: none;\r\n}\r
.console-btn{\r
  background:rgba(255,255,255,.05);\r
  border:1px solid rgba(255,255,255,.08);\r
  border-radius:10px;\r
  padding:6px 10px;\r
  display:flex;\r
  align-items:center;\r
  gap:6px;\r
  cursor:pointer;\r
  transition: .3s ease;\r
  color:white;\r
  font-weight:700;\r
  font-size: 11px;\r
  white-space: nowrap;\r
  flex-shrink: 0;\r
}\r
.console-btn:hover{\r
  transform:scale(1.05);\r
  border-color:var(--red);\r
  background:rgba(var(--glow-rgb),.15);\r
}\r
.console-btn.fav-active-btn{\r
  border-color:var(--gold);\r
  background:rgba(255,204,0,.15);\r
}\r
.console-btn span{\r
  color:white;\r
  letter-spacing:.5px;\r
}\r
.console-btn img{\r
  width:18px;\r
  height:18px;\r
  object-fit:contain;\r
}\r
.console-btn .fav-icon-btn {\r
  font-size: 14px;\r
  color: var(--gold);\r
  width: 18px;\r
  height: 18px;\r
  display: flex;\r
  align-items: center;\r
  justify-content: center;\r
  text-shadow: 0 0 8px rgba(255,204,0,0.5);\r
}\r
.products-btn {\r
  background: rgba(var(--glow-rgb), 0.1);\r
  border-color: rgba(var(--glow-rgb), 0.5);\r
}\r
.products-btn:hover {\r
  background: rgba(var(--glow-rgb), 0.4);\r
}\r
.products-btn .fav-icon-btn {\r
  color: white;\r
  text-shadow: none;\r
}\r
\r
/* BOTÓN SUBIR ARRIBA */\r
#backToTopBtn {\r
  display: none;\r
  position: fixed;\r
  bottom: 30px;\r
  right: 30px;\r
  z-index: 9999;\r
  background: var(--red);\r
  color: white;\r
  border: none;\r
  border-radius: 50%;\r
  width: 50px;\r
  height: 50px;\r
  cursor: pointer;\r
  font-size: 20px;\r
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);\r
  transition: opacity 0.3s, transform 0.3s;\r
}\r
#backToTopBtn:hover {\r
  transform: scale(1.1);\r
}\r
\r
/* APP LAYOUT */\r
#mainApp{\r
  display:block;\r
  padding-top:70px;\r
}\r
.hero{\r
  height:55vh;\r
  position:relative;\r
  display:flex;\r
  align-items:center;\r
  padding:0 6%;\r
  background-size:cover;\r
  background-position:center;\r
  transition:all .7s ease;\r
}\r
.hero::before{\r
  content:'';\r
  position:absolute;\r
  inset:0;\r
  background: linear-gradient(to right, rgba(20,20,20,.96) 15%, rgba(20,20,20,.4) 60%, rgba(20,20,20,.96));\r
}\r
.hero-content{\r
  position:relative;\r
  z-index:2;\r
  max-width:700px;\r
}\r
.hero h1{\r
  font-size:3.5rem;\r
  margin-bottom:15px;\r
}\r
.hero p{\r
  font-size:1.15rem;\r
  color:#ddd;\r
  margin-bottom:25px;\r
}\r
.hero button{\r
  border:none;\r
  background:var(--accent);\r
  color:white;\r
  padding:15px 35px;\r
  border-radius:10px;\r
  font-size:1.05rem;\r
  font-weight:800;\r
  cursor:pointer;\r
  transition: background 0.3s, filter 0.3s;\r
}\r
.hero button:hover{\r
  filter: brightness(1.2);\r
}\r
\r
.row{\r
  padding:25px 5%;\r
}\r
.row h2{\r
  margin-bottom:20px;\r
  font-size:2rem;\r
}\r
.carousel{\r
  display:flex;\r
  gap:16px;\r
  overflow-x:auto;\r
  scroll-behavior:smooth;\r
  padding-bottom:10px;\r
}\r
.carousel::-webkit-scrollbar{\r
  display:none;\r
}\r
.carousel-wrapper{\r
  position:relative;\r
}\r
.carousel-arrow{\r
  position:absolute;\r
  top:50%;\r
  transform:translateY(-50%);\r
  width:52px;\r
  height:52px;\r
  border:none;\r
  border-radius:50%;\r
  background:rgba(0,0,0,.7);\r
  color:white;\r
  font-size:28px;\r
  cursor:pointer;\r
  z-index:50;\r
  backdrop-filter:blur(10px);\r
  transition:.25s;\r
}\r
.carousel-arrow:hover{\r
  background:var(--red);\r
  transform:translateY(-50%) scale(1.1);\r
}\r
.carousel-arrow.left{\r
  left:-18px;\r
}\r
.carousel-arrow.right{\r
  right:-18px;\r
}\r
\r
/* CARDS */\r
.card{\r
  min-width:300px;\r
  width: 300px;\r
  background:rgba(255,255,255,.05);\r
  border-radius:16px;\r
  overflow:hidden;\r
  transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;\r
  display: flex;\r
  flex-direction: column;\r
  position: relative;\r
  border: 1px solid transparent;\r
}\r
.card:hover{\r
  transform:scale(1.03);\r
  z-index:20;\r
  border-color: var(--red);\r
  box-shadow: 0 0 30px rgba(var(--glow-rgb, 229, 9, 20), 0.45), 0 15px 30px rgba(0,0,0,0.6);\r
}\r
.card img{\r
  width:100%;\r
  height:180px;\r
  object-fit:cover;\r
  flex-shrink: 0;\r
}\r
.card-info{\r
  padding:18px 18px 10px 18px;\r
  flex-grow: 1;\r
  display: flex;\r
  flex-direction: column;\r
}\r
.card-info strong{\r
  display: -webkit-box;\r
  -webkit-line-clamp: 1;\r
  -webkit-box-orient: vertical;\r
  overflow: hidden;\r
  margin-bottom: 8px;\r
  font-size:17px;\r
  white-space: normal;\r
}\r
.card-info p{\r
  font-size:14px;\r
  color:#ccc;\r
  line-height:1.4;\r
  display: -webkit-box;\r
  -webkit-line-clamp: 2;\r
  -webkit-box-orient: vertical;\r
  overflow: hidden;\r
}\r
\r
/* BOTONES DE LA TARJETA */\r
.card-actions {\r
  display: grid;\r
  grid-template-columns: 1fr 1fr 1fr 1fr;\r
  padding: 0 15px 15px 15px;\r
  gap: 8px;\r
  margin-top: auto;\r
}\r
.action-btn {\r
  padding: 10px;\r
  border: none;\r
  border-radius: 8px;\r
  cursor: pointer;\r
  transition: all 0.2s;\r
  color: white;\r
  display: flex;\r
  align-items: center;\r
  justify-content: center;\r
}\r
.action-btn:hover {\r
  transform: translateY(-3px);\r
  filter: brightness(1.3);\r
}\r
.action-btn > svg, .action-btn > img {\r
  width: 20px;\r
  height: 20px;\r
  object-fit: contain;\r
  flex-shrink: 0;\r
}\r
\r
.watch-btn { background: #e50914; } \r
.download-btn { background: var(--accent); }\r
.discord-btn { background: var(--discord); } \r
.donate-btn { background: var(--green); }\r
\r
.card.card-recent{\r
  min-width:210px;\r
  width: 210px;\r
}\r
.card.card-recent img{\r
  height: 120px;\r
}\r
.card.card-recent .card-info{\r
  padding: 12px 12px 6px 12px;\r
}\r
.card.card-recent .card-info strong{\r
  font-size: 14px;\r
  margin-bottom: 4px;\r
}\r
.card.card-recent .card-info p{\r
  font-size: 12px;\r
  -webkit-line-clamp: 2;\r
}\r
.card.card-recent .card-actions {\r
  padding: 0 12px 12px 12px;\r
  gap: 6px;\r
}\r
.card.card-recent .action-btn {\r
  padding: 8px;\r
}\r
.card.card-recent .action-btn > svg, .card.card-recent .action-btn > img {\r
  width: 16px;\r
  height: 16px;\r
}\r
.card.card-recent .fav-toggle-btn{\r
  width: 30px;\r
  height: 30px;\r
  font-size: 14px;\r
  top: 8px;\r
  right: 8px;\r
}\r
\r
.fav-toggle-btn{\r
  position: absolute;\r
  top: 12px;\r
  right: 12px;\r
  background: rgba(0,0,0,.75);\r
  border: 1px solid rgba(255,255,255,.2);\r
  color: #fff;\r
  width: 36px;\r
  height: 36px;\r
  border-radius: 50%;\r
  font-size: 18px;\r
  cursor: pointer;\r
  z-index: 30;\r
  display: flex;\r
  align-items: center;\r
  justify-content: center;\r
  transition: .2s;\r
  backdrop-filter: blur(5px);\r
}\r
.fav-toggle-btn:hover{\r
  transform: scale(1.15);\r
  background: rgba(0,0,0,.9);\r
}\r
.fav-toggle-btn.is-fav{\r
  color: var(--gold);\r
  border-color: var(--gold);\r
  text-shadow: 0 0 8px var(--gold);\r
}\r
\r
/* SKELETON SCREENS */\r
.skeleton-card {\r
  min-width:300px;\r
  width: 300px;\r
  height: 300px;\r
  background: rgba(255,255,255,.03);\r
  border-radius: 16px;\r
  display: flex;\r
  flex-direction: column;\r
  padding: 0;\r
  overflow: hidden;\r
  position: relative;\r
}\r
.skeleton-img {\r
  width: 100%;\r
  height: 180px;\r
  background: rgba(255,255,255,.05);\r
}\r
.skeleton-text1 {\r
  width: 60%;\r
  height: 16px;\r
  background: rgba(255,255,255,.06);\r
  margin: 18px 18px 10px;\r
  border-radius: 4px;\r
}\r
.skeleton-text2 {\r
  width: 85%;\r
  height: 12px;\r
  background: rgba(255,255,255,.04);\r
  margin: 0 18px;\r
  border-radius: 4px;\r
}\r
.skeleton-shimmer::after {\r
  content: \"\";\r
  position: absolute;\r
  top: 0; right: 0; bottom: 0; left: 0;\r
  transform: translateX(-100%);\r
  background-image: linear-gradient(\r
    to right,\r
    rgba(255, 255, 255, 0) 0%,\r
    rgba(255, 255, 255, 0.04) 20%,\r
    rgba(255, 255, 255, 0.08) 60%,\r
    rgba(255, 255, 255, 0) 100%\r
  );\r
  animation: shimmer 1.6s infinite;\r
}\r
@keyframes shimmer {\r
  100% { transform: translateX(100%); }\r
}\r
\r
/* RESPONSIVE */\r
@media(max-width:1100px){\r
  .topbar { flex-wrap: wrap; justify-content: space-between; padding: 10px 5%; }\r
  .console-buttons { order: 3; width: 100%; margin: 8px 0 0 0; justify-content: flex-start; }\r
  .logo { order: 1; }\r
  .right-tools { order: 2; }\r
}\r
@media(max-width:900px){\r
  .hero h1{ font-size:2.5rem; }\r
  .hero p{ font-size:1rem; }\r
  #fileSearch{ width:140px; }\r
  .card, .skeleton-card{ min-width:240px; width: 240px; }\r
  .card.card-recent{ min-width:180px; width: 180px; }\r
  .carousel-arrow{ display:none; }\n  .aw-products { grid-template-columns: 1fr; gap: 10px; }\n  .aw-product { min-height: auto; flex-direction: row; text-align: left; padding: 12px; }\n  .aw-product img { width: 50px; height: 50px; }\n  .aw-product span { margin-top: 0; margin-left: 10px; flex-grow: 1; }\n  .aw-product .aw-choose-badge { margin-top: 0; margin-left: 5px; }\r
}\n</style>
</head>
<body>

<div id="accessWall">
    <div class="access-card">
        <img class="lucario" src="https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Lucario.gif" alt="Lucario">
        <div class="access-logo">LA PRESA</div>
        <p class="subtitle" id="aw-subtitle">Completa los pasos para acceder.</p>

        <div class="task">
            <button id="aw-ytBtn" class="btn-youtube">⬜ Suscribirse al canal</button>
        </div>

        <div class="task">
            <button id="aw-giftBtn" class="btn-giveaway">⬜ Participar en el sorteo</button>
            <div id="aw-products" class="aw-products">
                <p id="aw-loading-text" style="font-size:12px; color:#aaa; margin-top:5px; grid-column: span 3; text-align: center;">Cargando productos...</p>
            </div>
        </div>

        <div class="progress">
            <div id="aw-counter">Acceso 0 / 2</div>
            <div class="bar">
                <div id="aw-fill" class="fill"></div>
            </div>
        </div>

        <div class="aw-status" id="aw-status">🔒 Acceso bloqueado</div>
        <button id="enterBtn">🚀 ENTRAR A LA WEB</button>
    </div>
</div>

<div id="mainHub">
    <div class="topbar">
      <a href="#" class="logo">LA PRESA</a>
      
      <div class="console-buttons" id="consoleButtons"></div>

      <div class="right-tools">
        <button id="radarBtn" class="console-btn" style="background:transparent; border:none; padding: 4px 8px; position:relative;" title="Radar de Actualizaciones" onclick="abrirRadar()">
          <div class="fav-icon-btn" style="font-size: 16px;">📡</div>
          <span id="radarBadge" style="display:none; position:absolute; top:-2px; right:-2px; width:10px; height:10px; background:var(--red); border-radius:50%; box-shadow:0 0 8px var(--red);"></span>
        </button>

        <input type="text" id="fileSearch" placeholder="Buscar archivos..." list="file-suggestions">
        <datalist id="file-suggestions"></datalist>
        
        <div class="config-group">
          <div class="theme-dots-container" id="themeDots"></div>
          <select id="languageSelector"></select>
        </div>
      </div>
    </div>

    <div id="mainApp">
      <div class="hero" id="heroBanner">
        <div class="hero-content">
          <h1 id="heroTitle"></h1>
          <p id="heroDesc"></p>
          <button id="heroBtn"></button>
        </div>
      </div>

      <div id="recentContainer"></div>
      <div id="rowsContainer"></div>
    </div>

    <button id="backToTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>
</div>

<script>
/* ================= TRADUCCIONES INTERNAS ================= */
const translations = {
  es: {
    title: "Archivos Nintendo | La Presa",
    search: "Buscar archivos...",
    favorites: "Favoritos",
    noFavorites: "Aún no has añadido favoritos.",
    recent: "Vistos Recientemente",
    products: "Productos",
    discord: "Discord",
    donate: "Donar",
    noVideo: "No hay video disponible.",
    awSubtitle: "Completa los pasos para acceder.",
    awYtBtn: "⬜ Suscribirse al canal",
    awYtBtnVerif: "⏳ Verificando en segundo plano...",
    awYtBtnDone: "✅ Canal visitado",
    awGiftBtn: "⬜ Participar en el sorteo",
    awGiftBtnDone: "✅ Sorteo registrado",
    awLoading: "Cargando productos...",
    awChoose: "Elegir",

/* ================= LÓGICA DE DETECCION DE TEXTOS DINÁMICOS (INDEX 23) ================= */
function getTranslatedText(obj) {
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  return obj[idiomaActual] || obj['es'] || obj['en'] || Object.values(obj)[0] || '';
}

function getItemUniqueId(item, catName) { 
  let txtId = (item.label && typeof item.label === 'object') ? (item.label['en'] || item.label['es']) : (item.label || 'archivo');
  return `${catName}-${txtId}`.toLowerCase().replace(/[^a-z0-9]/g, ''); 
}

/* ================= SISTEMA DE TEMAS ================= */
const paletaTemas = {
  rojo: { hex: '#e50914', rgb: '229, 9, 20' },
  naranja: { hex: '#ff6600', rgb: '255, 102, 0' },
  amarillo: { hex: '#ffcc00', rgb: '255, 204, 0' },
  verde: { hex: '#2ecc71', rgb: '46, 204, 113' },
  azul: { hex: '#00aaff', rgb: '0, 170, 255' },
  violeta: { hex: '#9b59b6', rgb: '155, 89, 182' },
  rosa: { hex: '#ff80ab', rgb: '255, 128, 171' }
};

function initThemeDots() {
  const savedTheme = localStorage.getItem('selectedThemeColor') || 'rojo';
  Object.keys(paletaTemas).forEach(colorKey => {
    const dot = document.createElement('div'); dot.className = 'color-dot';
    dot.style.backgroundColor = paletaTemas[colorKey].hex; dot.dataset.color = colorKey;
    if (colorKey === savedTheme) { dot.classList.add('active-dot'); }
    dot.addEventListener('click', () => {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active-dot'));
      dot.classList.add('active-dot');
      localStorage.setItem('selectedThemeColor', colorKey);
      applyTheme(colorKey);
    });
    themeDotsContainer.appendChild(dot);
  });
  applyTheme(savedTheme);
}

function applyTheme(colorKey) {
  const theme = paletaTemas[colorKey] || paletaTemas.rojo;
  document.documentElement.style.setProperty('--red', theme.hex);
  document.documentElement.style.setProperty('--glow-rgb', theme.rgb);
  document.getElementById('aw-ytBtn').style.backgroundColor = theme.hex;
}

/* ================= LÓGICA DEL MURO DE ACCESO ================= */
let youtubeDone = false;
let giveawayDone = false;
let accessGranted = false;

function comprobarAccesoTemporal() {
    const accessTimestamp = localStorage.getItem("lapresa_access_time");
    if (accessTimestamp) {
        const tiempoTranscurrido = Date.now() - parseInt(accessTimestamp);
        const veinticuatroHoras = 24 * 60 * 60 * 1000; 
        if (tiempoTranscurrido < veinticuatroHoras) { accessGranted = true; } 
        else { localStorage.removeItem("lapresa_access_time"); accessGranted = false; }
    } else {
        accessGranted = false;
    }
}

function updateAccessProgress(){
    const t = translations[idiomaActual] || translations['en'];
    let total = 0;
    if(youtubeDone) total++;
    if(giveawayDone) total++;

    document.getElementById("aw-counter").innerHTML = t.awCounter.replace("{x}", total);
    document.getElementById("aw-fill").style.width = (total*50)+"%";

    if(total === 2){
        document.getElementById("aw-status").innerHTML = t.awUnlocked;
        document.getElementById("enterBtn").style.display = "block";
    }
}

const ytBtn = document.getElementById('aw-ytBtn');
ytBtn.onclick = () => {
    const t = translations[idiomaActual] || translations['en'];
    window.open("https://www.youtube.com/@Kelonio3DS?sub_confirmation=1", "_blank", "noopener,noreferrer");
    
    ytBtn.innerHTML = t.awYtBtnVerif;
    ytBtn.disabled = true;
    ytBtn.classList.add('is-verifying');

    setTimeout(() => {
        youtubeDone = true;
        ytBtn.innerHTML = t.awYtBtnDone;
        ytBtn.classList.remove('is-verifying');
        ytBtn.classList.add("btn-done");
        updateAccessProgress();
    }, 40000);
};

const giftBtn = document.getElementById('aw-giftBtn');
const productsDiv = document.getElementById('aw-products');

async function cargarSorteoDinamicoAcceso() {
    const baseURL = 'https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/';
    const catFiles = ['switch.json', 'ps5.json', 'sd_usb.json', '3ds.json'];
    let allProducts = [];

    for (let file of catFiles) {
        try {
            let res = await fetch(baseURL + file + '?nocache=' + new Date().getTime());
            if (res.ok) {
                let data = await res.json();
                let items = Array.isArray(data) ? data : Object.values(data);
                allProducts = allProducts.concat(items);
            }
        } catch (e) { console.error("Error cargando sorteos", e); }
    }

    if (allProducts.length >= 3) {
        allProducts.sort(() => 0.5 - Math.random());
        accessProductsData = allProducts.slice(0, 3);
        renderSorteoAcceso(); 
    }
}

function renderSorteoAcceso() {
    if (accessProductsData.length === 0) return;
    const t = translations[idiomaActual] || translations['en'];
    productsDiv.innerHTML = '';
    
    accessProductsData.forEach(p => {
        let title = getTranslatedText(p.label) || 'Surprise';
        let url = getTranslatedText(p.url) || '#';
        if(url !== '#' && !url.includes('tag=')) { url += (url.includes('?') ? '&' : '?') + 'tag=kelonio-21'; }
        let imgSrc = p.img || 'https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Logo%20Zip.png';

        productsDiv.innerHTML += `
            <div class="aw-product" onclick="selectAccessProduct('${url}')">
                <img src="${imgSrc}" alt="${title}">
                <span>${title}</span>
                <div class="aw-choose-badge">${t.awChoose}</div>
            </div>
        `;
    });
}

function selectAccessProduct(url){
    const t = translations[idiomaActual] || translations['en'];
    window.open(url, "_blank", "noopener,noreferrer");
    giveawayDone = true;
    giftBtn.innerHTML = t.awGiftBtnDone;
    giftBtn.classList.add("btn-done");
    giftBtn.disabled = true;
    productsDiv.style.display = "none";
    updateAccessProgress();
}

giftBtn.onclick = () => { 
    if(!giveawayDone) { productsDiv.style.display = (productsDiv.style.display === "grid") ? "none" : "grid"; }
};

document.getElementById('enterBtn').onclick = () => {
    localStorage.setItem("lapresa_access_time", Date.now().toString());
    iniciarAppPrincipal();
};

/* ================= LÓGICA DE TRADUCCIÓN COMPLETA (FUSIÓN INDEX 23) ================= */
function updateLanguage() {
  const t = translations[idiomaActual] || translations['en'];
  
  document.getElementById('pageTitle').textContent = t.title;
  fileSearch.placeholder = t.search;
  document.getElementById('heroBtn').textContent = t.download;

  // Actualizar textos del muro de acceso
  document.getElementById('aw-subtitle').innerHTML = t.awSubtitle;
  if(!youtubeDone) document.getElementById('aw-ytBtn').innerHTML = t.awYtBtn;
  if(!giveawayDone) document.getElementById('aw-giftBtn').innerHTML = t.awGiftBtn;
  document.getElementById('aw-loading-text').innerHTML = t.awLoading;
  document.getElementById('enterBtn').innerHTML = t.awEnter;
  
  let currentTotal = (youtubeDone ? 1 : 0) + (giveawayDone ? 1 : 0);
  document.getElementById("aw-counter").innerHTML = t.awCounter.replace("{x}", currentTotal);
  if(!accessGranted) {
      document.getElementById("aw-status").innerHTML = currentTotal === 2 ? t.awUnlocked : t.awLocked;
  }

  // Refrescar vistas del hub dinámico basado en lo guardado
  if (Object.keys(mediaFiles).length > 0) {
    renderConsoleButtons();
    updateHero();
    updateSuggestions();

    if (currentView.type === 'home') renderAllRows();
    else if (currentView.type === 'console') showConsoleContent(currentView.id);
    else if (currentView.type === 'favorites') showFavoritesContent();
    else if (currentView.type === 'search') triggerSearch(currentView.id);
  }
}

function createLanguageSelector(){
  const selector = document.getElementById('languageSelector');
  const langs = { es:'Español', en:'English', fr:'Français', de:'Deutsch', it:'Italiano', pt:'Português', ja:'日本語', ko:'한국어' };
  
  selector.innerHTML = '';
  Object.keys(langs).forEach(code=>{
    const opt = document.createElement('option'); opt.value = code; opt.textContent = langs[code];
    selector.appendChild(opt);
  });
  
  selector.value = idiomaActual;
  selector.addEventListener('change', e=>{
    idiomaActual = e.target.value; 
    updateLanguage();
    renderSorteoAcceso();
  });
}

function detectBrowserLanguage() {
  const browserLang = (navigator.language || 'en').split('-')[0].toLowerCase();
  if (translations[browserLang]) { idiomaActual = browserLang; } 
  else { idiomaActual = 'en'; }
}

function updateSuggestions(){
  datalist.innerHTML = ''; const set = new Set();
  Object.values(mediaFiles).forEach(cat=>{ 
      cat.forEach(item=>{ 
          let lbl = getTranslatedText(item.label);
          if(lbl) set.add(lbl); 
      }); 
  });
  set.forEach(label=>{ const opt = document.createElement('option'); opt.value = label; datalist.appendChild(opt); });
}

function setupHeroRotation(){
  heroItems = [];
  Object.keys(mediaFiles).forEach(catId => { mediaFiles[catId].forEach(item => { heroItems.push({ ...item, _category: catId }); }); });
  if(!heroItems.length) return; updateHero();
  setInterval(()=>{ heroIndex++; if(heroIndex >= heroItems.length) heroIndex = 0; updateHero(); }, 10000);
}

function updateHero(){
  const item = heroItems[heroIndex]; if(!item) return;
  const title = getTranslatedText(item.label) || 'Nintendo Archive';
  const desc = getTranslatedText(item.desc);
  const thumb = item.videoYoutubeIds ? `https://img.youtube.com/vi/${item.videoYoutubeIds}/maxresdefault.jpg` : 'https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Logo%20Zip.png';
  
  document.getElementById('heroTitle').textContent = title;
  document.getElementById('heroDesc').textContent = desc;
  document.getElementById('heroBanner').style.backgroundImage = `url('${thumb}')`;
  
  document.getElementById('heroBtn').onclick = () => {
    registerRecentClick(item, item._category);
    window.open(getTranslatedText(item.url), '_blank', 'noopener,noreferrer');
  };
}

function renderSkeletons(containerId, count = 5) {
  const container = document.getElementById(containerId); container.innerHTML = '';
  for(let i = 0; i < count; i++) {
    const card = document.createElement('div'); card.className = 'skeleton-card skeleton-shimmer';
    card.innerHTML = `<div class="skeleton-img"></div><div class="skeleton-text1"></div><div class="skeleton-text2"></div>`;
    container.appendChild(card);
  }
}

async function loadContent(){
  try{
    rowsContainer.innerHTML = `
      <div class="row"><h2>SWITCH</h2><div class="carousel" id="sk-switch"></div></div>
      <div class="row"><h2>3DS</h2><div class="carousel" id="sk-3ds"></div></div>
    `;
    renderSkeletons('sk-switch', 5); renderSkeletons('sk-3ds', 5);
    
    // El destructor de caché evita archivos antiguos en local/servidores de GitHub
    const response = await fetch('https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/data/consolas.json?nocache=' + new Date().getTime());
    mediaFiles = await response.json();
    
    setTimeout(() => { renderConsoleButtons(); renderAllRows(); setupHeroRotation(); updateSuggestions(); }, 1000);
  }catch(err){ console.error(err); alert('Error loading content.'); }
}

function registerRecentClick(item, catName) {
  const uniqueId = getItemUniqueId(item, catName);
  recientes = recientes.filter(id => id !== uniqueId); recientes.unshift(uniqueId);
  if(recientes.length > 5) recientes.pop(); localStorage.setItem('recentFiles', JSON.stringify(recientes));
  if(currentView.type === 'home') { renderRecentRow(); }
}

function renderRecentRow() {
  recentContainer.innerHTML = ''; if (recientes.length === 0) { recentContainer.style.display = 'none'; return; }
  recentContainer.style.display = 'block'; const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<h2 style="font-size:1.5rem; margin-bottom:12px; opacity:0.85;">${(translations[idiomaActual]||translations['en']).recent.toUpperCase()}</h2><div class="carousel" id="recentCarousel"></div>`;
  recentContainer.appendChild(row); const carousel = document.getElementById('recentCarousel');
  recientes.forEach(uniqueId => {
    let itemEncontrado = false;
    Object.keys(mediaFiles).forEach(catId => {
      if (itemEncontrado) return;
      mediaFiles[catId].forEach(item => { if (getItemUniqueId(item, catId) === uniqueId) { createCard(item, catId, carousel, true); itemEncontrado = true; } });
    });
  });
}

function renderAllRows(){
  currentView = { type: 'home', id: null };
  rowsContainer.innerHTML = ''; renderRecentRow(); 
  Object.keys(mediaFiles).forEach(catId=>{
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<h2>${catId.toUpperCase()}</h2><div class="carousel-wrapper"><button class="carousel-arrow left">‹</button><div class="carousel" id="car-${catId}"></div><button class="carousel-arrow right">›</button></div>`;
    rowsContainer.appendChild(row); const carousel = document.getElementById(`car-${catId}`);
    mediaFiles[catId].forEach(item=>{ createCard(item, catId, carousel, false); });
    row.querySelector('.left').onclick = ()=>{ carousel.scrollBy({ left:-700, behavior:'smooth' }); };
    row.querySelector('.right').onclick = ()=>{ carousel.scrollBy({ left:700, behavior:'smooth' }); };
  });
}

function showConsoleContent(consoleId){
  currentView = { type: 'console', id: consoleId };
  recentContainer.innerHTML = ''; recentContainer.style.display = 'none'; rowsContainer.innerHTML = '';
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<h2 style="font-size:2.5rem;margin-bottom:25px;">${consoleId.toUpperCase()}</h2><div class="carousel" id="singleConsole" style="flex-wrap:wrap; overflow:visible;"></div>`;
  rowsContainer.appendChild(row); const carousel = document.getElementById('singleConsole');
  mediaFiles[consoleId].forEach(item=>{ createCard(item, consoleId, carousel, false); });
}

function showFavoritesContent(){
  currentView = { type: 'favorites', id: null };
  recentContainer.innerHTML = ''; recentContainer.style.display = 'none'; rowsContainer.innerHTML = '';
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<h2 style="font-size:2.5rem;margin-bottom:25px; display:flex; align-items:center; gap:15px;"><span style="color:var(--gold);">★</span>${(translations[idiomaActual]||translations['en']).favorites.toUpperCase()}</h2><div class="carousel" id="favConsole" style="flex-wrap:wrap; overflow:visible;"></div>`;
  rowsContainer.appendChild(row); const carousel = document.getElementById('favConsole');
  let foundAny = false;
  Object.keys(mediaFiles).forEach(catId => { mediaFiles[catId].forEach(item => { if(favoritos.includes(getItemUniqueId(item, catId))){ createCard(item, catId, carousel, false); foundAny = true; } }); });
  if(!foundAny){ carousel.innerHTML = `<p style="color:#aaa; font-size:18px; padding:20px 0;">${(translations[idiomaActual]||translations['en']).noFavorites}</p>`; }
}

function triggerSearch(query) {
  currentView = { type: 'search', id: query };
  if(!query){ renderAllRows(); return; }
  recentContainer.innerHTML = ''; recentContainer.style.display = 'none'; rowsContainer.innerHTML = '';
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<h2>Resultados</h2><div class="carousel" id="results" style="flex-wrap:wrap; overflow:visible;"></div>`;
  rowsContainer.appendChild(row); const results = document.getElementById('results');
  Object.keys(mediaFiles).forEach(catId => { mediaFiles[catId].forEach(item=>{ 
      let labelActual = getTranslatedText(item.label).toLowerCase();
      if(labelActual.includes(query)){ createCard(item, catId, results, false); } 
  }); });
}

fileSearch.addEventListener('input', () => { triggerSearch(fileSearch.value.toLowerCase().trim()); });

function createCard(item, catName, container, isMini = false){
  const t = translations[idiomaActual] || translations['en'];
  const card = document.createElement('div'); card.className = isMini ? 'card card-recent' : 'card';
  const uniqueId = getItemUniqueId(item, catName);
  
  // Lectura unificada idéntica a tu index 23 nativo
  const title = getTranslatedText(item.label);
  const desc = getTranslatedText(item.desc);
  const itemUrl = getTranslatedText(item.url);
  
  const thumb = item.videoYoutubeIds ? `https://img.youtube.com/vi/${item.videoYoutubeIds}/maxresdefault.jpg` : 'https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Logo%20Zip.png';
  const isFav = favoritos.includes(uniqueId) ? 'is-fav' : ''; const iconFav = favoritos.includes(uniqueId) ? '★' : '☆';
  
  const iconPlay = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
  const iconZip = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`;
  const iconDiscord = `<svg viewBox="0 0 127.14 96.36" fill="currentColor"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-19.32-72.15ZM42.56,65.36c-5.36,0-9.82-5.06-9.82-11.27s4.35-11.27,9.82-11.27c5.5,0,9.9,5.14,9.82,11.27,0,6.21-4.32,11.27-9.82,11.27Zm42,0c-5.36,0-9.82-5.06-9.82-11.27s4.35-11.27,9.82-11.27c5.5,0,9.9,5.14,9.82,11.27,0,6.21-4.32,11.27-9.82,11.27Z"/></svg>`;
  const iconDonate = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>`;

  let discordLink = ''; let kofiLink = '';
  if (['wii', 'wiiu', 'wii mini'].includes(catName.toLowerCase())) { discordLink = 'https://discord.com/invite/xHg7XaYJvK'; kofiLink = 'https://ko-fi.com/wiide'; }
  else { discordLink = 'https://discord.gg/8Fv8GDg'; kofiLink = 'https://ko-fi.com/lapresa'; }
  
  card.innerHTML = `
    <button class="fav-toggle-btn ${isFav}">${iconFav}</button>
    <img src="${thumb}" loading="lazy">
    <div class="card-info"><strong>${title}</strong><p>${desc}</p></div>
    <div class="card-actions">
      <button class="action-btn watch-btn" title="${t.watch}">${iconPlay}</button>
      <button class="action-btn download-btn" title="${t.download}">${iconZip}</button>
      <button class="action-btn discord-btn" title="${t.discord}">${iconDiscord}</button>
      <button class="action-btn donate-btn" title="${t.donate}">${iconDonate}</button>
    </div>
  `;

  card.querySelector('.fav-toggle-btn').onclick = (e)=>{
    e.stopPropagation();
    if(favoritos.includes(uniqueId)){ favoritos = favoritos.filter(id => id !== uniqueId); e.target.classList.remove('is-fav'); e.target.textContent = '☆'; } 
    else { favoritos.push(uniqueId); e.target.classList.add('is-fav'); e.target.textContent = '★'; }
    localStorage.setItem('favoriteFiles', JSON.stringify(favoritos));
    if(document.getElementById('favConsole')){ showFavoritesContent(); }
  };
  
  card.querySelector('.watch-btn').onclick = (e)=>{ 
      e.stopPropagation(); 
      if (item.videoYoutubeIds) { window.open(`https://www.youtube.com/watch?v=${item.videoYoutubeIds}`, '_blank', 'noopener,noreferrer'); } 
      else { alert(t.noVideo || "No hay video disponible."); }
  };
  
  card.querySelector('.download-btn').onclick = (e)=>{
    e.stopPropagation();
    registerRecentClick(item, catName);
    window.open(itemUrl, '_blank', 'noopener,noreferrer'); 
  };
  
  card.querySelector('.discord-btn').onclick = (e)=>{ e.stopPropagation(); window.open(discordLink, '_blank', 'noopener,noreferrer'); };
  card.querySelector('.donate-btn').onclick = (e)=>{ e.stopPropagation(); window.open(kofiLink, '_blank', 'noopener,noreferrer'); };

  container.appendChild(card);
}

async function verificarNotificacionesRadar() {
  const badge = document.getElementById('radarBadge'); if (!badge) return;
  try {
    const response = await fetch('ultimas_noticias.json?nocache=' + new Date().getTime()); if(!response.ok) return;
    const noticias = await response.json();
    if(noticias.length > 0) {
      const ultimaFechaNoticia = new Date(noticias[0].date).getTime();
      const ultimaVisitaRadar = localStorage.getItem('ultimaVisitaRadar');
      if(!ultimaVisitaRadar || ultimaFechaNoticia > parseInt(ultimaVisitaRadar)) { badge.style.display = 'block'; }
    }
  } catch (error) { console.log("Sin radar actual."); }
}
function abrirRadar() { localStorage.setItem('ultimaVisitaRadar', Date.now().toString()); window.open('actualizaciones.html', '_self'); }
