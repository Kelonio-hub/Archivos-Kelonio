<style>
:root{
  --red:#e50914; 
  --bg:#090b13; 
  --card-bg:#1a1d29; 
  --glass:rgba(26,29,41,.78);
  --glass-border:rgba(255,255,255,.1);
  --accent:#00e6e6;
  --gold:#ffcc00;
  --discord:#5865F2; 
  --kofi:#FF5E5B;    
  --green:#2ecc71;
  --glow-rgb: 229, 9, 20;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:'Segoe UI',sans-serif; background:var(--bg); color:white; overflow-x:hidden; min-height: 100vh; }

/* ================= MURO DE ACCESO ESTILO DISNEY ================= */
#accessWallOverlay {
    position: fixed; inset: 0; z-index: 99999999;
    background: #090b13; 
    display: flex; justify-content: center; align-items: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #f9f9f9;
    transition: opacity 0.5s ease, visibility 0.5s ease;
}

.disney-access-card { 
    width: 90%; max-width: 620px; 
    background: rgba(26, 29, 41, 0.95); 
    backdrop-filter: blur(14px); 
    padding: 50px 40px; 
    border-radius: 24px; 
    border: 1px solid rgba(255,255,255,0.15); 
    text-align: center; 
    box-shadow: 0 0 60px rgba(0, 230, 230, 0.25);
}

.disney-logo-title { font-size: 5.4rem; font-weight: 900; color: #ffffff; margin-bottom: 20px; letter-spacing: -3px; }
.disney-subtitle { font-size: 1.3rem; margin-bottom: 35px; opacity: 0.9; }

.disney-progress-bar { height: 14px; background: #222; border-radius: 10px; margin: 30px 0; overflow: hidden; }
.disney-progress-fill { height: 100%; width: 0%; background: #00e6e6; transition: width 0.7s ease; }

.disney-step-btn { 
    width: 100%; padding: 18px; margin: 12px 0; 
    border-radius: 14px; border: none; 
    background: rgba(255,255,255,0.1); 
    color: white; font-size: 1.15rem; font-weight: 600;
    cursor: pointer; transition: all 0.3s;
}
.disney-step-btn:hover { background: rgba(255,255,255,0.25); }
.disney-step-done { background: #00e6e6 !important; color: #000 !important; cursor: default; }

#disneyProductsContainer {
    display: none; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px; margin: 25px 0; max-height: 280px; overflow-y: auto;
}
#disneyProductsContainer::-webkit-scrollbar { width: 6px; }
#disneyProductsContainer::-webkit-scrollbar-thumb { background: #00e6e6; border-radius: 10px; }

.disney-aw-product {
    background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 12px; cursor: pointer; transition: 0.3s;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
}
.disney-aw-product:hover { transform: translateY(-6px); border-color: #00e6e6; }
.disney-aw-product img { width: 70px; height: 70px; object-fit: contain; }
.disney-aw-product span { font-size: 13.5px; font-weight: 600; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: center; }
.disney-choose-badge { margin-top: 8px; font-size: 11px; background: #00e6e6; color: #000; padding: 4px 12px; border-radius: 30px; font-weight: 800; }


/* ================= TOPBAR Y MAIN HUB ================= */
#mainHub { display: none; opacity: 0; transition: opacity 0.5s ease; }
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:9999; 
  background: linear-gradient(to bottom, rgba(9,11,19,0.95) 0%, transparent 100%); 
  display:flex; justify-content:space-between; align-items:center; padding:15px 5%; gap: 10px; pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.logo{ font-size:1.8rem; font-weight:900; color:var(--red); letter-spacing:-1.5px; transition: color 0.3s ease; flex-shrink: 0; text-decoration: none;}
.right-tools{ display:flex; align-items:center; gap:12px; flex-shrink: 0; }
.config-group{ display:flex; flex-direction:column; align-items:center; gap:4px; }
.theme-dots-container{ display:flex; gap:5px; }
.color-dot{ width:12px; height:12px; border-radius:50%; cursor:pointer; border:1px solid rgba(255,255,255,0.2); transition:transform .2s, border-color .2s; }
.color-dot:hover{ transform:scale(1.3); }
.color-dot.active-dot{ border:2px solid white; transform:scale(1.15); box-shadow: 0 0 8px rgba(255,255,255,0.6); }

#languageSelector{ background:rgba(26,29,41,.9); border:1px solid var(--glass-border); color:#fff; padding:4px 8px; border-radius:6px; outline: none; cursor: pointer; font-size:11px; }
#fileSearch{ background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.05); color:white; width:190px; padding:8px 14px; border-radius:50px; font-size:13px; outline:none; transition: 0.3s; }
#fileSearch:focus { background:rgba(255,255,255,.15); border-color:var(--red); }
#fileSearch::placeholder{ color:#aaa; }

/* ================= LAYOUT & HERO ================= */
#mainApp{ display:block; }
.hero{ min-height:60vh; padding-bottom: 60px; position:relative; display:flex; align-items:center; padding-left: 6%; padding-right: 6%; background-size:cover; background-position:center; transition:all .7s ease; }
/* Efecto de viñeta Disney (laterales oscuros y degradado por debajo) */
.hero::before{ content:''; position:absolute; inset:0; background: linear-gradient(to right, #090b13 10%, rgba(9,11,19,0.3) 60%, #090b13); z-index: 1;}
.hero::after{ content:''; position:absolute; inset:0; background: linear-gradient(to top, #090b13 0%, transparent 40%); z-index:2; pointer-events:none; }
.hero-content{ position:relative; z-index:3; max-width:700px; margin-top: 50px; }
.hero h1{ font-size:3.8rem; margin-bottom:15px; font-weight: 800; text-shadow: 0 4px 15px rgba(0,0,0,0.8); }
.hero p{ font-size:1.15rem; color:#eee; margin-bottom:25px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
.hero button{ border:none; background:var(--red); color:white; padding:15px 35px; border-radius:10px; font-size:1.05rem; font-weight:800; cursor:pointer; transition: transform 0.3s, box-shadow 0.3s; box-shadow: 0 4px 15px rgba(var(--glow-rgb), 0.4); }
.hero button:hover{ transform: scale(1.05); box-shadow: 0 6px 20px rgba(var(--glow-rgb), 0.6); }

/* ================= CONSOLE BUTTONS (DEBAJO DEL HERO) ================= */
.console-buttons-container {
    padding: 0 5%;
    margin-top: -30px; 
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    width: 100%;
}
.console-buttons { 
    display: flex; 
    gap: 12px; 
    overflow-x: auto; 
    scrollbar-width: none; 
    -ms-overflow-style: none; 
    padding: 10px 0; 
    flex-wrap: nowrap; 
    max-width: 100%; 
}
.console-buttons::-webkit-scrollbar { display: none; }
.console-btn{ background:rgba(26,29,41,.85); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:10px 18px; display:flex; align-items:center; gap:8px; cursor:pointer; transition: .3s ease; color:white; font-weight:700; font-size: 13px; white-space: nowrap; flex-shrink: 0; backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
.console-btn:hover{ transform:scale(1.05); border-color:var(--red); box-shadow: 0 0 15px rgba(var(--glow-rgb),.4); }
.console-btn.fav-active-btn{ border-color:var(--gold); }
.console-btn span{ color:white; letter-spacing:.5px; }
.console-btn img{ width:22px; height:22px; object-fit:contain; }
.console-btn .fav-icon-btn { font-size: 18px; color: var(--gold); width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 8px rgba(255,204,0,0.5); }
.products-btn { background: rgba(var(--glow-rgb), 0.15); border-color: rgba(var(--glow-rgb), 0.5); }
.products-btn:hover { background: rgba(var(--glow-rgb), 0.4); }
.products-btn .fav-icon-btn { color: white; text-shadow: none; }

/* Botón flotante Radar */
.top-radar-btn { background:transparent; border:none; cursor: pointer; padding: 4px; position:relative; display: flex; align-items: center; transition: transform 0.2s; }
.top-radar-btn:hover { transform: scale(1.1); }
.top-radar-btn span { position:absolute; top:0; right:0; width:10px; height:10px; background:var(--red); border-radius:50%; box-shadow:0 0 8px var(--red); display: none; }

#backToTopBtn { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 9999; background: var(--red); color: white; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: opacity 0.3s, transform 0.3s; }
#backToTopBtn:hover { transform: scale(1.1); }

/* ================= CAROUSEL & CARDS ================= */
.row{ padding:25px 5%; position: relative; z-index: 5; }
.row h2{ margin-bottom:20px; font-size:1.8rem; letter-spacing: 1px; color: #f9f9f9; }
.carousel{ display:flex; gap:16px; overflow-x:auto; scroll-behavior:smooth; padding-bottom:15px; }
.carousel::-webkit-scrollbar{ display:none; }
.carousel-wrapper{ position:relative; }
.carousel-arrow{ position:absolute; top:50%; transform:translateY(-50%); width:52px; height:52px; border:1px solid rgba(255,255,255,0.1); border-radius:50%; background:rgba(26,29,41,.8); color:white; font-size:28px; cursor:pointer; z-index:50; backdrop-filter:blur(10px); transition:.25s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
.carousel-arrow:hover{ background:var(--red); border-color:var(--red); transform:translateY(-50%) scale(1.1); box-shadow: 0 0 15px rgba(var(--glow-rgb),0.5); }
.carousel-arrow.left{ left:-20px; }
.carousel-arrow.right{ right:-20px; }

.card{ min-width:300px; width: 300px; background:var(--card-bg); border-radius:16px; overflow:hidden; transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease; display: flex; flex-direction: column; position: relative; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
.card:hover{ transform:scale(1.04) translateY(-5px); z-index:20; border-color: var(--red); box-shadow: 0 0 25px rgba(var(--glow-rgb, 229, 9, 20), 0.4), 0 15px 30px rgba(0,0,0,0.6); }
.card img{ width:100%; height:180px; object-fit:cover; flex-shrink: 0; }
.card-info{ padding:18px 18px 10px 18px; flex-grow: 1; display: flex; flex-direction: column; }
.card-info strong{ display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; font-size:17px; white-space: normal; color: #f9f9f9; }
.card-info p{ font-size:14px; color:#aaa; line-height:1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.card-actions { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; padding: 0 15px 15px 15px; gap: 8px; margin-top: auto; }
.action-btn { padding: 10px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s; color: white; display: flex; align-items: center; justify-content: center; background: #4a4d59; } 
.action-btn:hover { background: var(--red) !important; transform: translateY(-3px); box-shadow: 0 4px 10px rgba(var(--glow-rgb), 0.5); }
.action-btn > svg, .action-btn > img { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }

.card.card-recent{ min-width:210px; width: 210px; }
.card.card-recent img{ height: 120px; }
.card.card-recent .card-info{ padding: 12px 12px 6px 12px; }
.card.card-recent .card-info strong{ font-size: 14px; margin-bottom: 4px; }
.card.card-recent .card-info p{ font-size: 12px; -webkit-line-clamp: 2; }
.card.card-recent .card-actions { padding: 0 12px 12px 12px; gap: 6px; }
.card.card-recent .action-btn { padding: 8px; }
.card.card-recent .action-btn > svg, .card.card-recent .action-btn > img { width: 16px; height: 16px; }

.fav-toggle-btn{ position: absolute; top: 12px; right: 12px; background: rgba(9,11,19,.75); border: 1px solid rgba(255,255,255,.15); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 30; display: flex; align-items: center; justify-content: center; transition: .3s; backdrop-filter: blur(5px); }
.fav-toggle-btn:hover{ transform: scale(1.15); background: rgba(9,11,19,.9); border-color: var(--red); }
.fav-toggle-btn.is-fav{ color: var(--gold); border-color: var(--gold); text-shadow: 0 0 8px var(--gold); }

/* SKELETON SCREENS */
.skeleton-card { min-width:300px; width: 300px; height: 300px; background: rgba(26,29,41,.6); border-radius: 16px; display: flex; flex-direction: column; padding: 0; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); }
.skeleton-img { width: 100%; height: 180px; background: rgba(255,255,255,.05); }
.skeleton-text1 { width: 60%; height: 16px; background: rgba(255,255,255,.06); margin: 18px 18px 10px; border-radius: 4px; }
.skeleton-text2 { width: 85%; height: 12px; background: rgba(255,255,255,.04); margin: 0 18px; border-radius: 4px; }
.skeleton-shimmer::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform: translateX(-100%); background-image: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.04) 20%, rgba(255,255,255,0.08) 60%, rgba(255,255,255,0) 100%); animation: shimmer 1.6s infinite; }
@keyframes shimmer { 100% { transform: translateX(100%); } }

@media(max-width:900px){
  .hero h1{ font-size:2.5rem; }
  .hero p{ font-size:1rem; }
  #fileSearch{ width:140px; }
  .card, .skeleton-card{ min-width:240px; width: 240px; }
  .card.card-recent{ min-width:180px; width: 180px; }
  .carousel-arrow{ display:none; }
}
</style>
</head>
<body>

<div id="accessWallOverlay" style="display: none;">
    <div class="disney-access-card">
        <h1 class="disney-logo-title">LA PRESA</h1>
        <p class="disney-subtitle" id="aw-subtitle">Completa los pasos para desbloquear el contenido.</p>
        
        <div class="disney-progress-bar"><div id="disney-progress" class="disney-progress-fill"></div></div>
        
        <button id="disney-btn1" class="disney-step-btn">1. Suscribirse al canal</button>
        <button id="disney-btn2" class="disney-step-btn">2. Participar en el sorteo</button>
        
        <div id="disneyProductsContainer"></div>

</div>

<div id="mainHub">

          <button id="heroBtn"></button>

          <div class="console-buttons" id="consoleButtons"></div>
      </div>

      <div id="recentContainer"></div>

<script>
/* ================= DICCIONARIO DE TRADUCCIONES COMPLETAS ================= */

};

/* ================= VARIABLES GLOBALES ================= */
let idiomaActual = 'es'; 
let mediaFiles = {};
let heroItems = [];
let heroIndex = 0;
let heroInterval; 
let favoritos = JSON.parse(localStorage.getItem('favoriteFiles')) || [];
let recientes = JSON.parse(localStorage.getItem('recentFiles')) || [];
let currentView = { type: 'home', id: null }; 
let accessGranted = false;

/* DOM Elements */
const fileSearch = document.getElementById('fileSearch');
const rowsContainer = document.getElementById('rowsContainer');
const recentContainer = document.getElementById('recentContainer');
const datalist = document.getElementById('file-suggestions');
const themeDotsContainer = document.getElementById('themeDots');
const mybutton = document.getElementById("backToTopBtn");

/* ================= LÓGICA DEL MURO DISNEY ================= */
let s1 = false;
let s2 = false;
let accessProductsData = [];

document.getElementById('disney-btn1').onclick = function() {
    if(s1) return;
    const btn = this;
    const esMembresia = Math.random() < 0.5;
    const url = esMembresia ? 
        "https://www.youtube.com/channel/UCJbYmHLNcrPUUA9oyBGtsKw/join" : 
        "https://www.youtube.com/channel/UCJbYmHLNcrPUUA9oyBGtsKw?sub_confirmation=1";
    
    window.open(url, "_blank", "noopener,noreferrer");
    btn.innerText = "⏳ Verificando en segundo plano...";
    btn.style.opacity = "0.7";
    
    setTimeout(() => {
        s1 = true;
        btn.classList.add('disney-step-done');
        btn.innerText = "✅ Paso 1 completado";
        btn.style.opacity = "1";
        checkProgressDisney();
    }, 40000);
};

document.getElementById('disney-btn2').onclick = function() {
    if(s2) return;
    const container = document.getElementById('disneyProductsContainer');
    container.style.display = (container.style.display === "grid") ? "none" : "grid";
};

async function cargarProductosDisney() {
    const base = 'https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/';
    const files = ['switch.json', 'ps5.json', 'sd_usb.json', '3ds.json'];
    let all = [];

    for (let f of files) {
        try {
            let res = await fetch(base + f + '?nocache=' + Date.now());
            if (res.ok) {
                let data = await res.json();
                all = all.concat(Array.isArray(data) ? data : Object.values(data));
            }
        } catch(e){}
    }

    if (all.length >= 3) {
        all.sort(() => 0.5 - Math.random());
        accessProductsData = all.slice(0, 6);
        renderProductosDisney();
    }
}

function renderProductosDisney() {
    const cont = document.getElementById('disneyProductsContainer');
    cont.innerHTML = '';
    
    accessProductsData.forEach(p => {
        const title = getTranslatedText(p.label, idiomaActual) || p.label || 'Producto';
        const img = p.img || 'https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Logo%20Zip.png';
        let url = p.url || '#';
        if (url !== '#' && !url.includes('tag=')) url += (url.includes('?')?'&':'?') + 'tag=kelonio-21';

        const div = document.createElement('div');
        div.className = 'disney-aw-product';
        div.innerHTML = `<img src="${img}"><span>${title}</span><div class="disney-choose-badge">ELEGIR</div>`;
        div.onclick = () => {
            window.open(url, "_blank", "noopener,noreferrer");
            completarSorteoDisney();
        };
        cont.appendChild(div);
    });
}

function completarSorteoDisney() {
    if(s2) return;
    s2 = true;
    const btn2 = document.getElementById('disney-btn2');
    btn2.classList.add('disney-step-done');
    btn2.innerText = "✅ Paso 2 completado";
    document.getElementById('disneyProductsContainer').style.display = "none";
    checkProgressDisney();
}

function checkProgressDisney() {
    let count = (s1 ? 1 : 0) + (s2 ? 1 : 0);
    document.getElementById('disney-progress').style.width = (count * 50) + "%";
    
    if (count === 2) {
        const fechaActual = new Date().toDateString(); 
        localStorage.setItem("_lp_auth_tk", btoa("lapresa_secreto_" + fechaActual));
        
        setTimeout(() => {
            const overlay = document.getElementById('accessWallOverlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                iniciarAppPrincipal();
            }, 500);
        }, 800);
    }
}

/* ================= LÓGICA DE TRADUCCIÓN COMPLETA ================= */
function getTranslatedText(obj, lang) {
    if (!obj) return '';
    if (typeof obj === 'string') return obj;
    return obj[lang] || obj['es'] || obj['en'] || Object.values(obj)[0] || '';
}

function detectBrowserLanguage() {
  const browserLang = (navigator.language || 'en').split('-')[0].toLowerCase();
  if (translations[browserLang]) { idiomaActual = browserLang; } 
  else { idiomaActual = 'en'; }
}

function createLanguageSelector(){
  const selector = document.getElementById('languageSelector');
  const langs = { es:'Español', en:'English', fr:'Français', de:'Deutsch', it:'Italiano', pt:'Português', ja:'日本語', ko:'한국어' };
  
  selector.innerHTML = '';
  Object.keys(langs).forEach(code=>{
    const opt = document.createElement('option'); opt.value = code; opt.textContent = langs[code];
    selector.appendChild(opt);
  });
  
  selector.value = idiomaActual;
  selector.addEventListener('change', e=>{
    idiomaActual = e.target.value; 
    translateInterface();
    if(accessProductsData.length > 0) renderProductosDisney(); 
    
    if (Object.keys(mediaFiles).length > 0) { 
        renderConsoleButtons(); 
        updateHero(); 
        updateSuggestions(); 
        
        if (currentView.type === 'home') renderAllRows();
        else if (currentView.type === 'console') showConsoleContent(currentView.id);
        else if (currentView.type === 'favorites') showFavoritesContent();
        else if (currentView.type === 'search') triggerSearch(currentView.id);
    }
  });
}

function translateInterface(){
  const t = translations[idiomaActual] || translations['en'];
  document.title = t.title; 
  fileSearch.placeholder = t.search;
  
  const heroBtn = document.getElementById('heroBtn');
  if(heroBtn) heroBtn.textContent = t.watch; 

  const subtitle = document.getElementById('aw-subtitle');
  if(subtitle) subtitle.innerHTML = t.awSubtitle;

  const btn1 = document.getElementById('disney-btn1');
  if(btn1 && !s1) btn1.innerHTML = "1. " + t.awYtBtn;

  const btn2 = document.getElementById('disney-btn2');
  if(btn2 && !s2) btn2.innerHTML = "2. " + t.awGiftBtn;
}

const paletaTemas = {

  amarillo: { hex: '#ffcc00', rgb: '255, 204, 0' },

function initThemeDots() {
  const savedTheme = localStorage.getItem('selectedThemeColor') || 'azul'; 
  Object.keys(paletaTemas).forEach(colorKey => {
    const dot = document.createElement('div'); dot.className = 'color-dot';
    dot.style.backgroundColor = paletaTemas[colorKey].hex; dot.dataset.color = colorKey;
    if (colorKey === savedTheme) { dot.classList.add('active-dot'); }
    dot.addEventListener('click', () => {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active-dot'));
      dot.classList.add('active-dot');
      localStorage.setItem('selectedThemeColor', colorKey);
      applyTheme(colorKey);
    });
    themeDotsContainer.appendChild(dot);
  });
  applyTheme(savedTheme);
}

function applyTheme(colorKey) {
  const theme = paletaTemas[colorKey] || paletaTemas.azul;
  document.documentElement.style.setProperty('--red', theme.hex);
  document.documentElement.style.setProperty('--glow-rgb', theme.rgb);
}

function getItemUniqueId(item, catName) { 
    return `${catName}-${getTranslatedText(item.label, 'en') || 'archivo'}`.toLowerCase().replace(/[^a-z0-9]/g, ''); 
}

/* ================= CARGA DE CONTENIDO Y CATEGORÍAS ================= */
async function loadContent(){
  try{
    const tokenGuardado = localStorage.getItem("_lp_auth_tk");
    const tokenValidoHoy = btoa("lapresa_secreto_" + new Date().toDateString());
    
    if (tokenGuardado !== tokenValidoHoy) {
        alert("Acceso denegado. Completa los pasos nuevamente.");
        location.reload();
        return;
    }

    rowsContainer.innerHTML = `
      <div class="row"><h2>SWITCH</h2><div class="carousel" id="sk-switch"></div></div>

    `;
    renderSkeletons('sk-switch', 5); renderSkeletons('sk-3ds', 5);
    
    const urlCodificada = "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL0tlbG9uaW8taHViL0xpbmstM0RTL21haW4vZGF0YS9jb25zb2xhcy5qc29u"; 
    const urlReal = atob(urlCodificada);

/* ================= HERO & BUSCADOR ================= */
function setupHeroRotation(section = null){
  if(heroInterval) clearInterval(heroInterval);
  heroItems = [];
  
  const targetCategories = section ? [section.toLowerCase()] : ['3ds', 'wii'];

  Object.keys(mediaFiles).forEach(catId => { 
      if (targetCategories.includes(catId.toLowerCase())) {
          mediaFiles[catId].forEach(item => { 
              if (item.videoYoutubeIds) { heroItems.push({ ...item, _category: catId }); }
          }); 
      }
  });

  if(heroItems.length === 0) {
      Object.keys(mediaFiles).forEach(catId => { 
          if (targetCategories.includes(catId.toLowerCase())) {
              mediaFiles[catId].forEach(item => { heroItems.push({ ...item, _category: catId }); }); 
          }
      });
  }

  heroItems.sort(() => 0.5 - Math.random());

  if(!heroItems.length) return;
  
  heroIndex = 0;
  updateHero();
  heroInterval = setInterval(()=>{
    heroIndex++; if(heroIndex >= heroItems.length){ heroIndex = 0; } updateHero();
  },10000);
}

function updateHero(){
  const item = heroItems[heroIndex]; if(!item) return;
  const title = getTranslatedText(item.label, idiomaActual) || 'Nintendo Archive';
  const desc = getTranslatedText(item.desc, idiomaActual) || '';
  const thumb = item.videoYoutubeIds ? `https://img.youtube.com/vi/${item.videoYoutubeIds}/maxresdefault.jpg` : 'https://raw.githubusercontent.com/Kelonio-hub/Archivos-Kelonio/main/img/Logo%20Zip.png';
  
  document.getElementById('heroTitle').textContent = title;
  document.getElementById('heroDesc').textContent = desc;
  document.getElementById('heroBanner').style.backgroundImage = `url('${thumb}')`;
  
  const t = translations[idiomaActual] || translations['en'];
  document.getElementById('heroBtn').textContent = t.watch;
  
  document.getElementById('heroBtn').onclick = () => {
    const catName = item._category || 'switch';
    registerRecentClick(item, catName); 
    if (item.videoYoutubeIds) {
        window.open(`https://www.youtube.com/watch?v=${item.videoYoutubeIds}`, '_blank', 'noopener,noreferrer');
    } else {
        window.open(item.url, '_blank', 'noopener,noreferrer'); 
    }
  };
}

function updateSuggestions(){
  datalist.innerHTML = '';
  const set = new Set();
  Object.values(mediaFiles).forEach(cat=>{
    cat.forEach(item=>{ 
        const translatedLabel = getTranslatedText(item.label, idiomaActual);
        if(translatedLabel) { set.add(translatedLabel); } 
    });
  });
  set.forEach(label=>{
    const opt = document.createElement('option');
    opt.value = label; datalist.appendChild(opt);
  });
}

function triggerSearch(query) {
  currentView = { type: 'search', id: query };
  recentContainer.innerHTML = ''; recentContainer.style.display = 'none'; rowsContainer.innerHTML = '';
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<h2>Resultados</h2><div class="carousel" id="results"></div>`;
  rowsContainer.appendChild(row);
  const results = document.getElementById('results'); results.style.flexWrap = 'wrap'; results.style.overflow = 'visible';
  Object.keys(mediaFiles).forEach(catId => { 
      mediaFiles[catId].forEach(item=>{ 
          const title = getTranslatedText(item.label, idiomaActual).toLowerCase();
          if(title.includes(query)){ createCard(item, catId, results, false); } 
      }); 
  });
  setupHeroRotation();
}

fileSearch.addEventListener('input',()=>{
  const query = fileSearch.value.toLowerCase().trim();
  if(!query){ renderAllRows(); return; }
  triggerSearch(query);
});

/* ================= VISTAS & TARJETAS ================= */
function registerRecentClick(item, catName) {
  const uniqueId = getItemUniqueId(item, catName);
  recientes = recientes.filter(id => id !== uniqueId); recientes.unshift(uniqueId);
  if(recientes.length > 5) recientes.pop();
  localStorage.setItem('recentFiles', JSON.stringify(recientes));
  if(!fileSearch.value.trim() && currentView.type === 'home') { renderRecentRow(); }
}

function renderRecentRow() {
  recentContainer.innerHTML = '';
  if (recientes.length === 0) { recentContainer.style.display = 'none'; return; }
  recentContainer.style.display = 'block';
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<h2 style="font-size:1.5rem; margin-bottom:12px; opacity:0.85;">${(translations[idiomaActual] || translations['en']).recent.toUpperCase()}</h2><div class="carousel" id="recentCarousel"></div>`;
  recentContainer.appendChild(row);
  const carousel = document.getElementById('recentCarousel');

  recientes.forEach(uniqueId => {
    let itemEncontrado = false;
    Object.keys(mediaFiles).forEach(catId => {
      if (itemEncontrado) return;
      mediaFiles[catId].forEach(item => { if (getItemUniqueId(item, catId) === uniqueId) { createCard(item, catId, carousel, true); itemEncontrado = true; } });
    });
  });
}

function renderAllRows(){
  currentView = { type: 'home', id: null };
  rowsContainer.innerHTML = ''; renderRecentRow(); 
  Object.keys(mediaFiles).forEach(catId=>{
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<h2>${catId.toUpperCase()}</h2><div class="carousel-wrapper"><button class="carousel-arrow left">‹</button><div class="carousel" id="car-${catId}"></div><button class="carousel-arrow right">›</button></div>`;
    rowsContainer.appendChild(row);
    const carousel = document.getElementById(`car-${catId}`);
    mediaFiles[catId].forEach(item=>{ createCard(item, catId, carousel, false); });
    row.querySelector('.left').onclick = ()=>{ carousel.scrollBy({ left:-700, behavior:'smooth' }); };
    row.querySelector('.right').onclick = ()=>{ carousel.scrollBy({ left:700, behavior:'smooth' }); };
  });
  setupHeroRotation();
}

function showConsoleContent(consoleId){
  currentView = { type: 'console', id: consoleId };
  recentContainer.innerHTML = ''; recentContainer.style.display = 'none'; rowsContainer.innerHTML = '';
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<h2 style="font-size:2.5rem;margin-bottom:25px;">${consoleId.toUpperCase()}</h2><div class="carousel" id="singleConsole"></div>`;
  rowsContainer.appendChild(row);

}

function showFavoritesContent(){
  currentView = { type: 'favorites', id: null };
  recentContainer.innerHTML = ''; recentContainer.style.display = 'none'; rowsContainer.innerHTML = '';
  const t = translations[idiomaActual] || translations['en'];
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<h2 style="font-size:2.5rem;margin-bottom:25px; display:flex; align-items:center; gap:15px;"><span style="color:var(--gold);">★</span>${t.favorites.toUpperCase()}</h2><div class="carousel" id="favConsole"></div>`;
  rowsContainer.appendChild(row);
  const carousel = document.getElementById('favConsole'); carousel.style.flexWrap = 'wrap'; carousel.style.overflow = 'visible';

  let foundAny = false;
  Object.keys(mediaFiles).forEach(catId => {

  card.querySelector('.watch-btn').onclick = (e)=>{ e.stopPropagation(); if (item.videoYoutubeIds) { window.open(`https://www.youtube.com/watch?v=${item.videoYoutubeIds}`, '_blank', 'noopener,noreferrer'); } else { alert(t.noVideo || "No video."); } };
  
  card.querySelector('.download-btn').onclick = (e)=>{
    e.stopPropagation();
    registerRecentClick(item, catName); 
    window.open(item.url, '_blank', 'noopener,noreferrer');
  };
  
  card.querySelector('.discord-btn').onclick = (e)=>{ e.stopPropagation(); window.open(discordLink, '_blank', 'noopener,noreferrer'); };
  card.querySelector('.donate-btn').onclick = (e)=>{ e.stopPropagation(); window.open(kofiLink, '_blank', 'noopener,noreferrer'); };

  container.appendChild(card);
}

/* ================= RADAR Y OTRAS UTILIDADES ================= */
async function verificarNotificacionesRadar() {
  const badge = document.getElementById('radarBadge');
  if (!badge) return;
  try {
    const response = await fetch('ultimas_noticias.json');
    if(!response.ok) return;
    const noticias = await response.json();
    if(noticias.length > 0) {
      const ultimaFechaNoticia = new Date(noticias[0].date).getTime();
      const ultimaVisitaRadar = localStorage.getItem('ultimaVisitaRadar');
      if(!ultimaVisitaRadar || ultimaFechaNoticia > parseInt(ultimaVisitaRadar)) { badge.style.display = 'block'; }
    }
  } catch (error) { console.log("Aún no hay base de datos del radar."); }
}

function abrirRadar() {
  localStorage.setItem('ultimaVisitaRadar', Date.now().toString());
  window.open('actualizaciones.html', '_self');
}

window.onscroll = function() {
  if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) { mybutton.style.display = "block"; } else { mybutton.style.display = "none"; }
};
