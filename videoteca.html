<style>
/* ================= VARIABLES Y TEMA AUTOMÁTICO/MANUAL ================= */
:root, :root[data-theme="dark"] {
  --red: #00aaff; 
  --glow-rgb: 0, 170, 255; 
  --bg: #141414;
  --text-main: #ffffff;
  --text-muted: #aaa;
  --glass: rgba(20,20,20,.78);
  --glass-border: rgba(255,255,255,.08);
  --topbar-bg: rgba(0,0,0,.88);
  --card-bg: rgba(255,255,255,0.02);
  --input-bg: rgba(255,255,255,.08);
  --btn-bg: rgba(255,255,255,.05);
  --icon-color: #ffffff;
  --loader-border: rgba(255,255,255,0.1);
}

:root[data-theme="light"] {
  --bg: #f8f9fa;
  --text-main: #141414;
  --text-muted: #555555;
  --glass: rgba(255,255,255,.9);
  --glass-border: rgba(0,0,0,.15);
  --topbar-bg: rgba(255,255,255,.95);
  --card-bg: #ffffff;
  --input-bg: rgba(0,0,0,.05);
  --btn-bg: rgba(0,0,0,.05);
  --icon-color: #333333;
  --loader-border: rgba(0,0,0,0.1);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f8f9fa;
    --text-main: #141414;
    --text-muted: #555555;
    --glass: rgba(255,255,255,.9);
    --glass-border: rgba(0,0,0,.15);
    --topbar-bg: rgba(255,255,255,.95);
    --card-bg: #ffffff;
    --input-bg: rgba(0,0,0,.05);
    --btn-bg: rgba(0,0,0,.05);
    --icon-color: #333333;
    --loader-border: rgba(0,0,0,0.1);
  }
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text-main); overflow-x:hidden; transition: background 0.3s, color 0.3s; }

/* ================= TOPBAR ================= */
.topbar { position:fixed; top:0; left:0; right:0; z-index:9999; background:var(--topbar-bg); backdrop-filter:blur(16px); display:flex; justify-content:space-between; align-items:center; padding:8px 3%; gap: 10px; transition: background 0.3s; }
.topbar-left { display:flex; align-items:center; gap: 15px; flex-shrink: 0; }
.logo { font-size:1.8rem; font-weight:900; color:var(--red); letter-spacing:-1.5px; transition: color 0.3s ease; text-decoration: none; cursor: pointer;}
.social-group { display: flex; gap: 4px; border-left: 1px solid var(--glass-border); padding-left: 15px; transition: border-color 0.3s; }

.social-icon-btn { background:transparent; border:none; cursor: pointer; color: var(--icon-color); opacity: 0.55; transition: 0.3s; display: flex; align-items: center; justify-content: center; padding: 4px; position: relative;}
.social-icon-btn:hover { opacity: 1; transform: scale(1.15); color: var(--red); }
.radar-badge { position:absolute; top:-2px; right:-2px; width:10px; height:10px; background:var(--red); border-radius:50%; box-shadow:0 0 8px var(--red); display: none; }

.right-tools { display:flex; align-items:center; gap:12px; flex-shrink: 0; }
.config-group { display:flex; flex-direction:column; align-items:center; gap:4px; }
.theme-dots-container { display:flex; gap:5px; align-items: center;}
.color-dot { width:12px; height:12px; border-radius:50%; cursor:pointer; border:1px solid rgba(0,0,0,0.4); transition:transform .2s, border-color .2s; }
.color-dot:hover { transform:scale(1.3); }
.color-dot.active-dot { border:2px solid var(--text-main); transform:scale(1.15); box-shadow: 0 0 8px rgba(128,128,128,0.6); }

#languageSelector { background:var(--input-bg); border:1px solid var(--glass-border); color:var(--text-main); padding:4px 8px; border-radius:6px; outline: none; cursor: pointer; font-size:11px; transition: 0.3s; }
#languageSelector option { background: var(--bg); color: var(--text-main); }

#fileSearch { background:var(--input-bg); border:1px solid transparent; color:var(--text-main); width:170px; padding:8px 14px; border-radius:50px; font-size:13px; outline:none; transition: width 0.3s ease, border-color 0.3s, background 0.3s; }
#fileSearch:focus { width: 200px; border-color: var(--red); }
#fileSearch::placeholder { color:var(--text-muted); }

/* ================= HEADER HERO & ANIMACIÓN SATPULSE ================= */
.header-section { padding: 120px 5% 30px; text-align: center; background: linear-gradient(to bottom, rgba(var(--glow-rgb),0.15) 0%, var(--bg) 100%); transition: background 0.3s; }
.header-section h1 { font-size: 3rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 16px; margin: 0 auto; }
.hero-guide-icon { width: 3.2rem; height: 3.2rem; color: var(--red); filter: drop-shadow(0 0 14px rgba(var(--glow-rgb), 0.7)); transition: color 0.3s ease; animation: satPulse 3.5s infinite ease-in-out; flex-shrink: 0; }
@keyframes satPulse { 0%, 100% { transform: scale(1) translateY(0px); filter: drop-shadow(0 0 12px rgba(var(--glow-rgb), 0.6)); } 50% { transform: scale(1.12) translateY(-4px); filter: drop-shadow(0 0 26px rgba(var(--glow-rgb), 1)); } }
.header-section p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; transition: color 0.3s; }
.hero-warning { color: var(--red); font-size: 0.85rem !important; font-style: italic; margin-top: 15px !important; font-weight: 600; opacity: 0.9; }

/* ================= ZONA PERSONAL (FAVORITOS & HISTORIAL) ================= */
.personal-zone { padding: 10px 5% 30px; }
.personal-section-container { margin-bottom: 30px; }
.personal-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 15px; color: var(--text-main); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--glass-border); padding-bottom: 8px; }
.personal-row { display: flex; gap: 20px; overflow-x: auto; padding: 10px 5px 20px; scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: var(--red) var(--glass-border); }
.personal-row::-webkit-scrollbar { height: 6px; }
.personal-row::-webkit-scrollbar-thumb { background: var(--red); border-radius: 10px; }
.personal-row::-webkit-scrollbar-track { background: var(--glass-border); border-radius: 10px; }
.personal-card { flex: 0 0 280px; scroll-snap-align: start; }
.empty-personal-msg { color: var(--text-muted); font-size: 0.95rem; font-style: italic; background: var(--card-bg); border: 1px dashed var(--glass-border); padding: 25px; border-radius: 12px; text-align: center; width: 100%; }

/* ================= CONSOLE BUTTONS ================= */
.console-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; padding: 10px 5% 30px; }
.console-btn { background: var(--btn-bg); border: 1px solid var(--glass-border); border-radius: 10px; padding: 8px 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: .3s ease; color: var(--text-main); font-weight: 700; font-size: 12px; white-space: nowrap; }
.console-btn:hover { transform: scale(1.05); border-color: var(--red); background: rgba(var(--glow-rgb),.15); }
.console-btn.fav-active-btn { border-color: var(--red); background: rgba(var(--glow-rgb),.25); box-shadow: 0 0 10px rgba(var(--glow-rgb), 0.5); }
.console-btn span { color: var(--text-main); letter-spacing: .5px; transition: color 0.3s; }
.console-btn img { width: 18px; height: 18px; object-fit: contain; filter: drop-shadow(0 0 2px rgba(0,0,0,0.5)); }

/* ================= GRID DE VÍDEOS ================= */
.updates-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; padding: 0 5% 60px; }
.update-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 18px; transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s, background 0.3s; display: flex; flex-direction: column; height: 100%; cursor: pointer; position: relative; }
.update-card:hover { transform: translateY(-5px); border-color: var(--red); box-shadow: 0 0 20px rgba(var(--glow-rgb), 0.25), 0 10px 20px rgba(0,0,0,0.15); }

/* Estilos de Miniaturas de YouTube */
.thumbnail-wrapper { position: relative; width: 100%; padding-top: 56.25%; background-color: #000; border-radius: 10px; overflow: hidden; margin-bottom: 15px; border: 1px solid var(--glass-border); }
.thumbnail-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
.update-card:hover .thumbnail-wrapper img { transform: scale(1.05); }

.play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background-color: rgba(0, 0, 0, 0.75); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; transition: background-color 0.3s, border-color 0.3s, transform 0.3s; box-shadow: 0 0 15px rgba(0,0,0,0.5); pointer-events: none; }
.play-icon::after { content: ""; display: block; width: 0; height: 0; border-left: 16px solid #fff; border-top: 10px solid transparent; border-bottom: 10px solid transparent; margin-left: 4px; transition: border-left-color 0.3s; }
.update-card:hover .play-icon { background-color: var(--red); border-color: var(--red); transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 20px rgba(var(--glow-rgb), 0.8); }

/* CORAZÓN DE FAVORITOS & ETIQUETA VISTO */
.fav-heart { position: absolute; top: 8px; right: 8px; z-index: 10; background: rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.7); border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(4px); }
.fav-heart:hover { transform: scale(1.2); color: #fff; border-color: #fff; background: rgba(0,0,0,0.85); }
.fav-heart.active-heart { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 0 12px rgba(var(--glow-rgb), 0.8); animation: heartPop 0.3s ease; }
@keyframes heartPop { 0% { transform: scale(1); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }

.watched-badge { position: absolute; top: 8px; left: 8px; z-index: 10; background: rgba(0,0,0,0.8); border: 1px solid var(--red); color: #fff; font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 20px; display: flex; align-items: center; gap: 4px; backdrop-filter: blur(4px); letter-spacing: 0.5px; }

.update-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.update-tag { background: var(--btn-bg); border: 1px solid var(--glass-border); color: var(--text-main); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; text-transform: uppercase; transition: background 0.3s, color 0.3s; }
/* Aplicamos var(--red) tanto al h3 como al enlace interno */
.update-card h3, 
.update-card h3 a { 
  font-size: 1.15rem; 
  margin-bottom: 8px; 
  line-height: 1.3; 
  color: var(--red); /* El título ahora usará siempre el color del tema elegido */
  text-decoration: none; /* Elimina el subrayado por defecto de los enlaces */
  transition: color 0.3s ease, filter 0.3s ease; 
  display: -webkit-box; 
  -webkit-line-clamp: 2; 
  -webkit-box-orient: vertical; 
  overflow: hidden; 
}

/* Efecto al pasar el ratón por encima de la tarjeta */
.update-card:hover h3, 
.update-card:hover h3 a { 
  filter: brightness(1.25); /* Le da un toque más brillante al color del tema al pasar el cursor */
}
.update-body { color: var(--text-muted); font-size: 0.88rem; line-height: 1.4; margin-bottom: 16px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; transition: color 0.3s; }
.update-footer { margin-top: auto; }
.download-link { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: var(--red); color: white !important; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; transition: filter 0.3s, background 0.3s; }
.download-link:hover { filter: brightness(1.2); }

/* ================= LOADER ================= */
.loader-container { text-align: center; padding: 50px; width: 100%; grid-column: 1 / -1; display: none; }
.spinner { width: 50px; height: 50px; border: 5px solid var(--loader-border); border-top-color: var(--red); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; transition: border-color 0.3s; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ================= BOTÓN SUBIR ================= */
#backToTopBtn { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 9998; background: var(--red); color: white; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: opacity 0.3s, transform 0.3s; }
#backToTopBtn:hover { transform: scale(1.1); }

/* ================= VENTANA FLOTANTE (MODAL DE VÍDEO) ================= */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; padding: 20px; }
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal-content { position: relative; width: 100%; max-width: 850px; background: var(--bg); border: 1px solid var(--glass-border); border-radius: 16px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(var(--glow-rgb), 0.3); }
.modal-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); background: var(--card-bg); }
.modal-title { font-size: 1.2rem; font-weight: bold; color: var(--text-main); }
.close-btn { background: none; border: none; color: var(--text-muted); font-size: 2rem; cursor: pointer; line-height: 1; transition: color 0.2s, transform 0.2s; }
.close-btn:hover { color: var(--red); transform: scale(1.1); }
.video-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
.video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

@media(max-width: 1150px) { 
  .topbar { flex-wrap: wrap; padding: 10px 4%; justify-content: center; } 
  .topbar-left { order: 1; } 
  .right-tools { order: 2; margin-top: 5px; flex-wrap: wrap; justify-content: center; } 
}
@media(max-width: 650px) { 
  .right-tools { width: 100%; gap: 15px; } 
  #fileSearch { width: 100%; order: 3; margin-top: 10px; } 
  #fileSearch:focus { width: 100%; } 
  .config-group { flex-direction: row; order: 2; gap: 15px; justify-content: center; width: 100%; } 
  .header-section { padding-top: 220px; } 
}
</style>

<script>
  /* ================= PRE-CARGA DE TEMA PARA EVITAR FLASH ================= */
  (function() {
    const savedMode = localStorage.getItem('selectedMode');
    if (savedMode === 'dark' || savedMode === 'light') {
      document.documentElement.setAttribute('data-theme', savedMode);
    }
    const savedTheme = localStorage.getItem('selectedThemeColor');
    if (savedTheme) {
      const paleta = {
        rojo:     { hex: '#e50914', rgb: '229, 9, 20' },
        naranja:  { hex: '#ff6600', rgb: '255, 102, 0' },
        amarillo: { hex: '#ffcc00', rgb: '255, 204, 0' },
        verde:    { hex: '#2ecc71', rgb: '46, 204, 113' },
        azul:     { hex: '#00aaff', rgb: '0, 170, 255' },
        violeta:  { hex: '#9b59b6', rgb: '155, 89, 182' },
        rosa:     { hex: '#ff80ab', rgb: '255, 128, 171' }
      };
      const theme = paleta[savedTheme];
      if (theme) {
        document.documentElement.style.setProperty('--red', theme.hex);
        document.documentElement.style.setProperty('--glow-rgb', theme.rgb);
      }
    }
  })();
</script>

let idiomaActual = 'es'; 
let categoriasUnicas = new Set();

const mybutton = document.getElementById("backToTopBtn");

/* ================= PALETA DE COLORES ================= */
const paletaTemas = {
  rojo: { hex: '#e50914', rgb: '229, 9, 20' }, naranja: { hex: '#ff6600', rgb: '255, 102, 0' }, amarillo: { hex: '#ffcc00', rgb: '255, 204, 0' },
  verde: { hex: '#2ecc71', rgb: '46, 204, 113' }, azul: { hex: '#00aaff', rgb: '0, 170, 255' }, violeta: { hex: '#9b59b6', rgb: '155, 89, 182' }, rosa: { hex: '#ff80ab', rgb: '255, 128, 171' }
};

function initThemeDots() {
  const savedTheme = localStorage.getItem('selectedThemeColor') || 'azul';
  const savedMode = localStorage.getItem('selectedMode') || 'dark';
  
  themeDotsContainer.innerHTML = '';
  
  Object.keys(paletaTemas).forEach(colorKey => {
    const dot = document.createElement('div'); 
    dot.className = 'color-dot theme-color-dot'; 
    dot.style.backgroundColor = paletaTemas[colorKey].hex;
    dot.setAttribute('aria-label', `Tema ${colorKey}`);
    if (colorKey === savedTheme) dot.classList.add('active-dot');
    dot.addEventListener('click', () => {
      document.querySelectorAll('.theme-color-dot').forEach(d => d.classList.remove('active-dot'));
      dot.classList.add('active-dot'); 
      localStorage.setItem('selectedThemeColor', colorKey); 
      applyTheme(colorKey);
    });
    themeDotsContainer.appendChild(dot);
  });

  const separador = document.createElement('div');
  separador.style.width = '2px';
  separador.style.backgroundColor = 'var(--glass-border)';
  separador.style.margin = '0 6px';
  separador.style.borderRadius = '2px';
  themeDotsContainer.appendChild(separador);

  const dotOscuro = document.createElement('div');
  dotOscuro.className = 'color-dot mode-dot';
  dotOscuro.style.backgroundColor = '#141414';
  dotOscuro.style.border = '1px solid #555';
  dotOscuro.setAttribute('title', 'Forzar Modo Oscuro');
  
  const dotClaro = document.createElement('div');
  dotClaro.className = 'color-dot mode-dot';
  dotClaro.style.backgroundColor = '#f8f9fa';
  dotClaro.style.border = '1px solid #ccc';
  dotClaro.setAttribute('title', 'Forzar Modo Claro');

  if (savedMode === 'dark') {
    dotOscuro.classList.add('active-dot');
    document.documentElement.setAttribute('data-theme', 'dark');
  } else if (savedMode === 'light') {
    dotClaro.classList.add('active-dot');
    document.documentElement.setAttribute('data-theme', 'light');
  }

  dotOscuro.addEventListener('click', () => {
    document.querySelectorAll('.mode-dot').forEach(d => d.classList.remove('active-dot'));
    dotOscuro.classList.add('active-dot');
    localStorage.setItem('selectedMode', 'dark');
    document.documentElement.setAttribute('data-theme', 'dark');
  });

  dotClaro.addEventListener('click', () => {
    document.querySelectorAll('.mode-dot').forEach(d => d.classList.remove('active-dot'));
    dotClaro.classList.add('active-dot');
    localStorage.setItem('selectedMode', 'light');
    document.documentElement.setAttribute('data-theme', 'light');
  });

  themeDotsContainer.appendChild(dotOscuro);
  themeDotsContainer.appendChild(dotClaro);
  applyTheme(savedTheme);
}

function applyTheme(colorKey) {
  const theme = paletaTemas[colorKey] || paletaTemas.azul;
  document.documentElement.style.setProperty('--red', theme.hex); 
  document.documentElement.style.setProperty('--glow-rgb', theme.rgb);
}

/* ================= SELECTOR DE IDIOMAS ================= */
function createLanguageSelector(){
  const selector = document.getElementById('languageSelector'); selector.innerHTML = '';
  const langs = { es:'Español', en:'English', fr:'Français', de:'Deutsch', it:'Italiano', pt:'Português', ja:'日本語', ko:'한국어' };
  
  Object.keys(langs).forEach(code=>{
    const opt = document.createElement('option'); opt.value = code; opt.textContent = langs[code]; selector.appendChild(opt);
  });
  
  const savedLang = localStorage.getItem('preferredLanguage');
  const browserLang = (navigator.language || navigator.userLanguage || 'es').split('-')[0].toLowerCase();
  
  if (savedLang && translations[savedLang]) { idiomaActual = savedLang; } 
  else if (translations[browserLang]) { idiomaActual = browserLang; } 
  else { idiomaActual = 'es'; }
  
  selector.value = idiomaActual;
  selector.addEventListener('change', e => {
    idiomaActual = e.target.value; localStorage.setItem('preferredLanguage', idiomaActual);
    updateLanguage(); renderFilterButtons(); renderVideos(); renderizarSeccionesPersonales();
  });
}

function updateLanguage(){
  const t = translations[idiomaActual] || translations['es'];
  document.title = t.title;
  
  const titleNode = document.getElementById('heroTitle');
  const textSpan = titleNode.querySelector('span');
  if (textSpan) textSpan.textContent = ' ' + t.heroTitle;

  document.getElementById('heroDesc').textContent = t.heroDesc;
  document.getElementById('heroWarning').textContent = t.heroWarning || "";
  fileSearch.placeholder = t.search;

  document.getElementById('titleFavs').textContent = t.favs;
  document.getElementById('titleHistory').textContent = t.history;

  if (document.getElementById('videosBtn')) document.getElementById('videosBtn').title = t.videos;
  if (document.getElementById('radarBtn')) document.getElementById('radarBtn').title = t.radar;
  if (document.getElementById('productsBtn')) document.getElementById('productsBtn').title = t.products;
  if (document.getElementById('guideBtn')) document.getElementById('guideBtn').title = t.guides;
  if (document.getElementById('discordBtn')) document.getElementById('discordBtn').title = t.discord;
  if (document.getElementById('kofiBtn')) document.getElementById('kofiBtn').title = t.kofi;
}

/* ================= HISTORIAL Y FAVORITOS EN LOCALSTORAGE ================= */
function registrarVideoVisto(videoId) {
  let historial = JSON.parse(localStorage.getItem('kelonio_history')) || [];
  historial = historial.filter(id => id !== videoId);
  historial.unshift(videoId);
  if (historial.length > 8) historial.pop();
  
  localStorage.setItem('kelonio_history', JSON.stringify(historial));
  renderizarSeccionesPersonales();
  renderVideos();
}

function toggleFavorito(event, videoId) {
  event.stopPropagation();
  let favoritos = JSON.parse(localStorage.getItem('kelonio_favs')) || [];
  
  if (favoritos.includes(videoId)) {
    favoritos = favoritos.filter(id => id !== videoId);
  } else {
    favoritos.push(videoId);
  }
  
  localStorage.setItem('kelonio_favs', JSON.stringify(favoritos));
  renderizarSeccionesPersonales();
  renderVideos();
}

function esFavorito(videoId) {
  const favs = JSON.parse(localStorage.getItem('kelonio_favs')) || [];
  return favs.includes(videoId);
}

function esVisto(videoId) {
  const hist = JSON.parse(localStorage.getItem('kelonio_history')) || [];
  return hist.includes(videoId);
}

/* ================= RENDERIZAR ZONA PERSONAL ================= */
function crearTarjetaHTML(video, t) {
  const videoId = video.id;
  const titulo = video.label[idiomaActual] || video.label['en'] || video.label['es'] || 'Vídeo';
  const descripcion = video.desc[idiomaActual] || video.desc['en'] || video.desc['es'] || '';
  const thumbnailUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
  const safeTitle = titulo.replace(/"/g, '&quot;').replace(/'/g, "\\'");
  
  const isFav = esFavorito(videoId);
  const heartClass = isFav ? 'fav-heart active-heart' : 'fav-heart';
  const vistoHTML = esVisto(videoId) ? `<div class="watched-badge">${t.watched}</div>` : '';

  return `
    <div class="update-card personal-card" onclick="openModal('${videoId}', '${safeTitle}')">
      <div class="thumbnail-wrapper">
        <img src="${thumbnailUrl}" alt="${titulo}" loading="lazy">
        <div class="play-icon"></div>
        ${vistoHTML}
        <button class="${heartClass}" onclick="toggleFavorito(event, '${videoId}')" title="Favorito" aria-label="Favorito">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
      </div>
      <div class="update-header">
        <span class="update-tag">${video.console}</span>
      </div>
      <h3><a href="javascript:void(0);">${titulo}</a></h3>
      <div class="update-body">${descripcion}</div>
      <div class="update-footer">
        <span class="download-link">${t.read}</span>
      </div>
    </div>
  `;
}

function renderizarSeccionesPersonales() {
  const t = translations[idiomaActual] || translations['es'];
  const rowFavs = document.getElementById('rowFavs');
  const rowHistory = document.getElementById('rowHistory');
  
  const favIds = JSON.parse(localStorage.getItem('kelonio_favs')) || [];
  const histIds = JSON.parse(localStorage.getItem('kelonio_history')) || [];

  const mapVideos = new Map();
  todosLosVideos.forEach(v => mapVideos.set(v.id, v));

  // Render Favoritos
  if (favIds.length === 0) {
    rowFavs.innerHTML = `<div class="empty-personal-msg">${t.favEmpty}</div>`;
  } else {
    let htmlFavs = '';
    favIds.forEach(id => {
      const vid = mapVideos.get(id);
      if (vid) htmlFavs += crearTarjetaHTML(vid, t);
    });
    rowFavs.innerHTML = htmlFavs;
  }

  // Render Historial
  if (histIds.length === 0) {
    rowHistory.innerHTML = `<div class="empty-personal-msg">${t.histEmpty}</div>`;
  } else {
    let htmlHist = '';
    histIds.forEach(id => {
      const vid = mapVideos.get(id);
      if (vid) htmlHist += crearTarjetaHTML(vid, t);
    });
    rowHistory.innerHTML = htmlHist;
  }
}

/* ================= BOTONES DINÁMICOS ================= */

  consoleButtons.innerHTML = '';
  const t = translations[idiomaActual] || translations['es'];

  const btnAll = document.createElement('button');
  btnAll.className = 'console-btn' + (filtroActual === 'ALL' ? ' fav-active-btn' : '');
  btnAll.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg><span>${t.all.toUpperCase()}</span>`;
  btnAll.onclick = () => { filtroActual = 'ALL'; renderFilterButtons(); renderVideos(); };
  consoleButtons.appendChild(btnAll);

  const iconMap = {
    'SWITCH':'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%20Switch.png',
    '3DS':'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%203DS.png',
    'NDS':'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%20NDS.png',
    'NDSI':'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%20NDS.png',
    'WII':'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%20Wii.png',
    'WII MINI':'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%20Mini.png',
    'WII U':'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%20WiiU.png',
    'VWII':'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%20vWii.png',
    'SD':'https://raw.githubusercontent.com/Kelonio-hub/Link-3DS/main/img/Logo%20SD.png',
    'SONY':'https://api.iconify.design/ri:playstation-line.svg?color=%23ffffff',
    'XBOX':'https://api.iconify.design/ri:xbox-line.svg?color=%23ffffff'
  };

  const ordenDeseado = ['SWITCH', '3DS', 'NDS', 'NDSI', 'WII', 'WII MINI', 'WII U', 'VWII', 'SD', 'SONY', 'XBOX'];

  const categoriasOrdenadas = Array.from(categoriasUnicas).sort((a, b) => {
    const indexA = ordenDeseado.indexOf(a);
    const indexB = ordenDeseado.indexOf(b);
    if (indexA !== -1 && indexB !== -1) return indexA - indexB;
    if (indexA !== -1) return -1;
    if (indexB !== -1) return 1;
    return a.localeCompare(b);
  });

  categoriasOrdenadas.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'console-btn' + (filtroActual === cat ? ' fav-active-btn' : '');
    const iconSrc = iconMap[cat] ? `<img src="${iconMap[cat]}" alt="Logo ${cat}">` : `<span>📁</span>`;
    btn.innerHTML = `${iconSrc}<span>${cat}</span>`;
    btn.onclick = () => { filtroActual = cat; renderFilterButtons(); renderVideos(); };
    consoleButtons.appendChild(btn);
  });
}

/* ================= LÓGICA RADAR DE ACTUALIZACIONES ================= */
async function verificarNotificacionesRadar() {
  const badge = document.getElementById('radarBadge');
  if (!badge) return;
  try {
    const response = await fetch('ultimas_noticias.json');
    if(!response.ok) return;
    const noticias = await response.json();
    if(noticias.length > 0) {
      const ultimaFechaNoticia = new Date(noticias[0].date).getTime();
      const ultimaVisitaRadar = localStorage.getItem('ultimaVisitaRadar');
      if(!ultimaVisitaRadar || ultimaFechaNoticia > parseInt(ultimaVisitaRadar)) { badge.style.display = 'block'; }
    }
  } catch (error) { console.log("Aún no hay base de datos del radar."); }
}

function abrirRadar() {
  localStorage.setItem('ultimaVisitaRadar', Date.now().toString());
  window.open('https://kelonio-hub.github.io/Archivos-Kelonio/actualizaciones.html', '_self');
}

/* ================= RENDERIZAR PARRILLA GENERAL DE VÍDEOS ================= */
function renderVideos() {
  const t = translations[idiomaActual] || translations['es'];
  const query = fileSearch.value.toLowerCase().trim();
  updatesGrid.innerHTML = '';

  let filtrados = todosLosVideos;
  
  if (filtroActual !== 'ALL') {
    filtrados = filtrados.filter(v => v.console === filtroActual);
  }
  
  if (query) {
    filtrados = filtrados.filter(v => {
      let tituloAct = (v.label[idiomaActual] || v.label['en'] || v.label['es'] || '').toLowerCase();
      let descAct = (v.desc[idiomaActual] || v.desc['en'] || v.desc['es'] || '').toLowerCase();
      return tituloAct.includes(query) || descAct.includes(query) || v.console.toLowerCase().includes(query);
    });
  }

  if (filtrados.length === 0) {
    updatesGrid.innerHTML = `<p style="color:#aaa; text-align:center; grid-column:1/-1; font-size:1.15rem; padding: 50px 0;">${t.empty}</p>`;
    return;
  }

  let htmlResult = '';
  filtrados.forEach(video => {
    htmlResult += crearTarjetaHTML(video, t);
  });
  updatesGrid.innerHTML = htmlResult;
}

/* ================= CARGA DE DATOS DE CONSOLAS.JSON ================= */
async function cargarDatosVideos() {
  const loader = document.getElementById('mainLoader');
  loader.style.display = 'block';

  try {
    const response = await fetch('consolas.json', { cache: "no-store" });
    if (!response.ok) throw new Error("No se pudo cargar consolas.json");
    
    const consolasData = await response.json();
    todosLosVideos = [];
    categoriasUnicas.clear();

    for (const [consoleName, items] of Object.entries(consolasData)) {
      const consoleUpper = consoleName.trim().toUpperCase();
      
      items.forEach(item => {
        if (item.videoYoutubeIds && item.videoYoutubeIds.length > 0) {
          categoriasUnicas.add(consoleUpper);
          
          // Soporte automático para tutoriales divididos en múltiples vídeos
          if (item.videoYoutubeIds.length === 1) {
            todosLosVideos.push({
              id: item.videoYoutubeIds[0],
              console: consoleUpper,
              label: item.label,
              desc: item.desc
            });
          } else {
            item.videoYoutubeIds.forEach((vidId, idx) => {
              let multiLabel = {};
              for (let lang in item.label) {
                multiLabel[lang] = `${item.label[lang]} (Pt. ${idx + 1})`;
              }
              todosLosVideos.push({
                id: vidId,
                console: consoleUpper,
                label: multiLabel,
                desc: item.desc
              });
            });
          }
        }
      });
    }

    loader.style.display = 'none';
    renderFilterButtons();
    renderizarSeccionesPersonales();
    renderVideos();
    console.log(`⚡ Cargados ${todosLosVideos.length} vídeos correctamente.`);
  } catch (error) {
    console.error("Error cargando videoteca:", error);
    loader.style.display = 'none';
    updatesGrid.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:var(--red); padding: 40px;">No se pudo cargar <b>consolas.json</b>. Asegúrate de que el archivo existe en el servidor.</p>`;
  }
}

/* ================= VENTANA FLOTANTE (MODAL) ================= */
function openModal(videoId, title) {
  registrarVideoVisto(videoId);
  
  const modal = document.getElementById('video-modal');
  const iframe = document.getElementById('youtube-frame');
  const modalTitle = document.getElementById('modal-title-text');

  modalTitle.textContent = title;
  iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
  modal.classList.add('active');
}

function closeModal(event) {
  if (event.target.classList.contains('modal-overlay')) {
    closeModalBtn();
  }
}

function closeModalBtn() {
  const modal = document.getElementById('video-modal');
  const iframe = document.getElementById('youtube-frame');
  
  modal.classList.remove('active');
  iframe.src = ''; 
}

/* Permitir cerrar el modal pulsando la tecla ESC */
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    const modal = document.getElementById('video-modal');
    if (modal && modal.classList.contains('active')) {
      closeModalBtn();
    }
  }
});

/* ================= LISTENERS Y ARRANQUE ================= */
let timeoutBuscador = null;
fileSearch.addEventListener('input', () => {
  clearTimeout(timeoutBuscador);
  timeoutBuscador = setTimeout(() => {
    renderVideos();
  }, 250);
});

window.onscroll = function() {
  mybutton.style.display = (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) ? "block" : "none";
};

window.onload = () => {
  initThemeDots();
  createLanguageSelector();
  updateLanguage();
  cargarDatosVideos();
  verificarNotificacionesRadar();
};
</script>
